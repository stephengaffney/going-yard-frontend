<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Going Yard">
<meta name="theme-color" content="#0a0a0f">
<title>Going Yard & Drinking Hard</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #15151d;
  --surface2: #1e1e28;
  --border: rgba(255,255,255,0.06);
  --text: #f0f0f0;
  --muted: #888;
  --accent: #e8c14a;
  --team-primary: #e8c14a;
  --team-secondary: #e8c14a;

  --shadow-sm: 0 1px 3px rgba(0,0,0,0.3), 0 4px 12px rgba(0,0,0,0.18);
  --shadow-card: 0 2px 6px rgba(0,0,0,0.32), 0 10px 28px rgba(0,0,0,0.22);
  --ease-premium: cubic-bezier(0.16, 1, 0.3, 1);

  --frank-color: #e85d4a;
  --scott-color: #4a9eff;
  --tyler-color: #7cb85c;
  --ned-color: #c97de8;
  --ryan-color: #e87c3e;
  --steve-color: #4acfe8;
  --dan-color: #e84a8a;
  --stephen-color: #e8c14a;
}

/* ── Baseball seam background ── */
.seam-bg {
  position: relative;
  overflow: hidden;
}

.seam-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(ellipse 180px 60px at 20% 30%, transparent 55%, rgba(255,255,255,0.018) 56%, rgba(255,255,255,0.018) 58%, transparent 59%),
    radial-gradient(ellipse 180px 60px at 80% 70%, transparent 55%, rgba(255,255,255,0.018) 56%, rgba(255,255,255,0.018) 58%, transparent 59%);
  pointer-events: none;
  z-index: 0;
}

/* ── Player headshot ── */
.player-headshot {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  object-position: top center;
  border: 2px solid var(--border);
  background: var(--surface2);
  flex-shrink: 0;
}

.player-headshot-wrap {
  position: relative;
  flex-shrink: 0;
}

.player-headshot-fallback {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--surface2);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  letter-spacing: 1px;
  flex-shrink: 0;
}

/* ── Team color accent strip on header ── */
.header-team-strip {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--team-primary), var(--team-secondary), transparent);
  opacity: 0.6;
  transition: background 0.5s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.app { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; }

/* ── Tab transition ── */
@keyframes tab-enter {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tab-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.tab-screen.animating {
  animation: tab-enter 0.25s ease both;
}

/* ── Auth Screen ── */
.auth-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.auth-screen.seam-bg::before {
  background-image:
    radial-gradient(ellipse 300px 100px at 15% 25%, transparent 55%, rgba(255,255,255,0.022) 56%, rgba(255,255,255,0.022) 58%, transparent 59%),
    radial-gradient(ellipse 300px 100px at 85% 75%, transparent 55%, rgba(255,255,255,0.022) 56%, rgba(255,255,255,0.022) 58%, transparent 59%),
    radial-gradient(ellipse 200px 70px at 50% 50%, transparent 55%, rgba(255,255,255,0.015) 56%, rgba(255,255,255,0.015) 58%, transparent 59%);
}

.auth-screen::before {
  content: '';
  position: absolute;
  top: -200px; left: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(232,193,74,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.auth-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  color: var(--accent);
  text-align: center;
  line-height: 1;
  margin-bottom: 0.5rem;
  letter-spacing: 1.5px;
}

.auth-sub {
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
  margin-bottom: 3rem;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.auth-card {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2rem;
  box-shadow: var(--shadow-card);
}

.auth-card h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 1px;
  margin-bottom: 1.5rem;
  color: var(--text);
}

.form-group { margin-bottom: 1rem; }

.form-group label {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 0.5rem;
}

.form-group input, .form-group select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-group select option { background: var(--surface2); }

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: #0a0a0f;
  border: none;
  border-radius: 10px;
  padding: 0.875rem;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 1.5px;
  cursor: pointer;
  margin-top: 1rem;
  transition: opacity 0.25s var(--ease-premium), transform 0.2s var(--ease-premium);
}

.btn-primary:hover { opacity: 0.9; }
.btn-primary:active { transform: scale(0.97); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.auth-toggle {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.auth-toggle span { color: var(--accent); cursor: pointer; text-decoration: underline; }

.error-msg {
  background: rgba(232,74,74,0.1);
  border: 1px solid rgba(232,74,74,0.3);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.875rem;
  color: #e84a4a;
  margin-bottom: 1rem;
}

/* ── Nav ── */
.nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 0.5rem 0 calc(0.5rem + env(safe-area-inset-bottom));
  z-index: 100;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 0.5rem;
  cursor: pointer;
  transition: opacity 0.25s var(--ease-premium), color 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
  border: none;
  background: none;
  color: var(--muted);
}

.nav-item:active { transform: scale(0.93); }
.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; }
.nav-item span { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }

.nav-item-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.unread-dot {
  position: absolute;
  top: -2px;
  right: -4px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
  animation: unread-pulse 2s ease infinite;
}

@keyframes unread-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%       { transform: scale(1.2); opacity: 0.8; }
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.25rem;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-title {
  display: flex;
  flex-direction: column;
  line-height: 1;
  gap: 1px;
}

.live-dot-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.65rem;
  color: #7cb85c;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #7cb85c;
  box-shadow: 0 0 0 0 rgba(124,184,92,0.6);
  animation: live-pulse 1.5s ease infinite;
  flex-shrink: 0;
}

@keyframes live-pulse {
  0%   { box-shadow: 0 0 0 0   rgba(124,184,92,0.6); }
  70%  { box-shadow: 0 0 0 6px rgba(124,184,92,0); }
  100% { box-shadow: 0 0 0 0   rgba(124,184,92,0); }
}

.header-title-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: var(--accent);
  letter-spacing: 1.5px;
}

.header-title-sub {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.7rem;
  color: #555;
  letter-spacing: 3px;
}

.header-user {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
}

/* ── Feed ── */
.feed {
  flex: 1;
  padding: 1rem 1rem 6rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* ── HR Card status variants ── */
@keyframes card-enter {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hr-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  position: relative;
  transition: border-color 0.4s var(--ease-premium), box-shadow 0.4s var(--ease-premium);
  animation: card-enter 0.6s var(--ease-premium) both;
  box-shadow: var(--shadow-card);
}

/* Awaiting approval — gold pulse */
.hr-card.awaiting-approval {
  border-color: rgba(232,193,74,0.55);
  animation: pulse-yellow-card 3.2s var(--ease-premium) infinite;
}

/* Pending — gold pulse */
.hr-card.pending {
  border-color: rgba(232,193,74,0.55);
  animation: pulse-yellow-card 3.2s var(--ease-premium) infinite;
}

/* Late — red pulse */
.hr-card.late {
  border-color: rgba(232,74,74,0.6);
  animation: pulse-red-card 2.6s var(--ease-premium) infinite;
}

/* Completed late — orange static border, no pulse (done but tardy) */
.hr-card.completed-late {
  border-color: rgba(232,140,74,0.5);
  box-shadow: var(--shadow-card), 0 0 0 1px rgba(232,140,74,0.18);
}

@keyframes pulse-yellow-card {
  0%, 100% { box-shadow: var(--shadow-card), 0 0 0 0   rgba(232,193,74,0.28); }
  50%       { box-shadow: var(--shadow-card), 0 0 0 7px rgba(232,193,74,0); }
}

@keyframes pulse-red-card {
  0%, 100% { box-shadow: var(--shadow-card), 0 0 0 0   rgba(232,74,74,0.35); }
  50%       { box-shadow: var(--shadow-card), 0 0 0 8px rgba(232,74,74,0); }
}

.hr-card-accent { height: 3px; width: 100%; }
.hr-card-body { padding: 1rem 1.25rem; }

.hr-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.hr-player { display: flex; flex-direction: column; gap: 2px; }

.hr-player-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 0.5px;
  line-height: 1;
}

.hr-player-team {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.hr-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0.4rem 0.75rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.hr-badge.i-drink {
  background: rgba(232,193,74,0.08);
  color: var(--accent);
  border: 1px solid rgba(232,193,74,0.2);
}

.hr-badge.you-drink {
  background: rgba(74,159,255,0.08);
  color: #4a9eff;
  border: 1px solid rgba(74,159,255,0.2);
}

.hr-drink-info {
  background: var(--surface2);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  margin-bottom: 0.75rem;
  font-size: 0.875rem;
}

.hr-drink-info strong { color: var(--text); }

.hr-timestamp {
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 0.75rem;
}

.drink-countdown {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
  margin-left: 8px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.3px;
}

.drink-countdown.ok {
  background: rgba(124,184,92,0.08);
  color: #7cb85c;
  border: 1px solid rgba(124,184,92,0.18);
}

.drink-countdown.warning {
  background: rgba(232,193,74,0.08);
  color: var(--accent);
  border: 1px solid rgba(232,193,74,0.2);
}

.drink-countdown.urgent {
  background: rgba(232,74,74,0.08);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.22);
  animation: pulse-red 1.8s var(--ease-premium) infinite;
}

.drink-countdown.overdue {
  background: rgba(232,74,74,0.12);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.3);
  font-weight: 700;
}

/* ── Drink status badge ── */
.drink-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 0.5rem;
  flex-wrap: wrap;
}

.drink-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.drink-status-badge.pending {
  background: rgba(136,136,136,0.08);
  color: #999;
  border: 1px solid rgba(136,136,136,0.18);
}

.drink-status-badge.awaiting {
  background: rgba(232,193,74,0.08);
  color: var(--accent);
  border: 1px solid rgba(232,193,74,0.25);
}

.drink-status-badge.completed {
  background: rgba(124,184,92,0.08);
  color: #7cb85c;
  border: 1px solid rgba(124,184,92,0.22);
}

.drink-status-badge.late,
.drink-status-badge.vacated {
  background: rgba(232,74,74,0.08);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.28);
}

.drink-status-badge.completed-late {
  background: rgba(232,140,74,0.08);
  color: #e88c4a;
  border: 1px solid rgba(232,140,74,0.28);
}

/* ── Actions row ── */
.hr-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.action-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  cursor: pointer;
  padding: 0.4rem 0.75rem;
  border-radius: 20px;
  transition: background 0.25s var(--ease-premium), color 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
}

.action-btn:hover { background: var(--surface2); color: var(--text); }
.action-btn:active { transform: scale(0.94); }
.action-btn.liked { color: #e84a4a; }
.action-btn svg { width: 16px; height: 16px; }

.assign-btn {
  margin-left: auto;
  background: rgba(74,159,255,0.08);
  border: 1px solid rgba(74,159,255,0.22);
  color: #4a9eff;
  border-radius: 10px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
}

.assign-btn:hover { background: rgba(74,159,255,0.16); }
.assign-btn:active { transform: scale(0.96); }

.approve-btn {
  background: rgba(124,184,92,0.08);
  border: 1px solid rgba(124,184,92,0.25);
  color: #7cb85c;
  border-radius: 10px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
  margin-left: auto;
}

.approve-btn:hover { background: rgba(124,184,92,0.18); }
.approve-btn:active { transform: scale(0.96); }

.feed-link-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(232,193,74,0.08);
  border: 1px solid rgba(232,193,74,0.22);
  color: var(--accent);
  border-radius: 10px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
  white-space: nowrap;
}

.feed-link-btn:hover { background: rgba(232,193,74,0.16); }
.feed-link-btn:active { transform: scale(0.96); }

/* ── Comments ── */
.comments-section {
  padding: 0 1.25rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.comment { display: flex; gap: 0.5rem; align-items: flex-start; }

.comment-body {
  background: var(--surface2);
  border-radius: 10px;
  padding: 0.5rem 0.75rem;
  flex: 1;
}

.comment-username { font-size: 0.75rem; font-weight: 600; margin-bottom: 2px; }
.comment-text { font-size: 0.875rem; color: var(--text); }

.comment-input-row {
  display: flex;
  gap: 0.5rem;
  padding: 0.75rem 1.25rem 1rem;
  border-top: 1px solid var(--border);
}

.comment-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.5rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  outline: none;
}

.comment-input:focus { border-color: var(--accent); }

.send-btn {
  background: var(--accent);
  border: none;
  border-radius: 50%;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.send-btn svg { width: 16px; height: 16px; }

.comment-delete-btn {
  background: none;
  border: none;
  color: transparent;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  line-height: 1;
  font-size: 0.7rem;
  transition: color 0.15s;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}

.comment-delete-btn {
  color: #555;
}

.comment-delete-btn:hover {
  color: #e84a4a !important;
}

/* ── Reply threading ── */
.comment-replies {
  margin-left: 36px;
  margin-top: 4px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  border-left: 2px solid var(--border);
  padding-left: 8px;
}

.reply-btn {
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.7rem;
  cursor: pointer;
  padding: 2px 0;
  text-align: left;
  transition: color 0.15s;
}
.reply-btn:hover { color: var(--accent); }

.reply-input-row {
  display: flex;
  gap: 0.4rem;
  margin-left: 36px;
  margin-top: 4px;
}

.reply-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 0.35rem 0.75rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  outline: none;
}
.reply-input:focus { border-color: var(--accent); }

/* ── Settings Screen ── */
.settings-screen {
  flex: 1;
  padding: 1rem 1rem 6rem;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.settings-section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  letter-spacing: 1.5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 0.5rem;
  padding: 0 0.25rem;
}

.settings-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.settings-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  gap: 1rem;
}
.settings-row:last-child { border-bottom: none; }

.settings-row-label {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  color: var(--text);
}

.settings-row-icon { font-size: 1rem; }

.toggle-switch {
  position: relative;
  width: 44px;
  height: 24px;
  flex-shrink: 0;
}

.toggle-switch input {
  opacity: 0;
  width: 0;
  height: 0;
  position: absolute;
}

.toggle-track {
  position: absolute;
  inset: 0;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}

.toggle-switch input:checked + .toggle-track {
  background: rgba(232,193,74,0.2);
  border-color: var(--accent);
}

.toggle-track::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--muted);
  transition: transform 0.2s, background 0.2s;
}

.toggle-switch input:checked + .toggle-track::after {
  transform: translateX(20px);
  background: var(--accent);
}

/* ── Leaderboard ── */
.leaderboard-screen { flex: 1; padding: 1rem 1rem 6rem; }

.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 1.5px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 0.75rem;
  padding: 0 0.25rem;
}

.lb-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-sm);
}

.lb-row {
  display: flex;
  align-items: center;
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  gap: 0.75rem;
  transition: background 0.25s var(--ease-premium);
}

.lb-row:last-child { border-bottom: none; }

@media (hover: hover) {
  .lb-row:hover { background: var(--surface2); }
}

.lb-rank {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  color: var(--muted);
  width: 24px;
  text-align: center;
}

.lb-rank.gold { color: var(--accent); }
.lb-rank.silver { color: #aaa; }
.lb-rank.bronze { color: #cd7f32; }

.lb-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
.lb-sub { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }

.lb-stat {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  min-width: 36px;
  text-align: right;
}

.lb-stat-group {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.lb-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: right;
}

.late-badge {
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: 10px;
  background: rgba(232,74,74,0.15);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.35);
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* ── Log Screen ── */
.log-screen { flex: 1; padding: 1rem 1rem 6rem; }

.log-table {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-sm);
}

.log-header {
  display: grid;
  grid-template-columns: 72px 1fr 1fr 68px;
  padding: 0.8rem 1rem;
  background: var(--surface2);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1.5px;
  border-bottom: 1px solid var(--border);
}

/* Log rows get a soft inset accent based on status instead of a hard border */
.log-row {
  display: grid;
  grid-template-columns: 72px 1fr 1fr 68px;
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
  align-items: center;
  box-shadow: inset 3px 0 0 0 transparent;
  transition: box-shadow 0.3s var(--ease-premium), background 0.25s var(--ease-premium);
}

.log-row:last-child { border-bottom: none; }
.log-row.status-late,
.log-row.status-vacated        { box-shadow: inset 3px 0 0 0 rgba(232,74,74,0.55); }
.log-row.status-completed_late { box-shadow: inset 3px 0 0 0 rgba(232,140,74,0.55); }
.log-row.status-awaiting       { box-shadow: inset 3px 0 0 0 rgba(180,180,180,0.35); }
.log-row.status-completed      { box-shadow: inset 3px 0 0 0 rgba(124,184,92,0.55); }
.log-row.status-pending        { box-shadow: inset 3px 0 0 0 rgba(136,136,136,0.25); }

.log-status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
  flex-shrink: 0;
}

.log-status-dot.pending   { background: #666; }
.log-status-dot.awaiting  { background: #999; }
.log-status-dot.completed { background: #7cb85c; }
.log-status-dot.late,
.log-status-dot.vacated        { background: #e84a4a; }
.log-status-dot.completed_late { background: #e88c4a; }

/* ── Assign Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

/* Swipe-to-dismiss sheet — applied to inner sheet elements */
.swipeable {
  touch-action: pan-x;
  transition: transform 0.2s ease, opacity 0.2s ease;
  will-change: transform;
}

.modal {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 1.5rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
}

.modal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 1.5rem;
}

.modal h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.5px;
  margin-bottom: 1.5rem;
}

.user-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.user-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  padding: 0.75rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface2);
}

.user-option:hover { border-color: var(--accent); }
.user-option.selected { border-color: var(--accent); background: rgba(232,193,74,0.1); }
.user-option span { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.msg-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  outline: none;
  margin-bottom: 1rem;
  resize: none;
  height: 80px;
}

.msg-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 0.75rem; }

.btn-cancel {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.75rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
  transition: background 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
}

.btn-cancel:active { transform: scale(0.97); }

.btn-confirm {
  flex: 2;
  background: var(--accent);
  border: none;
  border-radius: 10px;
  padding: 0.75rem;
  color: #0a0a0f;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 0.5px;
  cursor: pointer;
  transition: transform 0.15s var(--ease-premium), opacity 0.25s var(--ease-premium);
}

.btn-confirm:active { transform: scale(0.97); }
.btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Empty / loading ── */
.empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }

.loading { display: flex; align-items: center; justify-content: center; padding: 3rem; }

.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── I Drink Progress Board ── */
.progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-sm);
}

.progress-row {
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
}

.progress-row:last-child { border-bottom: none; }

.progress-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
}

.progress-names {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.progress-user {
  font-size: 0.875rem;
  font-weight: 500;
}

.progress-player {
  font-size: 0.75rem;
  color: var(--muted);
}

.progress-count {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  min-width: 48px;
  text-align: right;
  line-height: 1;
}

.progress-count span {
  font-size: 0.7rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
}

.progress-bar-track {
  height: 8px;
  background: var(--surface2);
  border-radius: 6px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 6px;
  transition: width 0.6s var(--ease-premium);
  position: relative;
  transform-origin: left center;
  animation: fill-grow 0.9s var(--ease-premium) both;
  box-shadow: 0 0 10px rgba(255,255,255,0.12);
}

@keyframes fill-grow {
  from { transform: scaleX(0); }
  to   { transform: scaleX(1); }
}

.progress-row:nth-child(1) .progress-bar-fill { animation-delay: 0.02s; }
.progress-row:nth-child(2) .progress-bar-fill { animation-delay: 0.08s; }
.progress-row:nth-child(3) .progress-bar-fill { animation-delay: 0.14s; }
.progress-row:nth-child(4) .progress-bar-fill { animation-delay: 0.2s; }
.progress-row:nth-child(5) .progress-bar-fill { animation-delay: 0.26s; }
.progress-row:nth-child(6) .progress-bar-fill { animation-delay: 0.32s; }
.progress-row:nth-child(7) .progress-bar-fill { animation-delay: 0.38s; }

.progress-bar-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
  border-radius: 6px;
}

/* ── Reaction Emojis ── */
.reactions-bar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding: 0.4rem 0;
}

.reaction-btn {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 8px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--muted);
  line-height: 1;
}

.reaction-btn:hover { border-color: var(--accent); transform: scale(1.08); }

.reaction-btn.reacted {
  background: rgba(232,193,74,0.1);
  border-color: rgba(232,193,74,0.4);
  color: var(--accent);
}

.reaction-count {
  font-size: 0.7rem;
  font-weight: 600;
}

.reaction-picker {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.reaction-picker-btn {
  background: none;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 16px;
  transition: transform 0.15s, background 0.15s;
  line-height: 1;
}

.reaction-picker-btn:hover { transform: scale(1.3); background: var(--surface2); }

/* ── Date Range Calendar ── */
.cal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.cal-sheet {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border);
  padding: 0 1.25rem 0;
  max-height: 92vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
}

.cal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 1rem auto 1.25rem;
}

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}

.cal-month-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  color: var(--text);
}

.cal-nav-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text);
  font-size: 1rem;
  transition: background 0.15s;
}

.cal-nav-btn:hover { background: var(--border); }

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 4px;
}

.cal-weekday {
  text-align: center;
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 4px 0;
}

.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-day {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.82rem;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text);
  transition: background 0.12s, color 0.12s;
  border: 1px solid transparent;
  position: relative;
  min-height: 36px;
  max-height: 44px;
}

.cal-day:hover:not(.cal-day-empty):not(.cal-day-disabled) {
  background: var(--surface2);
  border-color: var(--border);
}

.cal-day.cal-day-empty { cursor: default; }
.cal-day.cal-day-disabled { color: var(--muted); cursor: default; opacity: 0.4; }

.cal-day.cal-day-start,
.cal-day.cal-day-end {
  background: var(--accent);
  color: #0a0a0f;
  font-weight: 600;
}

.cal-day.cal-day-in-range {
  background: rgba(232,193,74,0.15);
  border-radius: 0;
  color: var(--accent);
}

.cal-day.cal-day-start { border-radius: 8px 0 0 8px; }
.cal-day.cal-day-end   { border-radius: 0 8px 8px 0; }
.cal-day.cal-day-start.cal-day-end { border-radius: 8px; }

.cal-day.cal-day-today {
  border-color: var(--accent);
}

.cal-day.cal-day-has-data::after {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.cal-day.cal-day-start::after,
.cal-day.cal-day-end::after { background: #0a0a0f; }

.cal-range-label {
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
  margin: 0 0 1rem;
  min-height: 1.2rem;
  padding: 0.5rem 0.5rem 0.75rem;
  border-bottom: 1px solid var(--border);
}

.cal-range-label span { color: var(--accent); font-weight: 500; }

.cal-actions {
  display: flex;
  gap: 0.75rem;
  margin-top: 1rem;
  position: sticky;
  bottom: 0;
  background: var(--surface);
  padding: 0.75rem 0 calc(5rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
}

.cal-btn-clear {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
}

.cal-btn-apply {
  flex: 2;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 0.75rem;
  color: #0a0a0f;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 1px;
  cursor: pointer;
}

.cal-btn-apply:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── My Drinks Summary ── */
.my-drinks-bar {
  display: flex;
  gap: 0.6rem;
  padding: 0.85rem 1rem 0;
}

.my-drinks-stat {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 0.65rem;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.75rem 0.9rem;
  box-shadow: var(--shadow-sm);
  font-family: 'DM Sans', sans-serif;
  text-align: left;
  cursor: default;
}

.my-drinks-stat.clickable {
  cursor: pointer;
  transition: background 0.2s, transform 0.15s, border-color 0.2s;
}

.my-drinks-stat.clickable:hover { background: var(--surface2); }
.my-drinks-stat.clickable:active { transform: scale(0.98); }

.my-drinks-stat.owe {
  border-color: rgba(232,74,74,0.2);
}

.my-drinks-stat.assign {
  border-color: rgba(74,159,255,0.2);
}

.my-drinks-icon {
  font-size: 1.3rem;
  line-height: 1;
  flex-shrink: 0;
}

.my-drinks-text {
  display: flex;
  flex-direction: column;
  line-height: 1.15;
  min-width: 0;
}

.my-drinks-count {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 0.5px;
}

.my-drinks-stat.owe .my-drinks-count { color: #e84a4a; }
.my-drinks-stat.assign .my-drinks-count { color: #4a9eff; }

.my-drinks-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.my-drinks-sub {
  font-size: 0.65rem;
  color: #e84a4a;
  font-weight: 600;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── My Drinks Sheet (tap-through list) ── */
.my-drinks-sheet-empty {
  text-align: center;
  padding: 2rem 1rem;
  color: var(--muted);
  font-size: 0.9rem;
}

.my-drinks-sheet-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  max-height: 50vh;
  overflow-y: auto;
  margin-bottom: 1rem;
}

.my-drinks-sheet-row {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 0.6rem 0.75rem;
  font-family: 'DM Sans', sans-serif;
  text-align: left;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.my-drinks-sheet-row:hover { border-color: var(--accent); }

.my-drinks-sheet-row-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.my-drinks-sheet-row-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.05rem;
  letter-spacing: 0.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.my-drinks-sheet-row-sub {
  font-size: 0.7rem;
  color: var(--muted);
}

/* ── Weekly Recap Banner (Feed tab) ── */
.recap-banner {
  display: flex;
  align-items: center;
  gap: 0.65rem;
  margin: 0.85rem 1rem 0;
  padding: 0.75rem 0.9rem;
  background: linear-gradient(135deg, rgba(232,193,74,0.14), rgba(232,193,74,0.05));
  border: 1px solid rgba(232,193,74,0.3);
  border-radius: 16px;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}

.recap-banner:hover { background: linear-gradient(135deg, rgba(232,193,74,0.2), rgba(232,193,74,0.08)); }
.recap-banner:active { transform: scale(0.99); }

.recap-banner-icon {
  font-size: 1.4rem;
  line-height: 1;
  flex-shrink: 0;
}

.recap-banner-text {
  flex: 1;
  min-width: 0;
}

.recap-banner-title {
  font-size: 0.85rem;
  color: var(--text);
  line-height: 1.3;
}

.recap-banner-sub {
  font-size: 0.68rem;
  color: var(--muted);
  margin-top: 2px;
}

.recap-banner-close {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 0.9rem;
  cursor: pointer;
  padding: 4px 6px;
  flex-shrink: 0;
  line-height: 1;
}

.recap-banner-close:hover { color: var(--text); }

/* ── Weekly Recap tab (Leaderboard screen) ── */
.recap-week-label {
  text-align: center;
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 1rem;
}

.recap-lb-card {
  margin-bottom: 1.25rem;
}

/* ── Admin Drink Log Editor (Settings, Steve only) ── */
.admin-search-input {
  margin-bottom: 0.75rem;
}

.admin-log-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.admin-log-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}

.admin-log-row-summary {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  padding: 0.65rem 0.85rem;
  cursor: pointer;
}

.admin-log-row-summary:hover { background: var(--surface2); }

.admin-log-date {
  font-size: 0.7rem;
  color: var(--muted);
  width: 52px;
  flex-shrink: 0;
}

.admin-log-names {
  flex: 1;
  min-width: 0;
  font-size: 0.82rem;
}

.admin-log-chevron {
  font-size: 0.6rem;
  color: var(--muted);
  flex-shrink: 0;
}

.admin-log-edit {
  padding: 0.75rem 0.85rem 1rem;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 0.65rem;
  background: var(--surface2);
}

.admin-field {
  display: flex;
  flex-direction: column;
  gap: 0.3rem;
}

.admin-field label {
  font-size: 0.65rem;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  color: var(--muted);
}

.admin-field select,
.admin-field input {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.5rem 0.65rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.85rem;
}

.admin-edit-actions {
  display: flex;
  gap: 0.5rem;
  margin-top: 0.25rem;
}

.admin-edit-actions .btn-cancel,
.admin-edit-actions .btn-confirm {
  flex: 1;
}

/* ── Search & Filter Bar ── */
.search-bar {
  padding: 0.75rem 1rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  background: var(--bg);
  position: sticky;
  top: 57px;
  z-index: 40;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.75rem;
}

.search-input-wrap {
  position: relative;
}

.search-input-wrap svg {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.55rem 0.75rem 0.55rem 2.25rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }

.filter-chips {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.filter-chips::-webkit-scrollbar { display: none; }

.filter-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  padding: 0.3rem 0.65rem;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: border-color 0.25s var(--ease-premium), color 0.25s var(--ease-premium), background 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
  flex-shrink: 0;
}

.filter-chip:hover { border-color: var(--accent); color: var(--text); }
.filter-chip:active { transform: scale(0.95); }

.filter-chip.active {
  background: rgba(232,193,74,0.12);
  border-color: var(--accent);
  color: var(--accent);
}

.filter-chip.active-red {
  background: rgba(232,74,74,0.12);
  border-color: #e84a4a;
  color: #e84a4a;
}

.filter-chip.active-blue {
  background: rgba(74,159,255,0.12);
  border-color: #4a9eff;
  color: #4a9eff;
}

.filter-chip.active-green {
  background: rgba(124,184,92,0.12);
  border-color: #7cb85c;
  color: #7cb85c;
}

.filter-chip.active-orange {
  background: rgba(232,140,74,0.12);
  border-color: #e88c4a;
  color: #e88c4a;
}

.filter-divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  align-self: center;
  flex-shrink: 0;
}

.no-results {
  text-align: center;
  padding: 3rem 2rem;
  color: var(--muted);
  font-size: 0.875rem;
}

/* ── Video Tab ── */
.videos-screen {
  flex: 1;
  padding: 1rem 1rem 6rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.video-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.video-card-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.875rem 1rem 0.75rem;
}

.video-card-meta {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.video-card-title {
  font-size: 0.875rem;
  font-weight: 600;
}

.video-card-sub {
  font-size: 0.72rem;
  color: var(--muted);
}

.video-card-time {
  font-size: 0.7rem;
  color: var(--muted);
}

.video-player {
  width: 100%;
  max-height: 320px;
  object-fit: cover;
  display: block;
  background: #000;
}

.video-filter-row {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0.75rem 1rem 0;
  scrollbar-width: none;
}

.video-filter-row::-webkit-scrollbar { display: none; }

/* Video link button on cards */
.video-link-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(201,125,232,0.08);
  border: 1px solid rgba(201,125,232,0.25);
  color: #c97de8;
  border-radius: 10px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: background 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
  margin-left: auto;
  white-space: nowrap;
}

.video-link-btn:hover { background: rgba(201,125,232,0.16); }
.video-link-btn:active { transform: scale(0.96); }

.video-link-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

/* Upload modal */
.upload-modal {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 1.5rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
  box-shadow: 0 -8px 32px rgba(0,0,0,0.4);
}

.upload-warning {
  background: rgba(232,193,74,0.06);
  border: 1px solid rgba(232,193,74,0.2);
  border-radius: 14px;
  padding: 0.875rem 1rem;
  font-size: 0.825rem;
  color: var(--accent);
  margin-bottom: 1.25rem;
  line-height: 1.5;
}

.upload-warning strong { display: block; margin-bottom: 4px; font-size: 0.9rem; }

.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 16px;
  padding: 2rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.25s var(--ease-premium), background 0.25s var(--ease-premium);
  margin-bottom: 1rem;
  position: relative;
}

.upload-zone:hover { border-color: #c97de8; background: rgba(201,125,232,0.03); }
.upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}

.upload-zone-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.upload-zone-text { font-size: 0.875rem; color: var(--muted); }
.upload-zone-hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; opacity: 0.7; }

.upload-preview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 16px;
  margin-bottom: 1rem;
  display: block;
  box-shadow: var(--shadow-sm);
}

.upload-progress {
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 1rem;
}

.upload-progress-fill {
  height: 100%;
  background: #c97de8;
  border-radius: 2px;
  transition: width 0.3s var(--ease-premium);
}

/* Log tab video link */
.log-video-link {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 0.68rem;
  color: #c97de8;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  font-family: 'DM Sans', sans-serif;
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* ── In-app recording ── */
.record-zone {
  position: relative;
  border-radius: 20px;
  overflow: hidden;
  background: #000;
  margin-bottom: 1rem;
  aspect-ratio: 9/16;
  max-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-card);
}

.record-preview {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transform: scaleX(-1);
}

.record-countdown {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 1.5px;
  padding: 4px 10px;
  border-radius: 10px;
  min-width: 48px;
  text-align: center;
  border: 1px solid rgba(255,255,255,0.08);
}

.record-countdown.urgent { color: #e84a4a; }

.record-dot {
  position: absolute;
  top: 14px;
  left: 12px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #e84a4a;
  animation: live-pulse 1.2s var(--ease-premium) infinite;
}

.record-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 4px solid #fff;
  background: #e84a4a;
  cursor: pointer;
  transition: transform 0.2s var(--ease-premium), border-radius 0.2s var(--ease-premium);
  flex-shrink: 0;
}

.record-btn:hover { transform: scale(1.06); }
.record-btn:active { transform: scale(0.96); }
.record-btn.recording { background: #fff; border-color: #e84a4a; border-radius: 10px; width: 44px; height: 44px; }

.record-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1rem 0 0.5rem;
}

.record-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.record-tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.record-tab {
  flex: 1;
  padding: 0.6rem;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: border-color 0.25s var(--ease-premium), color 0.25s var(--ease-premium), background 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
  text-align: center;
}

.record-tab:active { transform: scale(0.97); }

.record-tab.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(232,193,74,0.08);
}

.browser-warning {
  background: rgba(232,140,74,0.1);
  border: 1px solid rgba(232,140,74,0.35);
  border-radius: 10px;
  padding: 0.875rem 1rem;
  font-size: 0.82rem;
  color: #e88c4a;
  margin-bottom: 1rem;
  line-height: 1.5;
  text-align: center;
}

/* ── Admin video toggle ── */
.video-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px 3px 6px;
  cursor: pointer;
  font-size: 0.7rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
  white-space: nowrap;
}

.video-toggle:hover { border-color: var(--accent); color: var(--text); }
.video-toggle.on { border-color: #7cb85c; color: #7cb85c; background: rgba(124,184,92,0.08); }
.video-toggle.off { border-color: #e84a4a; color: #e84a4a; background: rgba(232,74,74,0.08); }

.toggle-pip {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}

.video-toggle.on  .toggle-pip { background: #7cb85c; }
.video-toggle.off .toggle-pip { background: #e84a4a; }

/* ── Podium Layout ── */
.podium-wrap {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 0.5rem;
  padding: 1.25rem 1rem 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px 16px 0 0;
  border-bottom: none;
}

.podium-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  flex: 1;
}

.podium-slot.first  { order: 2; }
.podium-slot.second { order: 1; }
.podium-slot.third  { order: 3; }

.podium-avatar-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}

.podium-slot.first .avatar {
  animation: trophy-glow 2.6s var(--ease-premium) infinite;
}

@keyframes trophy-glow {
  0%, 100% { box-shadow: 0 0 0 4px rgba(232,193,74,0.12), 0 0 20px rgba(232,193,74,0.28); }
  50%      { box-shadow: 0 0 0 4px rgba(232,193,74,0.18), 0 0 30px rgba(232,193,74,0.42); }
}

.podium-crown {
  font-size: 1.1rem;
  line-height: 1;
  margin-bottom: 2px;
  filter: drop-shadow(0 2px 5px rgba(232,193,74,0.35));
}

.podium-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.85rem;
  letter-spacing: 1px;
  text-align: center;
}

.podium-drinks {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  text-align: center;
}

.podium-late {
  font-size: 0.6rem;
  color: #e84a4a;
  font-weight: 600;
  letter-spacing: 0.5px;
}

.podium-base {
  width: 100%;
  border-radius: 6px 6px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  color: rgba(255,255,255,0.4);
}

.podium-slot.first  .podium-base { height: 56px; background: linear-gradient(180deg, rgba(232,193,74,0.3), rgba(232,193,74,0.1)); border: 1px solid rgba(232,193,74,0.3); border-bottom: none; }
.podium-slot.second .podium-base { height: 40px; background: linear-gradient(180deg, rgba(180,180,180,0.2), rgba(180,180,180,0.05)); border: 1px solid rgba(180,180,180,0.2); border-bottom: none; }
.podium-slot.third  .podium-base { height: 28px; background: linear-gradient(180deg, rgba(205,127,50,0.2), rgba(205,127,50,0.05)); border: 1px solid rgba(205,127,50,0.2); border-bottom: none; }

.podium-rest-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: none;
  border-radius: 0 0 16px 16px;
  overflow: hidden;
  margin-bottom: 1.5rem;
  box-shadow: var(--shadow-sm);
}

/* ── Leaderboard pill tabs ── */
.lb-pills {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0.75rem 0 0.5rem;
  scrollbar-width: none;
  flex-shrink: 0;
}
.lb-pills::-webkit-scrollbar { display: none; }

.lb-pill {
  white-space: nowrap;
  padding: 0.35rem 0.85rem;
  border-radius: 20px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.75rem;
  letter-spacing: 1px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: border-color 0.25s var(--ease-premium), color 0.25s var(--ease-premium), background 0.25s var(--ease-premium), transform 0.15s var(--ease-premium);
  flex-shrink: 0;
}
.lb-pill:hover { border-color: var(--accent); color: var(--text); }
.lb-pill:active { transform: scale(0.95); }
.lb-pill.active {
  background: rgba(232,193,74,0.08);
  border-color: var(--accent);
  color: var(--accent);
}

/* ── Notification filter pills ── */
.notif-filter-row {
  display: flex;
  gap: 0.35rem;
  flex-wrap: wrap;
  padding: 0.6rem 1rem;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.notif-filter-pill {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 20px;
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: 0.5px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.15s;
  white-space: nowrap;
}
.notif-filter-pill.on {
  background: rgba(232,193,74,0.1);
  border-color: var(--accent);
  color: var(--accent);
}
.notif-filter-pill.off {
  background: rgba(136,136,136,0.08);
  border-color: transparent;
  color: #555;
  text-decoration: line-through;
}

/* ── Deep link highlight flash ── */
@keyframes highlight-flash {
  0%   { box-shadow: 0 0 0 0   rgba(232,193,74,0); border-color: var(--border); }
  20%  { box-shadow: 0 0 0 8px rgba(232,193,74,0.5); border-color: rgba(232,193,74,0.9); }
  60%  { box-shadow: 0 0 0 8px rgba(232,193,74,0.3); border-color: rgba(232,193,74,0.7); }
  100% { box-shadow: 0 0 0 0   rgba(232,193,74,0); border-color: var(--border); }
}

.hr-card.highlight,
.video-card.highlight {
  animation: highlight-flash 1.8s ease-out forwards !important;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 90px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.75rem 1.5rem;
  font-size: 0.875rem;
  z-index: 300;
  animation: fadeInUp 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
  white-space: nowrap;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }
  to   { opacity: 1; transform: translateX(-50%) translateY(0); }
}

@keyframes fadeOut { to { opacity: 0; } }

/* ── Splash progress bar ── */
.splash-progress-wrap {
  width: 160px;
  height: 3px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  overflow: hidden;
  opacity: 1;
  margin-top: 0.5rem;
}

.splash-progress-bar {
  height: 100%;
  background: #e8c14a;
  border-radius: 2px;
  width: 0%;
  transition: width 0.3s ease;
  animation: splash-load 3s ease forwards;
}

@keyframes splash-load {

// ── Helpers ──────────────────────────────────────────────────────────────

/**
 * Compute the effective drink status for a drink_log row.
 *
 * Rules (applied client-side so the feed is always fresh even if the
 * backend late-sweep hasn't run yet):
 *
 *  completed          → always show completed, never override
 *  pending/awaiting   → if event_date > 24h ago → late
 *  pending            → still waiting (i_drink not yet approved,
 *                        or you_drink not yet assigned)
 *  awaiting_approval  → assigned but approval pending
 */

function relativeTime(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins  = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);
  if (diff < 60000)   return 'just now';
  if (hours < 1)      return `${mins}m ago`;
  if (hours < 24)     return `${hours}h ago`;
  // Fallback to absolute for >= 24h
  return new Date(dateStr).toLocaleString('en-US', {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true
  });
}

function computeStatus(drinkLog) {
  if (!drinkLog) return 'pending';
  const s = drinkLog.status || 'pending';
  if (s === 'completed') return 'completed';
  if (s === 'completed_late') return 'completed_late';
  if (s === 'late') {
    if (drinkLog.drink_type === 'you_drink' && !drinkLog.given_to) return 'vacated';
    return 'late';
  }

  // Use the precise timestamp for the clock start:
  // - awaiting_approval (assigned you_drink): clock starts at assigned_at
  // - pending i_drink or unassigned you_drink: clock starts at hr_triggered_at
  // - fallback: noon on event_date
  let clockStart = null;
  if (s === 'awaiting_approval' && drinkLog.assigned_at) {
    clockStart = new Date(drinkLog.assigned_at);
  } else if (drinkLog.hr_triggered_at) {
    clockStart = new Date(drinkLog.hr_triggered_at);
  } else if (drinkLog.event_date) {
    clockStart = new Date(drinkLog.event_date + 'T12:00:00');
  }

  if (clockStart) {
    const ageHours = (Date.now() - clockStart.getTime()) / 36e5;
    if (ageHours > LATE_HOURS) {
      if (drinkLog.drink_type === 'you_drink' && !drinkLog.given_to) return 'vacated';
      return 'late';
    }
  }

  return s; // 'pending' or 'awaiting_approval'
}

/**
 * Resolve the 24h-clock start time for a drink_log row, in ms since epoch.
 * Mirrors the backend's refresh_late_statuses() logic so overdue calculations
 * line up whether status was flipped to 'late' server-side or is only
 * apparent client-side.
 */
function getClockStart(drinkLog) {
  if (!drinkLog) return null;
  let clockStart = null;
  if (drinkLog.status === 'awaiting_approval' && drinkLog.assigned_at) {
    clockStart = drinkLog.assigned_at;
  } else if (drinkLog.given_to && drinkLog.assigned_at) {
    clockStart = drinkLog.assigned_at;
  } else if (drinkLog.hr_triggered_at) {
    clockStart = drinkLog.hr_triggered_at;
  } else if (drinkLog.event_date) {
    clockStart = drinkLog.event_date + 'T12:00:00';
  }
  return clockStart ? new Date(clockStart).getTime() : null;
}

/** Format a millisecond duration as "1d 4h", "5h 12m", or "8m". */
function formatDuration(ms) {
  if (!ms || ms <= 0) return '0m';
  const days  = Math.floor(ms / 86400000);
  const hours = Math.floor((ms % 86400000) / 3600000);
  const mins  = Math.floor((ms % 3600000) / 60000);
  if (days > 0)  return `${days}d ${hours}h`;
  if (hours > 0) return `${hours}h ${mins}m`;
  return `${mins}m`;
}

// ---------------------------------------------------------------------------
// Weekly Recap helpers
// ---------------------------------------------------------------------------

/** Monday-at-midnight (local time) for a given date. */
function getMonday(d) {
  const date = new Date(d);
  date.setHours(0, 0, 0, 0);
  const day  = date.getDay(); // 0 = Sun .. 6 = Sat
  const diff = (day === 0 ? -6 : 1) - day;
  date.setDate(date.getDate() + diff);
  return date;
}

/** { start, end } for the week `offsetWeeks` back from the current week. end is exclusive. */
function getWeekRange(offsetWeeks = 0) {
  const start = getMonday(new Date());
  start.setDate(start.getDate() - offsetWeeks * 7);
  const end = new Date(start);
  end.setDate(end.getDate() + 7);
  return { start, end };
}

function formatWeekLabel(start, end) {
  const endInclusive = new Date(end.getTime() - 86400000);
  const opts = { month: 'short', day: 'numeric' };
  return `Week of ${start.toLocaleDateString('en-US', opts)} \u2013 ${endInclusive.toLocaleDateString('en-US', opts)}`;
}

/**
 * Tally two weekly stats from drink_log rows, grouped by event_date (the
 * date the underlying HR happened):
 *  - assigned: you_drink obligations the owner handed off to someone else
 *  - drunk:    completed drinks physically consumed (i_drink owner, or the
 *              given_to assignee for you_drink), completed and completed_late
 *              counted the same
 */
function summarizeWeek(rows, start, end) {
  const startStr = start.toISOString().slice(0, 10);
  const endStr   = end.toISOString().slice(0, 10);
  const assigned = {};
  const drunk    = {};
  ALL_USERS.forEach(u => { assigned[u] = 0; drunk[u] = 0; });

  let any = false;
  rows.forEach(row => {
    const d = row.event_date;
    if (!d || d < startStr || d >= endStr) return;

    if (row.drink_type === 'you_drink' && row.given_to) {
      const owner = row.username?.toLowerCase();
      if (owner && assigned[owner] !== undefined) { assigned[owner]++; any = true; }
    }
    if (row.status === 'completed' || row.status === 'completed_late') {
      const drinker = (row.drink_type === 'you_drink' ? row.given_to : row.username)?.toLowerCase();
      if (drinker && drunk[drinker] !== undefined) { drunk[drinker]++; any = true; }
    }
  });

  return { assigned, drunk, any };
}

function rankCounts(obj) {
  return Object.entries(obj)
    .map(([username, count]) => ({ username, count }))
    .sort((a, b) => b.count - a.count);
}

/**
 * Loads drink_log and resolves the weekly recap. Tries the current week
 * first; if it's completely empty (e.g. the group had a bye week), falls
 * back one week rather than searching further into the past.
 */
function useWeeklyRecap() {
  const [rows, setRows]       = useState([]);
  const [loading, setLoading] = useState(true);

  const load = async () => {
    const { data } = await sb.from('drink_log')
      .select('event_date, drink_type, username, given_to, status');
    if (data) setRows(data);
    setLoading(false);
  };

  useEffect(() => {
    load();
    const chan = sb.channel('weekly-recap-watch')
      .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_log' }, load)
      .subscribe();
    return () => sb.removeChannel(chan);
  }, []);

  return useMemo(() => {
    if (loading) return { loading: true };
    for (const offset of [0, 1]) {
      const { start, end } = getWeekRange(offset);
      const summary = summarizeWeek(rows, start, end);
      if (summary.any || offset === 1) {
        return {
          loading:     false,
          weekLabel:   formatWeekLabel(start, end),
          any:         summary.any,
          topDrunk:    rankCounts(summary.drunk),
          topAssigned: rankCounts(summary.assigned),
        };
      }
    }
  }, [rows, loading]);
}

/**
 * Countdown hook — returns { label, urgency } updating every second.
 * urgency: 'ok' | 'warning' (< 6h) | 'urgent' (< 2h) | 'overdue' (past deadline) | null (not applicable)
 */
/**
 * Swipe-to-dismiss hook.
 * Attach ref to the sheet element. When user swipes down > threshold, onDismiss fires.
 */
function useSwipeDismiss(onDismiss, threshold = 80) {
  const ref       = useRef(null);
  const startY    = useRef(null);
  const currentY  = useRef(0);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    const onStart = (e) => {
      startY.current = e.touches[0].clientY;
      el.style.transition = 'none';
    };

    const onMove = (e) => {
      if (startY.current === null) return;
      const dy = e.touches[0].clientY - startY.current;
      if (dy < 0) return;
      currentY.current = dy;
      el.style.transform = `translateY(${dy}px)`;
      el.style.opacity   = String(Math.max(0.5, 1 - dy / 300));
    };

    const onEnd = () => {
      if (currentY.current > threshold) {
        el.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        el.style.transform  = 'translateY(100%)';
        el.style.opacity    = '0';
        setTimeout(onDismiss, 200);
      } else {
        el.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        el.style.transform  = 'translateY(0)';
        el.style.opacity    = '1';
      }
      startY.current  = null;
      currentY.current = 0;
    };

    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchmove',  onMove,  { passive: true });
    el.addEventListener('touchend',   onEnd,   { passive: true });

    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove',  onMove);
      el.removeEventListener('touchend',   onEnd);
    };
  }, [onDismiss, threshold]);

  return ref;
}

function useCountdown(drinkLog, drinkType) {
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  if (!drinkLog) return null;
  const status = computeStatus(drinkLog);
  // 'late' is included so overdue drinks show how long they've been overdue
  // instead of showing no timer at all once the deadline passes.
  if (!['pending', 'awaiting_approval', 'late'].includes(status)) return null;

  const clockStart = getClockStart(drinkLog);
  if (!clockStart) return null;

  const deadline   = clockStart + (24 * 60 * 60 * 1000);
  const remaining  = deadline - now;

  if (remaining <= 0) {
    const overdueMs = now - deadline;
    return { label: `Overdue ${formatDuration(overdueMs)}`, urgency: 'overdue', overdueMs };
  }

  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  const label = `${h}h ${m}m ${s}s`;

  const urgency = remaining < 2 * 3600000 ? 'urgent'
                : remaining < 6 * 3600000 ? 'warning'
                : 'ok';

  return { label, urgency };
}

/**
 * For a you_drink event:
 *   - assigner = event.drinker (the person who must assign)
 *   - actual drinker = drink_log.given_to (the person who must drink)
 *
 * For an i_drink event:
 *   - actual drinker = event.drinker
 *
 * canApprove = currentUser is NOT the actual drinker AND drink is not yet completed.
 */
function canUserApprove(event, drinkLog, currentUser) {
  if (!drinkLog) return false;
  const status = computeStatus(drinkLog);
  if (status === 'completed' || status === 'completed_late') return false;

  const actualDrinker = (
    event.drink_type === 'you_drink'
      ? (drinkLog.given_to || null)
      : event.drinker
  );

  // For you_drink, we can only approve once it's been assigned (given_to set)
  if (event.drink_type === 'you_drink' && !drinkLog.given_to) return false;

  return actualDrinker && currentUser.toLowerCase() !== actualDrinker.toLowerCase();
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

// Parse deep-link params from URL e.g. /?event=42&tab=feed
function getDeepLink() {
  const params = new URLSearchParams(window.location.search);
  return {
    eventId: params.get('event') ? parseInt(params.get('event')) : null,
    tab:     params.get('tab') || null,
    videoId: params.get('video') ? parseInt(params.get('video')) : null,
  };
}

// Clear the URL params without reloading the page
function clearDeepLink() {
  window.history.replaceState({}, '', '/');
}

function AuthScreen({ onAuth }) {

  const handle = async () => {
    setError(''); setLoading(true);

      if (mode === 'register') {
        if (groupPass !== GROUP_PASSWORD) {
          setError('Incorrect group password. Ask Stephen for the group password.');
          setLoading(false); return;
        }
        if (!email.trim() || !email.includes('@')) {

function UploadModal({ event, drinkLog, currentUser, onClose, onUploaded, showToast, onNavigateVideos }) {
  const [file, setFile]             = useState(null);
  const [previewUrl, setPreviewUrl] = useState(null);
  const [uploading, setUploading]   = useState(false);
  const [progress, setProgress]     = useState(0);
  const [warned, setWarned]         = useState(false);
  const [mode, setMode]             = useState('record'); // 'record' | 'library'
  const [recording, setRecording]   = useState(false);
  const [timeLeft, setTimeLeft]     = useState(MAX_VIDEO_SECONDS);
  const [stream, setStream]         = useState(null);
  const [mediaRecorder, setMediaRecorder] = useState(null);
  const videoRef    = useRef(null);
  const chunksRef   = useRef([]);
  const timerRef    = useRef(null);

  // Detect MediaRecorder support — works on Safari iOS, Chrome Android, 
  // and desktop Chrome/Firefox. Check for supported MIME types.
  const supportsRecording = typeof MediaRecorder !== 'undefined' && (
    MediaRecorder.isTypeSupported('video/mp4') ||
    MediaRecorder.isTypeSupported('video/webm') ||
    MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
  );
  // Pick best supported MIME type per platform
  const recordingMimeType = MediaRecorder.isTypeSupported('video/mp4')
    ? 'video/mp4'
    : MediaRecorder.isTypeSupported('video/webm;codecs=vp8')
      ? 'video/webm;codecs=vp8'
      : 'video/webm';

  const actualDrinker = event.drink_type === 'you_drink' && drinkLog?.given_to
    ? drinkLog.given_to : event.drinker;

  // Start camera stream
  const startCamera = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
      setStream(s);
      if (videoRef.current) {
        videoRef.current.srcObject = s;
        videoRef.current.play();
      }
    } catch (e) {
      showToast('Could not access camera');
    }
  };

  // Stop camera stream
  const stopCamera = () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    setStream(null);
  };

  useEffect(() => {
    if (warned && mode === 'record' && supportsRecording) startCamera();
    return () => stopCamera();
  }, [warned, mode]);

  const startRecording = () => {
    if (!stream) return;
    chunksRef.current = [];
    const mr = new MediaRecorder(stream, { mimeType: recordingMimeType });
    mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
    mr.onstop = () => {
      const mimeBase = recordingMimeType.split(';')[0]; // strip codec params
      const ext  = mimeBase === 'video/mp4' ? 'mp4' : 'webm';
      const blob = new Blob(chunksRef.current, { type: mimeBase });
      const url  = URL.createObjectURL(blob);
      setFile(new File([blob], `chug_${Date.now()}.${ext}`, { type: mimeBase }));
      setPreviewUrl(url);
      stopCamera();
    };
    mr.start();
    setMediaRecorder(mr);
    setRecording(true);
    setTimeLeft(MAX_VIDEO_SECONDS);

    // Countdown timer
    let remaining = MAX_VIDEO_SECONDS;
    timerRef.current = setInterval(() => {
      remaining -= 1;
      setTimeLeft(remaining);
      if (remaining <= 0) stopRecording(mr);
    }, 1000);
  };

  const stopRecording = (mr) => {
    clearInterval(timerRef.current);
    setRecording(false);
    const recorder = mr || mediaRecorder;
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  };

  const handleFile = (f) => {
    if (!f) return;
    if (!f.type.startsWith('video/')) { showToast('Please select a video file'); return; }

    const objectUrl = URL.createObjectURL(f);
    const vid       = document.createElement('video');
    vid.preload     = 'metadata';

    let metadataLoaded = false;
    const timeout = setTimeout(() => {
      if (!metadataLoaded) {
        URL.revokeObjectURL(objectUrl);
        setFile(f);
        setPreviewUrl(URL.createObjectURL(f));
      }
    }, 3000);

    vid.onloadedmetadata = () => {
      metadataLoaded = true;
      clearTimeout(timeout);
      URL.revokeObjectURL(objectUrl);
      if (vid.duration > MAX_VIDEO_SECONDS) {
        const secs = Math.round(vid.duration);
        showToast(`Video is ${secs}s — must be ${MAX_VIDEO_SECONDS} seconds or less`);
        return;
      }
      setFile(f);
      setPreviewUrl(URL.createObjectURL(f));
    };

    vid.onerror = () => {
      clearTimeout(timeout);
      setFile(f);
      setPreviewUrl(URL.createObjectURL(f));
    };

    vid.src = objectUrl;
  };

  const upload = async () => {
    if (!file) return;
    setUploading(true);
    setProgress(10);
    try {
      // Duplicate guard — block upload if a video already exists for this HR event
      const { data: existing } = await sb.from('chug_videos')
        .select('id')
        .eq('hr_event_id', event.id)
        .maybeSingle();
      if (existing) {
        showToast('A chug video already exists for this homer!');
        setUploading(false);
        onClose();
        return;
      }

      const { data: { session } } = await sb.auth.getSession();
      const ext  = file.name.split('.').pop();
      const path = `${event.id}/${currentUser}_${Date.now()}.${ext}`;

      // Auto-cleanup: delete oldest videos if at or over the 10-video cap
      try {
        await fetch(`${BACKEND}/videos/cleanup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        });
      } catch (e) {
        console.error('Cleanup failed (continuing anyway):', e);
      }
      setProgress(20);

      // Upload to Supabase Storage
      const { error: upErr } = await sb.storage
        .from(VIDEO_BUCKET)
        .upload(path, file, { contentType: file.type, upsert: true });
      if (upErr) throw upErr;
      setProgress(70);

      // Get public URL
      const { data: urlData } = sb.storage.from(VIDEO_BUCKET).getPublicUrl(path);
      const publicUrl = urlData.publicUrl;
      setProgress(85);

      // Store in chug_videos table
      const { error: dbErr } = await sb.from('chug_videos').insert({
        hr_event_id:  event.id,
        drink_log_id: drinkLog?.id || null,
        uploader:     currentUser,
        actual_drinker: actualDrinker,
        storage_path: path,
        public_url:   publicUrl,
        player_name:  event.full_name,
        player_key:   event.player_key,
      });
      if (dbErr) throw dbErr;
      setProgress(100);

      showToast('Chug video uploaded! 🍺');

      // Notify all other users via backend, passing video_id for deep link
      try {
        const { data: { session } } = await sb.auth.getSession();
        // Fetch the newly inserted video's id for the deep link
        const { data: videoRow } = await sb
          .from('chug_videos')
          .select('id')
          .eq('hr_event_id', event.id)
          .order('created_at', { ascending: false })
          .limit(1)
          .single();
        await fetch(`${BACKEND}/videos/notify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({
            hr_event_id:    event.id,
            player_name:    event.full_name,
            video_id:       videoRow?.id || null,
            actual_drinker: actualDrinker,
          })
        });
      } catch (e) {
        console.error('Video notify failed:', e);
      }

      onUploaded();
      onClose();
    } catch (e) {
      console.error(e);
      showToast('Upload failed — try again');
    }
    setUploading(false);
  };

  const swipeRef = useSwipeDismiss(onClose);

  // Step 1: warning screen
  if (!warned) {
    return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
      React.createElement('div', { className: 'upload-modal', ref: swipeRef },
        React.createElement('div', { className: 'modal-handle' }),
        React.createElement('h3', { style: { fontFamily: "'Bebas Neue', sans-serif", fontSize: '1.5rem', letterSpacing: '1px', marginBottom: '1.25rem' } },
          'Before You Record'
        ),
        React.createElement('div', { className: 'upload-warning' },
          React.createElement('strong', null, '⚠️ Please read before continuing'),
          `This video will be visible to everyone in the group permanently. Max length is ${MAX_VIDEO_SECONDS} seconds. By continuing you confirm you are comfortable with this being shared.`
        ),
        React.createElement('div', { className: 'modal-actions' },
          React.createElement('button', { className: 'btn-cancel', onClick: onClose }, 'Cancel'),
          React.createElement('button', { className: 'btn-confirm', onClick: () => setWarned(true) }, "I Understand, Let's Go")
        )
      )
    );
  }

  // Step 2: preview screen after recording/selecting
  if (previewUrl) {
    return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
      React.createElement('div', { className: 'upload-modal', ref: swipeRef },
        React.createElement('div', { className: 'modal-handle' }),
        React.createElement('h3', { style: { fontFamily: "'Bebas Neue', sans-serif", fontSize: '1.5rem', letterSpacing: '1px', marginBottom: '1rem' } }, 'Preview'),
        React.createElement('video', { className: 'upload-preview', src: previewUrl, controls: true, playsInline: true, style: { width: '100%', borderRadius: '10px', marginBottom: '1rem' } }),
        uploading && React.createElement('div', { className: 'upload-progress' },
          React.createElement('div', { className: 'upload-progress-fill', style: { width: `${progress}%` } })
        ),
        React.createElement('div', { className: 'modal-actions' },
          React.createElement('button', { className: 'btn-cancel', onClick: () => {
            setFile(null); setPreviewUrl(null);
            if (mode === 'record' && supportsRecording) startCamera();
          }}, 'Re-record'),
          React.createElement('button', {
            className: 'btn-confirm',
            onClick: upload,
            disabled: !file || uploading
          }, uploading ? 'Uploading...' : 'Upload Chug 🍺')
        )
      )
    );
  }

  // Step 3: record / library tabs
  return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
    React.createElement('div', { className: 'upload-modal', ref: swipeRef },
      React.createElement('div', { className: 'modal-handle' }),

      // Mode tabs
      React.createElement('div', { className: 'record-tabs' },
        React.createElement('button', {
          className: `record-tab ${mode === 'record' ? 'active' : ''}`,
          onClick: () => { setMode('record'); }
        }, '🎥 Record'),
        React.createElement('button', {
          className: `record-tab ${mode === 'library' ? 'active' : ''}`,
          onClick: () => { stopCamera(); setMode('library'); }
        }, '📷 Camera Roll')
      ),

      // Browser warning only shown if MediaRecorder not supported at all
      mode === 'record' && !supportsRecording &&
        React.createElement('div', { className: 'browser-warning' },
          '⚠️ Your browser does not support in-app recording. Please use the Camera Roll tab to upload a video instead.'
        ),

      // Record tab — Safari only
      mode === 'record' && supportsRecording && React.createElement('div', null,
        React.createElement('div', { className: 'record-zone' },
          React.createElement('video', {
            ref: videoRef,
            className: 'record-preview',
            autoPlay: true,
            muted: true,
            playsInline: true,

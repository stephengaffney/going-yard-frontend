<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Going Yard">
<meta name="theme-color" content="#0a0a0f">
<title>Going Yard & Drinking Hard</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --border: rgba(255,255,255,0.08);
  --text: #f0f0f0;
  --muted: #888;
  --accent: #e8c14a;
  --team-primary: #e8c14a;
  --team-secondary: #e8c14a;

  --frank-color: #e85d4a;
  --scott-color: #4a9eff;
  --tyler-color: #7cb85c;
  --ned-color: #c97de8;
  --ryan-color: #e87c3e;
  --steve-color: #4acfe8;
  --dan-color: #e84a8a;
  --stephen-color: #e8c14a;
}

/* ── Baseball seam background ── */
.seam-bg {
  position: relative;
  overflow: hidden;
}

.seam-bg::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(ellipse 180px 60px at 20% 30%, transparent 55%, rgba(255,255,255,0.018) 56%, rgba(255,255,255,0.018) 58%, transparent 59%),
    radial-gradient(ellipse 180px 60px at 80% 70%, transparent 55%, rgba(255,255,255,0.018) 56%, rgba(255,255,255,0.018) 58%, transparent 59%);
  pointer-events: none;
  z-index: 0;
}

/* ── Player headshot ── */
.player-headshot {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  object-fit: cover;
  object-position: top center;
  border: 2px solid var(--border);
  background: var(--surface2);
  flex-shrink: 0;
}

.player-headshot-wrap {
  position: relative;
  flex-shrink: 0;
}

.player-headshot-fallback {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--surface2);
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1rem;
  letter-spacing: 1px;
  flex-shrink: 0;
}

/* ── Team color accent strip on header ── */
.header-team-strip {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--team-primary), var(--team-secondary), transparent);
  opacity: 0.6;
  transition: background 0.5s ease;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.app { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; }

/* ── Tab transition ── */
@keyframes tab-enter {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}

.tab-screen {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.tab-screen.animating {
  animation: tab-enter 0.25s ease both;
}

/* ── Auth Screen ── */
.auth-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.auth-screen.seam-bg::before {
  background-image:
    radial-gradient(ellipse 300px 100px at 15% 25%, transparent 55%, rgba(255,255,255,0.022) 56%, rgba(255,255,255,0.022) 58%, transparent 59%),
    radial-gradient(ellipse 300px 100px at 85% 75%, transparent 55%, rgba(255,255,255,0.022) 56%, rgba(255,255,255,0.022) 58%, transparent 59%),
    radial-gradient(ellipse 200px 70px at 50% 50%, transparent 55%, rgba(255,255,255,0.015) 56%, rgba(255,255,255,0.015) 58%, transparent 59%);
}

.auth-screen::before {
  content: '';
  position: absolute;
  top: -200px; left: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(232,193,74,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.auth-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  color: var(--accent);
  text-align: center;
  line-height: 1;
  margin-bottom: 0.5rem;
  letter-spacing: 2px;
}

.auth-sub {
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
  margin-bottom: 3rem;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.auth-card {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
}

.auth-card h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 1px;
  margin-bottom: 1.5rem;
  color: var(--text);
}

.form-group { margin-bottom: 1rem; }

.form-group label {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 0.5rem;
}

.form-group input, .form-group select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-group select option { background: var(--surface2); }

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: #0a0a0f;
  border: none;
  border-radius: 8px;
  padding: 0.875rem;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  cursor: pointer;
  margin-top: 1rem;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-primary:hover { opacity: 0.9; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.auth-toggle {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.auth-toggle span { color: var(--accent); cursor: pointer; text-decoration: underline; }

.error-msg {
  background: rgba(232,74,74,0.1);
  border: 1px solid rgba(232,74,74,0.3);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.875rem;
  color: #e84a4a;
  margin-bottom: 1rem;
}

/* ── Nav ── */
.nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 0.5rem 0 calc(0.5rem + env(safe-area-inset-bottom));
  z-index: 100;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 0.5rem;
  cursor: pointer;
  transition: opacity 0.2s;
  border: none;
  background: none;
  color: var(--muted);
}

.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; }
.nav-item span { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }

.nav-item-wrap {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.unread-dot {
  position: absolute;
  top: -2px;
  right: -4px;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--accent);
  border: 2px solid var(--bg);
  animation: unread-pulse 2s ease infinite;
}

@keyframes unread-pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%       { transform: scale(1.2); opacity: 0.8; }
}

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.25rem;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
  overflow: hidden;
}

.header-title {
  display: flex;
  flex-direction: column;
  line-height: 1;
  gap: 1px;
}

.live-dot-wrap {
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 0.65rem;
  color: #7cb85c;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #7cb85c;
  box-shadow: 0 0 0 0 rgba(124,184,92,0.6);
  animation: live-pulse 1.5s ease infinite;
  flex-shrink: 0;
}

@keyframes live-pulse {
  0%   { box-shadow: 0 0 0 0   rgba(124,184,92,0.6); }
  70%  { box-shadow: 0 0 0 6px rgba(124,184,92,0); }
  100% { box-shadow: 0 0 0 0   rgba(124,184,92,0); }
}

.header-title-main {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: var(--accent);
  letter-spacing: 2px;
}

.header-title-sub {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 0.7rem;
  color: #555;
  letter-spacing: 3px;
}

.header-user {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
}

/* ── Feed ── */
.feed {
  flex: 1;
  padding: 1rem 1rem 6rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* ── HR Card status variants ── */
@keyframes card-enter {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.hr-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  transition: border-color 0.3s;
  animation: card-enter 0.55s ease both;
}

/* Awaiting approval — gold pulse */
.hr-card.awaiting-approval {
  border-color: rgba(232,193,74,0.6);
  animation: pulse-yellow 2.2s ease-in-out infinite;
}

/* Late — red pulse */
.hr-card.late {
  border-color: rgba(232,74,74,0.7);
  animation: pulse-red 1.6s ease-in-out infinite;
}

/* Completed late — orange static border, no pulse (done but tardy) */
.hr-card.completed-late {
  border-color: rgba(232,140,74,0.55);
  box-shadow: 0 0 0 1px rgba(232,140,74,0.2);
}

@keyframes pulse-yellow {
  0%, 100% { box-shadow: 0 0 0 0   rgba(232,193,74,0.35); }
  50%       { box-shadow: 0 0 0 8px rgba(232,193,74,0); }
}

@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 0 0   rgba(232,74,74,0.45); }
  50%       { box-shadow: 0 0 0 10px rgba(232,74,74,0); }
}

.hr-card-accent { height: 3px; width: 100%; }
.hr-card-body { padding: 1rem 1.25rem; }

.hr-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.hr-player { display: flex; flex-direction: column; gap: 2px; }

.hr-player-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 1px;
  line-height: 1;
}

.hr-player-team {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.hr-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0.4rem 0.75rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.hr-badge.i-drink {
  background: rgba(232,193,74,0.15);
  color: var(--accent);
  border: 1px solid rgba(232,193,74,0.3);
}

.hr-badge.you-drink {
  background: rgba(74,159,255,0.15);
  color: #4a9eff;
  border: 1px solid rgba(74,159,255,0.3);
}

.hr-drink-info {
  background: var(--surface2);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  margin-bottom: 0.75rem;
  font-size: 0.875rem;
}

.hr-drink-info strong { color: var(--text); }

.hr-timestamp {
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 0.75rem;
}

.drink-countdown {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.72rem;
  font-weight: 600;
  padding: 3px 8px;
  border-radius: 10px;
  margin-left: 8px;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.3px;
}

.drink-countdown.ok {
  background: rgba(124,184,92,0.1);
  color: #7cb85c;
  border: 1px solid rgba(124,184,92,0.25);
}

.drink-countdown.warning {
  background: rgba(232,193,74,0.12);
  color: var(--accent);
  border: 1px solid rgba(232,193,74,0.3);
}

.drink-countdown.urgent {
  background: rgba(232,74,74,0.12);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.35);
  animation: pulse-red 1.5s ease infinite;
}

/* ── Drink status badge ── */
.drink-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 0.5rem;
  flex-wrap: wrap;
}

.drink-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.drink-status-badge.pending {
  background: rgba(136,136,136,0.12);
  color: #999;
  border: 1px solid rgba(136,136,136,0.25);
}

.drink-status-badge.awaiting {
  background: rgba(232,193,74,0.12);
  color: var(--accent);
  border: 1px solid rgba(232,193,74,0.4);
}

.drink-status-badge.completed {
  background: rgba(124,184,92,0.12);
  color: #7cb85c;
  border: 1px solid rgba(124,184,92,0.35);
}

.drink-status-badge.late {
  background: rgba(232,74,74,0.12);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.45);
}

.drink-status-badge.completed-late {
  background: rgba(232,140,74,0.12);
  color: #e88c4a;
  border: 1px solid rgba(232,140,74,0.45);
}

/* ── Actions row ── */
.hr-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.action-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  cursor: pointer;
  padding: 0.4rem 0.75rem;
  border-radius: 20px;
  transition: all 0.2s;
}

.action-btn:hover { background: var(--surface2); color: var(--text); }
.action-btn.liked { color: #e84a4a; }
.action-btn svg { width: 16px; height: 16px; }

.assign-btn {
  margin-left: auto;
  background: rgba(74,159,255,0.1);
  border: 1px solid rgba(74,159,255,0.3);
  color: #4a9eff;
  border-radius: 8px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}

.assign-btn:hover { background: rgba(74,159,255,0.2); }

.approve-btn {
  background: rgba(124,184,92,0.1);
  border: 1px solid rgba(124,184,92,0.35);
  color: #7cb85c;
  border-radius: 8px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-left: auto;
}

.approve-btn:hover { background: rgba(124,184,92,0.2); }

/* ── Comments ── */
.comments-section {
  padding: 0 1.25rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.comment { display: flex; gap: 0.5rem; align-items: flex-start; }

.comment-body {
  background: var(--surface2);
  border-radius: 10px;
  padding: 0.5rem 0.75rem;
  flex: 1;
}

.comment-username { font-size: 0.75rem; font-weight: 600; margin-bottom: 2px; }
.comment-text { font-size: 0.875rem; color: var(--text); }

.comment-input-row {
  display: flex;
  gap: 0.5rem;
  padding: 0.75rem 1.25rem 1rem;
  border-top: 1px solid var(--border);
}

.comment-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.5rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  outline: none;
}

.comment-input:focus { border-color: var(--accent); }

.send-btn {
  background: var(--accent);
  border: none;
  border-radius: 50%;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.send-btn svg { width: 16px; height: 16px; }

.comment-delete-btn {
  background: none;
  border: none;
  color: transparent;
  cursor: pointer;
  padding: 2px 4px;
  border-radius: 4px;
  line-height: 1;
  font-size: 0.7rem;
  transition: color 0.15s;
  flex-shrink: 0;
  align-self: flex-start;
  margin-top: 2px;
}

.comment:hover .comment-delete-btn {
  color: #555;
}

.comment-delete-btn:hover {
  color: #e84a4a !important;
}

/* ── Leaderboard ── */
.leaderboard-screen { flex: 1; padding: 1rem 1rem 6rem; }

.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 0.75rem;
  padding: 0 0.25rem;
}

.lb-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}

.lb-row {
  display: flex;
  align-items: center;
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  gap: 0.75rem;
}

.lb-row:last-child { border-bottom: none; }

.lb-rank {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  color: var(--muted);
  width: 24px;
  text-align: center;
}

.lb-rank.gold { color: var(--accent); }
.lb-rank.silver { color: #aaa; }
.lb-rank.bronze { color: #cd7f32; }

.lb-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
.lb-sub { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }

.lb-stat {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  min-width: 36px;
  text-align: right;
}

.lb-stat-group {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.lb-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: right;
}

.late-badge {
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: 10px;
  background: rgba(232,74,74,0.15);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.35);
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* ── Log Screen ── */
.log-screen { flex: 1; padding: 1rem 1rem 6rem; }

.log-table {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.log-header {
  display: grid;
  grid-template-columns: 72px 1fr 1fr 68px;
  padding: 0.75rem 1rem;
  background: var(--surface2);
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
}

/* Log rows get a left-border color based on status */
.log-row {
  display: grid;
  grid-template-columns: 72px 1fr 1fr 68px;
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
  align-items: center;
  border-left: 3px solid transparent;
  transition: border-color 0.2s;
}

.log-row:last-child { border-bottom: none; }
.log-row.status-late           { border-left-color: #e84a4a; }
.log-row.status-completed_late { border-left-color: #e88c4a; }
.log-row.status-awaiting { border-left-color: var(--accent); }
.log-row.status-completed { border-left-color: #7cb85c; }
.log-row.status-pending { border-left-color: rgba(136,136,136,0.3); }

.log-status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
  flex-shrink: 0;
}

.log-status-dot.pending   { background: #666; }
.log-status-dot.awaiting  { background: var(--accent); }
.log-status-dot.completed { background: #7cb85c; }
.log-status-dot.late           { background: #e84a4a; }
.log-status-dot.completed_late { background: #e88c4a; }

/* ── Assign Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

/* Swipe-to-dismiss sheet — applied to inner sheet elements */
.swipeable {
  touch-action: pan-x;
  transition: transform 0.2s ease, opacity 0.2s ease;
  will-change: transform;
}

.modal {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 1.5rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
}

.modal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 1.5rem;
}

.modal h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 1px;
  margin-bottom: 1.5rem;
}

.user-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.user-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  padding: 0.75rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface2);
}

.user-option:hover { border-color: var(--accent); }
.user-option.selected { border-color: var(--accent); background: rgba(232,193,74,0.1); }
.user-option span { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.msg-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  outline: none;
  margin-bottom: 1rem;
  resize: none;
  height: 80px;
}

.msg-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 0.75rem; }

.btn-cancel {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
}

.btn-confirm {
  flex: 2;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 0.75rem;
  color: #0a0a0f;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 1px;
  cursor: pointer;
}

.btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Empty / loading ── */
.empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }

.loading { display: flex; align-items: center; justify-content: center; padding: 3rem; }

.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── I Drink Progress Board ── */
.progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}

.progress-row {
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
}

.progress-row:last-child { border-bottom: none; }

.progress-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
}

.progress-names {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.progress-user {
  font-size: 0.875rem;
  font-weight: 500;
}

.progress-player {
  font-size: 0.75rem;
  color: var(--muted);
}

.progress-count {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  min-width: 48px;
  text-align: right;
  line-height: 1;
}

.progress-count span {
  font-size: 0.7rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
}

.progress-bar-track {
  height: 8px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.progress-bar-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
  border-radius: 4px;
}

/* ── Reaction Emojis ── */
.reactions-bar {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
  padding: 0.4rem 0;
}

.reaction-btn {
  display: flex;
  align-items: center;
  gap: 3px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 8px;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  color: var(--muted);
  line-height: 1;
}

.reaction-btn:hover { border-color: var(--accent); transform: scale(1.08); }

.reaction-btn.reacted {
  background: rgba(232,193,74,0.1);
  border-color: rgba(232,193,74,0.4);
  color: var(--accent);
}

.reaction-count {
  font-size: 0.7rem;
  font-weight: 600;
}

.reaction-picker {
  display: flex;
  gap: 4px;
  padding: 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}

.reaction-picker-btn {
  background: none;
  border: none;
  font-size: 1.3rem;
  cursor: pointer;
  padding: 4px 6px;
  border-radius: 16px;
  transition: transform 0.15s, background 0.15s;
  line-height: 1;
}

.reaction-picker-btn:hover { transform: scale(1.3); background: var(--surface2); }

/* ── Date Range Calendar ── */
.cal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.cal-sheet {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  border-top: 1px solid var(--border);
  padding: 0 1.25rem 0;
  max-height: 92vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.cal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 1rem auto 1.25rem;
}

.cal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}

.cal-month-label {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  color: var(--text);
}

.cal-nav-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--text);
  font-size: 1rem;
  transition: background 0.15s;
}

.cal-nav-btn:hover { background: var(--border); }

.cal-weekdays {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  margin-bottom: 4px;
}

.cal-weekday {
  text-align: center;
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  padding: 4px 0;
}

.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 2px;
}

.cal-day {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.82rem;
  border-radius: 8px;
  cursor: pointer;
  color: var(--text);
  transition: background 0.12s, color 0.12s;
  border: 1px solid transparent;
  position: relative;
  min-height: 36px;
  max-height: 44px;
}

.cal-day:hover:not(.cal-day-empty):not(.cal-day-disabled) {
  background: var(--surface2);
  border-color: var(--border);
}

.cal-day.cal-day-empty { cursor: default; }
.cal-day.cal-day-disabled { color: var(--muted); cursor: default; opacity: 0.4; }

.cal-day.cal-day-start,
.cal-day.cal-day-end {
  background: var(--accent);
  color: #0a0a0f;
  font-weight: 600;
}

.cal-day.cal-day-in-range {
  background: rgba(232,193,74,0.15);
  border-radius: 0;
  color: var(--accent);
}

.cal-day.cal-day-start { border-radius: 8px 0 0 8px; }
.cal-day.cal-day-end   { border-radius: 0 8px 8px 0; }
.cal-day.cal-day-start.cal-day-end { border-radius: 8px; }

.cal-day.cal-day-today {
  border-color: var(--accent);
}

.cal-day.cal-day-has-data::after {
  content: '';
  position: absolute;
  bottom: 3px;
  width: 4px; height: 4px;
  border-radius: 50%;
  background: var(--accent);
}

.cal-day.cal-day-start::after,
.cal-day.cal-day-end::after { background: #0a0a0f; }

.cal-range-label {
  text-align: center;
  font-size: 0.8rem;
  color: var(--muted);
  margin: 0 0 1rem;
  min-height: 1.2rem;
  padding: 0.5rem 0.5rem 0.75rem;
  border-bottom: 1px solid var(--border);
}

.cal-range-label span { color: var(--accent); font-weight: 500; }

.cal-actions {
  display: flex;
  gap: 0.75rem;
  margin-top: 1rem;
  position: sticky;
  bottom: 0;
  background: var(--surface);
  padding: 0.75rem 0 calc(5rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
}

.cal-btn-clear {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
}

.cal-btn-apply {
  flex: 2;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 0.75rem;
  color: #0a0a0f;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 1px;
  cursor: pointer;
}

.cal-btn-apply:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Search & Filter Bar ── */
.search-bar {
  padding: 0.75rem 1rem 0;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  background: var(--bg);
  position: sticky;
  top: 57px;
  z-index: 40;
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.75rem;
}

.search-input-wrap {
  position: relative;
}

.search-input-wrap svg {
  position: absolute;
  left: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--muted);
  pointer-events: none;
}

.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 0.55rem 0.75rem 0.55rem 2.25rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus { border-color: var(--accent); }
.search-input::placeholder { color: var(--muted); }

.filter-chips {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding-bottom: 2px;
  scrollbar-width: none;
}

.filter-chips::-webkit-scrollbar { display: none; }

.filter-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  white-space: nowrap;
  padding: 0.3rem 0.65rem;
  border-radius: 20px;
  font-size: 0.7rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--muted);
  transition: all 0.15s;
  flex-shrink: 0;
}

.filter-chip:hover { border-color: var(--accent); color: var(--text); }

.filter-chip.active {
  background: rgba(232,193,74,0.12);
  border-color: var(--accent);
  color: var(--accent);
}

.filter-chip.active-red {
  background: rgba(232,74,74,0.12);
  border-color: #e84a4a;
  color: #e84a4a;
}

.filter-chip.active-blue {
  background: rgba(74,159,255,0.12);
  border-color: #4a9eff;
  color: #4a9eff;
}

.filter-chip.active-green {
  background: rgba(124,184,92,0.12);
  border-color: #7cb85c;
  color: #7cb85c;
}

.filter-chip.active-orange {
  background: rgba(232,140,74,0.12);
  border-color: #e88c4a;
  color: #e88c4a;
}

.filter-divider {
  width: 1px;
  height: 20px;
  background: var(--border);
  align-self: center;
  flex-shrink: 0;
}

.no-results {
  text-align: center;
  padding: 3rem 2rem;
  color: var(--muted);
  font-size: 0.875rem;
}

/* ── Video Tab ── */
.videos-screen {
  flex: 1;
  padding: 1rem 1rem 6rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.video-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
}

.video-card-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.875rem 1rem 0.75rem;
}

.video-card-meta {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.video-card-title {
  font-size: 0.875rem;
  font-weight: 600;
}

.video-card-sub {
  font-size: 0.72rem;
  color: var(--muted);
}

.video-card-time {
  font-size: 0.7rem;
  color: var(--muted);
}

.video-player {
  width: 100%;
  max-height: 320px;
  object-fit: cover;
  display: block;
  background: #000;
}

.video-filter-row {
  display: flex;
  gap: 0.4rem;
  overflow-x: auto;
  padding: 0.75rem 1rem 0;
  scrollbar-width: none;
}

.video-filter-row::-webkit-scrollbar { display: none; }

/* Video link button on cards */
.video-link-btn {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(201,125,232,0.1);
  border: 1px solid rgba(201,125,232,0.35);
  color: #c97de8;
  border-radius: 8px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-left: auto;
  white-space: nowrap;
}

.video-link-btn:hover { background: rgba(201,125,232,0.2); }

.video-link-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

/* Upload modal */
.upload-modal {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 1.5rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
}

.upload-warning {
  background: rgba(232,193,74,0.08);
  border: 1px solid rgba(232,193,74,0.3);
  border-radius: 10px;
  padding: 0.875rem 1rem;
  font-size: 0.825rem;
  color: var(--accent);
  margin-bottom: 1.25rem;
  line-height: 1.5;
}

.upload-warning strong { display: block; margin-bottom: 4px; font-size: 0.9rem; }

.upload-zone {
  border: 2px dashed var(--border);
  border-radius: 12px;
  padding: 2rem 1rem;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s;
  margin-bottom: 1rem;
  position: relative;
}

.upload-zone:hover { border-color: #c97de8; }
.upload-zone input[type=file] {
  position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
}

.upload-zone-icon { font-size: 2rem; margin-bottom: 0.5rem; }
.upload-zone-text { font-size: 0.875rem; color: var(--muted); }
.upload-zone-hint { font-size: 0.75rem; color: var(--muted); margin-top: 4px; opacity: 0.7; }

.upload-preview {
  width: 100%;
  max-height: 200px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 1rem;
  display: block;
}

.upload-progress {
  height: 4px;
  background: var(--surface2);
  border-radius: 2px;
  overflow: hidden;
  margin-bottom: 1rem;
}

.upload-progress-fill {
  height: 100%;
  background: #c97de8;
  border-radius: 2px;
  transition: width 0.3s ease;
}

/* Log tab video link */
.log-video-link {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 0.68rem;
  color: #c97de8;
  cursor: pointer;
  border: none;
  background: none;
  padding: 0;
  font-family: 'DM Sans', sans-serif;
  text-decoration: underline;
  text-underline-offset: 2px;
}

/* ── In-app recording ── */
.record-zone {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  margin-bottom: 1rem;
  aspect-ratio: 9/16;
  max-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.record-preview {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.record-countdown {
  position: absolute;
  top: 12px;
  right: 12px;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 2px;
  padding: 4px 10px;
  border-radius: 8px;
  min-width: 48px;
  text-align: center;
}

.record-countdown.urgent { color: #e84a4a; }

.record-dot {
  position: absolute;
  top: 14px;
  left: 12px;
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #e84a4a;
  animation: live-pulse 1s ease infinite;
}

.record-btn {
  width: 64px; height: 64px;
  border-radius: 50%;
  border: 4px solid #fff;
  background: #e84a4a;
  cursor: pointer;
  transition: transform 0.15s;
  flex-shrink: 0;
}

.record-btn:hover { transform: scale(1.06); }
.record-btn.recording { background: #fff; border-color: #e84a4a; border-radius: 10px; width: 44px; height: 44px; }

.record-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  padding: 1rem 0 0.5rem;
}

.record-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.record-tabs {
  display: flex;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.record-tab {
  flex: 1;
  padding: 0.6rem;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface2);
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.15s;
  text-align: center;
}

.record-tab.active {
  border-color: var(--accent);
  color: var(--accent);
  background: rgba(232,193,74,0.08);
}

.browser-warning {
  background: rgba(232,140,74,0.1);
  border: 1px solid rgba(232,140,74,0.35);
  border-radius: 10px;
  padding: 0.875rem 1rem;
  font-size: 0.82rem;
  color: #e88c4a;
  margin-bottom: 1rem;
  line-height: 1.5;
  text-align: center;
}

/* ── Admin video toggle ── */
.video-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px 3px 6px;
  cursor: pointer;
  font-size: 0.7rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
  white-space: nowrap;
}

.video-toggle:hover { border-color: var(--accent); color: var(--text); }
.video-toggle.on { border-color: #7cb85c; color: #7cb85c; background: rgba(124,184,92,0.08); }
.video-toggle.off { border-color: #e84a4a; color: #e84a4a; background: rgba(232,74,74,0.08); }

.toggle-pip {

// ── Helpers ──────────────────────────────────────────────────────────────

/**
 * Compute the effective drink status for a drink_log row.
 *
 * Rules (applied client-side so the feed is always fresh even if the
 * backend late-sweep hasn't run yet):
 *
 *  completed          → always show completed, never override
 *  pending/awaiting   → if event_date > 24h ago → late
 *  pending            → still waiting (i_drink not yet approved,
 *                        or you_drink not yet assigned)
 *  awaiting_approval  → assigned but approval pending
 */
function computeStatus(drinkLog) {
  if (!drinkLog) return 'pending';
  const s = drinkLog.status || 'pending';
  if (s === 'completed') return 'completed';
  if (s === 'completed_late') return 'completed_late';
  if (s === 'late') return 'late';

  // Use the precise timestamp for the clock start:
  // - awaiting_approval (assigned you_drink): clock starts at assigned_at
  // - pending i_drink or unassigned you_drink: clock starts at hr_triggered_at
  // - fallback: noon on event_date
  let clockStart = null;
  if (s === 'awaiting_approval' && drinkLog.assigned_at) {
    clockStart = new Date(drinkLog.assigned_at);
  } else if (drinkLog.hr_triggered_at) {
    clockStart = new Date(drinkLog.hr_triggered_at);
  } else if (drinkLog.event_date) {
    clockStart = new Date(drinkLog.event_date + 'T12:00:00');
  }

  if (clockStart) {
    const ageHours = (Date.now() - clockStart.getTime()) / 36e5;
    if (ageHours > LATE_HOURS) return 'late';
  }

  return s; // 'pending' or 'awaiting_approval'
}

/**
 * Countdown hook — returns { label, urgency } updating every second.
 * urgency: 'ok' | 'warning' (< 6h) | 'urgent' (< 2h) | null (not applicable)
 */
/**
 * Swipe-to-dismiss hook.
 * Attach ref to the sheet element. When user swipes down > threshold, onDismiss fires.
 */
function useSwipeDismiss(onDismiss, threshold = 80) {
  const ref       = useRef(null);
  const startY    = useRef(null);
  const currentY  = useRef(0);

  useEffect(() => {
    const el = ref.current;
    if (!el) return;

    const onStart = (e) => {
      startY.current = e.touches[0].clientY;
      el.style.transition = 'none';
    };

    const onMove = (e) => {
      if (startY.current === null) return;
      const dy = e.touches[0].clientY - startY.current;
      if (dy < 0) return;
      currentY.current = dy;
      el.style.transform = `translateY(${dy}px)`;
      el.style.opacity   = String(Math.max(0.5, 1 - dy / 300));
    };

    const onEnd = () => {
      if (currentY.current > threshold) {
        el.style.transition = 'transform 0.2s ease, opacity 0.2s ease';
        el.style.transform  = 'translateY(100%)';
        el.style.opacity    = '0';
        setTimeout(onDismiss, 200);
      } else {
        el.style.transition = 'transform 0.25s ease, opacity 0.25s ease';
        el.style.transform  = 'translateY(0)';
        el.style.opacity    = '1';
      }
      startY.current  = null;
      currentY.current = 0;
    };

    el.addEventListener('touchstart', onStart, { passive: true });
    el.addEventListener('touchmove',  onMove,  { passive: true });
    el.addEventListener('touchend',   onEnd,   { passive: true });

    return () => {
      el.removeEventListener('touchstart', onStart);
      el.removeEventListener('touchmove',  onMove);
      el.removeEventListener('touchend',   onEnd);
    };
  }, [onDismiss, threshold]);

  return ref;
}

function useCountdown(drinkLog, drinkType) {
  const [now, setNow] = useState(Date.now());

  useEffect(() => {
    const id = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(id);
  }, []);

  if (!drinkLog) return null;
  const status = computeStatus(drinkLog);
  if (!['pending', 'awaiting_approval'].includes(status)) return null;

  // Determine clock start
  let clockStart = null;
  if (status === 'awaiting_approval' && drinkLog.assigned_at) {
    clockStart = new Date(drinkLog.assigned_at).getTime();
  } else if (drinkLog.hr_triggered_at) {
    clockStart = new Date(drinkLog.hr_triggered_at).getTime();
  } else if (drinkLog.event_date) {
    clockStart = new Date(drinkLog.event_date + 'T12:00:00').getTime();
  }

  if (!clockStart) return null;

  const deadline   = clockStart + (24 * 60 * 60 * 1000);
  const remaining  = deadline - now;

  if (remaining <= 0) return { label: '0h 0m 0s', urgency: 'urgent' };

  const h = Math.floor(remaining / 3600000);
  const m = Math.floor((remaining % 3600000) / 60000);
  const s = Math.floor((remaining % 60000) / 1000);
  const label = `${h}h ${m}m ${s}s`;

  const urgency = remaining < 2 * 3600000 ? 'urgent'
                : remaining < 6 * 3600000 ? 'warning'
                : 'ok';

  return { label, urgency };
}

/**
 * For a you_drink event:
 *   - assigner = event.drinker (the person who must assign)
 *   - actual drinker = drink_log.given_to (the person who must drink)
 *
 * For an i_drink event:
 *   - actual drinker = event.drinker
 *
 * canApprove = currentUser is NOT the actual drinker AND drink is not yet completed.
 */
function canUserApprove(event, drinkLog, currentUser) {
  if (!drinkLog) return false;
  const status = computeStatus(drinkLog);
  if (status === 'completed') return false;

  const actualDrinker = (
    event.drink_type === 'you_drink'
      ? (drinkLog.given_to || null)
      : event.drinker
  );

  // For you_drink, we can only approve once it's been assigned (given_to set)
  if (event.drink_type === 'you_drink' && !drinkLog.given_to) return false;

  return actualDrinker && currentUser.toLowerCase() !== actualDrinker.toLowerCase();
}

// ── Upload Modal ─────────────────────────────────────────────────────────

function UploadModal({ event, drinkLog, currentUser, onClose, onUploaded, showToast, onNavigateVideos }) {
  const [file, setFile]             = useState(null);
  const [previewUrl, setPreviewUrl] = useState(null);
  const [uploading, setUploading]   = useState(false);
  const [progress, setProgress]     = useState(0);
  const [warned, setWarned]         = useState(false);
  const [mode, setMode]             = useState('record'); // 'record' | 'library'
  const [recording, setRecording]   = useState(false);
  const [timeLeft, setTimeLeft]     = useState(MAX_VIDEO_SECONDS);
  const [stream, setStream]         = useState(null);
  const [mediaRecorder, setMediaRecorder] = useState(null);
  const videoRef    = useRef(null);
  const chunksRef   = useRef([]);
  const timerRef    = useRef(null);

  // Detect Safari
  const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
  const supportsRecording = isSafari && typeof MediaRecorder !== 'undefined';

  const actualDrinker = event.drink_type === 'you_drink' && drinkLog?.given_to
    ? drinkLog.given_to : event.drinker;

  // Start camera stream
  const startCamera = async () => {
    try {
      const s = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: true });
      setStream(s);
      if (videoRef.current) {
        videoRef.current.srcObject = s;
        videoRef.current.play();
      }
    } catch (e) {
      showToast('Could not access camera');
    }
  };

  // Stop camera stream
  const stopCamera = () => {
    if (stream) stream.getTracks().forEach(t => t.stop());
    setStream(null);
  };

  useEffect(() => {
    if (warned && mode === 'record' && supportsRecording) startCamera();
    return () => stopCamera();
  }, [warned, mode]);

  const startRecording = () => {
    if (!stream) return;
    chunksRef.current = [];
    const mr = new MediaRecorder(stream, { mimeType: 'video/mp4' });
    mr.ondataavailable = e => { if (e.data.size > 0) chunksRef.current.push(e.data); };
    mr.onstop = () => {
      const blob = new Blob(chunksRef.current, { type: 'video/mp4' });
      const url  = URL.createObjectURL(blob);
      setFile(new File([blob], `chug_${Date.now()}.mp4`, { type: 'video/mp4' }));
      setPreviewUrl(url);
      stopCamera();
    };
    mr.start();
    setMediaRecorder(mr);
    setRecording(true);
    setTimeLeft(MAX_VIDEO_SECONDS);

    // Countdown timer
    let remaining = MAX_VIDEO_SECONDS;
    timerRef.current = setInterval(() => {
      remaining -= 1;
      setTimeLeft(remaining);
      if (remaining <= 0) stopRecording(mr);
    }, 1000);
  };

  const stopRecording = (mr) => {
    clearInterval(timerRef.current);
    setRecording(false);
    const recorder = mr || mediaRecorder;
    if (recorder && recorder.state !== 'inactive') recorder.stop();
  };

  const handleFile = (f) => {
    if (!f) return;
    if (!f.type.startsWith('video/')) { showToast('Please select a video file'); return; }

    const objectUrl = URL.createObjectURL(f);
    const vid       = document.createElement('video');
    vid.preload     = 'metadata';

    let metadataLoaded = false;
    const timeout = setTimeout(() => {
      if (!metadataLoaded) {
        URL.revokeObjectURL(objectUrl);
        setFile(f);
        setPreviewUrl(URL.createObjectURL(f));
      }
    }, 3000);

    vid.onloadedmetadata = () => {
      metadataLoaded = true;
      clearTimeout(timeout);
      URL.revokeObjectURL(objectUrl);
      if (vid.duration > MAX_VIDEO_SECONDS) {
        const secs = Math.round(vid.duration);
        showToast(`Video is ${secs}s — must be ${MAX_VIDEO_SECONDS} seconds or less`);
        return;
      }
      setFile(f);
      setPreviewUrl(URL.createObjectURL(f));
    };

    vid.onerror = () => {
      clearTimeout(timeout);
      setFile(f);
      setPreviewUrl(URL.createObjectURL(f));
    };

    vid.src = objectUrl;
  };

  const upload = async () => {
    if (!file) return;
    setUploading(true);
    setProgress(10);
    try {
      const { data: { session } } = await sb.auth.getSession();
      const ext  = file.name.split('.').pop();
      const path = `${event.id}/${currentUser}_${Date.now()}.${ext}`;

      // Auto-cleanup: delete oldest videos if at or over the 10-video cap
      try {
        await fetch(`${BACKEND}/videos/cleanup`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        });
      } catch (e) {
        console.error('Cleanup failed (continuing anyway):', e);
      }
      setProgress(20);

      // Upload to Supabase Storage
      const { error: upErr } = await sb.storage
        .from(VIDEO_BUCKET)
        .upload(path, file, { contentType: file.type, upsert: true });
      if (upErr) throw upErr;
      setProgress(70);

      // Get public URL
      const { data: urlData } = sb.storage.from(VIDEO_BUCKET).getPublicUrl(path);
      const publicUrl = urlData.publicUrl;
      setProgress(85);

      // Store in chug_videos table
      const { error: dbErr } = await sb.from('chug_videos').insert({
        hr_event_id:  event.id,
        drink_log_id: drinkLog?.id || null,
        uploader:     currentUser,
        actual_drinker: actualDrinker,
        storage_path: path,
        public_url:   publicUrl,
        player_name:  event.full_name,
        player_key:   event.player_key,
      });
      if (dbErr) throw dbErr;
      setProgress(100);

      showToast('Chug video uploaded! 🍺');

      // Notify all other users via backend, passing video_id for deep link
      try {
        const { data: { session } } = await sb.auth.getSession();
        // Fetch the newly inserted video's id for the deep link
        const { data: videoRow } = await sb
          .from('chug_videos')
          .select('id')
          .eq('hr_event_id', event.id)
          .order('created_at', { ascending: false })
          .limit(1)
          .single();
        await fetch(`${BACKEND}/videos/notify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
          body: JSON.stringify({
            hr_event_id: event.id,
            player_name: event.full_name,
            video_id:    videoRow?.id || null,
          })
        });
      } catch (e) {
        console.error('Video notify failed:', e);
      }

      onUploaded();
      onClose();
    } catch (e) {
      console.error(e);
      showToast('Upload failed — try again');
    }
    setUploading(false);
  };

  const swipeRef = useSwipeDismiss(onClose);

  // Step 1: warning screen
  if (!warned) {
    return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
      React.createElement('div', { className: 'upload-modal', ref: swipeRef },
        React.createElement('div', { className: 'modal-handle' }),
        React.createElement('h3', { style: { fontFamily: "'Bebas Neue', sans-serif", fontSize: '1.5rem', letterSpacing: '1px', marginBottom: '1.25rem' } },
          'Before You Record'
        ),
        React.createElement('div', { className: 'upload-warning' },
          React.createElement('strong', null, '⚠️ Please read before continuing'),
          `This video will be visible to everyone in the group permanently. Max length is ${MAX_VIDEO_SECONDS} seconds. By continuing you confirm you are comfortable with this being shared.`
        ),
        React.createElement('div', { className: 'modal-actions' },
          React.createElement('button', { className: 'btn-cancel', onClick: onClose }, 'Cancel'),
          React.createElement('button', { className: 'btn-confirm', onClick: () => setWarned(true) }, "I Understand, Let's Go")
        )
      )
    );
  }

  // Step 2: preview screen after recording/selecting
  if (previewUrl) {
    return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
      React.createElement('div', { className: 'upload-modal', ref: swipeRef },
        React.createElement('div', { className: 'modal-handle' }),
        React.createElement('h3', { style: { fontFamily: "'Bebas Neue', sans-serif", fontSize: '1.5rem', letterSpacing: '1px', marginBottom: '1rem' } }, 'Preview'),
        React.createElement('video', { className: 'upload-preview', src: previewUrl, controls: true, playsInline: true, style: { width: '100%', borderRadius: '10px', marginBottom: '1rem' } }),
        uploading && React.createElement('div', { className: 'upload-progress' },
          React.createElement('div', { className: 'upload-progress-fill', style: { width: `${progress}%` } })
        ),
        React.createElement('div', { className: 'modal-actions' },
          React.createElement('button', { className: 'btn-cancel', onClick: () => {
            setFile(null); setPreviewUrl(null);
            if (mode === 'record' && supportsRecording) startCamera();
          }}, 'Re-record'),
          React.createElement('button', {
            className: 'btn-confirm',
            onClick: upload,
            disabled: !file || uploading
          }, uploading ? 'Uploading...' : 'Upload Chug 🍺')
        )
      )
    );
  }

  // Step 3: record / library tabs
  return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
    React.createElement('div', { className: 'upload-modal', ref: swipeRef },
      React.createElement('div', { className: 'modal-handle' }),

      // Mode tabs
      React.createElement('div', { className: 'record-tabs' },
        React.createElement('button', {
          className: `record-tab ${mode === 'record' ? 'active' : ''}`,
          onClick: () => { setMode('record'); }
        }, '🎥 Record'),
        React.createElement('button', {
          className: `record-tab ${mode === 'library' ? 'active' : ''}`,
          onClick: () => { stopCamera(); setMode('library'); }
        }, '📷 Camera Roll')
      ),

      // Non-Safari warning on record tab
      mode === 'record' && !supportsRecording &&
        React.createElement('div', { className: 'browser-warning' },
          '⚠️ In-app recording requires Safari on iOS. Please use Camera Roll to upload a video, or open this app in Safari to record.'
        ),

      // Record tab — Safari only
      mode === 'record' && supportsRecording && React.createElement('div', null,
        React.createElement('div', { className: 'record-zone' },
          React.createElement('video', {
            ref: videoRef,
            className: 'record-preview',
            autoPlay: true,
            muted: true,
            playsInline: true,
          }),
          recording && React.createElement('div', { className: 'record-dot' }),
          recording && React.createElement('div', {
            className: `record-countdown ${timeLeft <= 5 ? 'urgent' : ''}`,
          }, `${timeLeft}s`)
        ),
        React.createElement('div', { className: 'record-controls' },
          React.createElement('button', {
            className: `record-btn ${recording ? 'recording' : ''}`,
            onClick: () => recording ? stopRecording() : startRecording(),
          }),
          React.createElement('div', { className: 'record-label' },
            recording ? `Recording — tap to stop` : 'Tap to record'
          )
        )
      ),

      // Library tab
      mode === 'library' && React.createElement('div', { className: 'upload-zone' },
        React.createElement('input', {
          type: 'file', accept: 'video/*',
          onChange: e => handleFile(e.target.files[0])
        }),
        React.createElement('div', { className: 'upload-zone-icon' }, '📁'),
        React.createElement('div', { className: 'upload-zone-text' }, 'Choose from Camera Roll'),
        React.createElement('div', { className: 'upload-zone-hint' }, `Max ${MAX_VIDEO_SECONDS} seconds`)
      ),

      React.createElement('div', { className: 'modal-actions', style: { marginTop: '0.75rem' } },
        React.createElement('button', { className: 'btn-cancel', onClick: () => { stopCamera(); onClose(); } }, 'Cancel')
      )
    )
  );
}

function HRCard({ event, currentUser, onAssigned, showToast, videosEnabled, onNavigateVideos, highlight, enterDelay = 0 }) {
  const [likes, setLikes]           = useState([]);
  const [comments, setComments]     = useState([]);
  const [showComments, setShowComments] = useState(true);
  const [commentText, setCommentText]   = useState('');
  const [showAssign, setShowAssign]   = useState(false);
  const [showUpload, setShowUpload]   = useState(false);
  const [assignment, setAssignment]   = useState(null);
  const [drinkLog, setDrinkLog]       = useState(null);
  const [chugVideo, setChugVideo]     = useState(null);

  const playerColor  = PLAYER_COLORS[event.player_key] || '#888';
  const drinkerColor = USER_COLORS[event.drinker] || '#888';
  const userLiked    = likes.some(l => l.username === currentUser);

  // Compute derived status client-side
  const status       = computeStatus(drinkLog);
  const countdown    = useCountdown(drinkLog, event.drink_type);
  const canApprove   = canUserApprove(event, drinkLog, currentUser);
  const canAssign    = event.drink_type === 'you_drink'
                        && event.drinker === currentUser
                        && !assignment;

  // Who is the actual drinker for this event?
  const actualDrinker = event.drink_type === 'you_drink' && drinkLog?.given_to
    ? drinkLog.given_to : event.drinker;
  // Show upload button only if: it's the drinker's card and no video yet
  // Only show record link if: no video yet, it's my drink, drink is not completed,
  // and for you_drink it must already be assigned to me
  const canUploadVideo = !chugVideo
    && currentUser === actualDrinker
    && !['completed', 'done', 'completed_late'].includes(status)
    && (event.drink_type === 'i_drink' || (event.drink_type === 'you_drink' && drinkLog?.given_to));
  // Show view video link if video exists
  const hasVideo = !!chugVideo;

  // Card outline class
  const baseClass = status === 'late'
    ? 'hr-card late'
    : status === 'completed_late'
      ? 'hr-card completed-late'
      : status === 'awaiting_approval'
        ? 'hr-card awaiting-approval'
        : 'hr-card';
  const cardClass = highlight ? baseClass + ' highlight' : baseClass;

  useEffect(() => {
    loadData();
    const chan = sb.channel(`hr-${event.id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, loadData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, loadData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_assignments' }, loadData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_log' }, loadData)
      .subscribe();
    return () => sb.removeChannel(chan);
  }, [event.id]);

  const loadData = async () => {
    const [l, c, a, dl, cv] = await Promise.all([
      sb.from('likes').select('*').eq('target_type', 'hr_event').eq('target_id', event.id),
      sb.from('comments').select('*').eq('hr_event_id', event.id).order('created_at'),
      sb.from('drink_assignments').select('*').eq('hr_event_id', event.id).maybeSingle(),
      sb.from('drink_log').select('*').eq('hr_event_id', event.id).maybeSingle(),
      sb.from('chug_videos').select('*').eq('hr_event_id', event.id).maybeSingle(),
    ]);
    if (l.data) setLikes(l.data);
    if (c.data) setComments(c.data);
    if (a.data !== undefined) setAssignment(a.data);
    if (dl.data !== undefined) setDrinkLog(dl.data);
    if (cv.data !== undefined) setChugVideo(cv.data);
  };

  const toggleLike = async () => {
    const { data: { session } } = await sb.auth.getSession();
    await fetch(`${BACKEND}/likes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ target_type: 'hr_event', target_id: event.id })
    });
    loadData();
  };

  const commentSubmitting = useRef(false);
  const addComment = async () => {
    if (!commentText.trim()) return;
    if (commentSubmitting.current) return;
    commentSubmitting.current = true;
    const text = commentText.trim();
    setCommentText('');
    try {
      const { data: { session } } = await sb.auth.getSession();
      await fetch(`${BACKEND}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ hr_event_id: event.id, body: text })
      });
      loadData();
    } finally {
      commentSubmitting.current = false;
    }
  };

  const deleteComment = async (commentId) => {
    const { data: { session } } = await sb.auth.getSession();
    await fetch(`${BACKEND}/comments/${commentId}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${session.access_token}` },
    });
    loadData();
  };

  const approveDrink = async () => {
    if (!drinkLog) return;
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(`${BACKEND}/drinks/approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ drink_log_id: drinkLog.id })
    });
    if (res.ok) {
      showToast('Drink approved! 🍺');
      loadData();
    } else {
      const err = await res.json();
      showToast(err.error || 'Failed to approve');
    }
  };

  const timestamp = new Date(event.created_at).toLocaleString('en-US', {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true
  });

  // Build the drink info line
  const drinkInfoLine = () => {
    if (event.drink_type === 'i_drink') {
      return React.createElement('span', null,
        React.createElement('strong', { style: { color: drinkerColor } }, cap(event.drinker)),
        ' drinks for ',
        React.createElement('strong', { style: { color: playerColor } }, event.full_name),
        "'s homer"
      );
    }
    if (assignment) {

function DateRangePicker({ onApply, onClose, activeDates }) {
  const now = new Date();
  const [viewYear, setViewYear]   = useState(now.getFullYear());
  const [viewMonth, setViewMonth] = useState(now.getMonth());
  const [startDate, setStartDate] = useState(null);
  const [endDate, setEndDate]     = useState(null);
  const [hoverDate, setHoverDate] = useState(null);

  const WEEKDAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  const MONTHS   = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];

  const firstDay   = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const todayStr   = now.toISOString().slice(0, 10);

  const toStr = (d) => d ? d.toISOString().slice(0, 10) : null;

  const prevMonth = () => {
    if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
    else setViewMonth(m => m - 1);
  };

  const nextMonth = () => {
    if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
    else setViewMonth(m => m + 1);
  };

  const handleDayClick = (day) => {
    const clicked = new Date(viewYear, viewMonth, day);
    if (!startDate || (startDate && endDate)) {
      // Starting a new selection
      setStartDate(clicked);
      setEndDate(null);
    } else {
      // Picking end date — must be same day or after start
      if (clicked < startDate) {
        // Ignore clicks before start date — start over from clicked date
        setStartDate(clicked);
        setEndDate(null);
      } else {
        setEndDate(clicked);
      }
    }
  };

  const formatDisplay = (d) => d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : null;

  const rangeLabel = () => {
    if (!startDate) return 'Select a start date';
    if (!endDate)   return React.createElement('span', null, formatDisplay(startDate), ' → select end date');
    return React.createElement('span', null, formatDisplay(startDate), ' → ', formatDisplay(endDate));
  };

  const days = [];
  // Empty cells before first day
  for (let i = 0; i < firstDay; i++) days.push(null);
  for (let d = 1; d <= daysInMonth; d++) days.push(d);

  const getDayClass = (day) => {
    if (!day) return 'cal-day cal-day-empty';
    const dateStr  = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dateObj  = new Date(viewYear, viewMonth, day);
    const startStr = toStr(startDate);
    const endStr   = toStr(endDate);
    const hoverStr = toStr(hoverDate);
    const effectiveEnd = endStr || hoverStr;

    let cls = 'cal-day';
    if (dateStr === todayStr) cls += ' cal-day-today';
    if (activeDates && activeDates.has(dateStr)) cls += ' cal-day-has-data';
    // Grey out dates before startDate when picking end date
    if (startDate && !endDate && dateObj < startDate && dateStr !== toStr(startDate))
      cls += ' cal-day-disabled';
    if (startStr && dateStr === startStr) cls += ' cal-day-start';
    if (endStr   && dateStr === endStr)   cls += ' cal-day-end';
    if (startStr && effectiveEnd && dateStr > startStr && dateStr < effectiveEnd)
      cls += ' cal-day-in-range';
    return cls;
  };

  const swipeRef = useSwipeDismiss(onClose);
  return React.createElement('div', { className: 'cal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
    React.createElement('div', { className: 'cal-sheet', ref: swipeRef },
      React.createElement('div', { className: 'cal-handle' }),
      // Date range label at top
      React.createElement('div', { className: 'cal-range-label' }, rangeLabel()),
      // Month navigation
      React.createElement('div', { className: 'cal-header' },
        React.createElement('button', { className: 'cal-nav-btn', onClick: prevMonth }, '‹'),
        React.createElement('div', { className: 'cal-month-label' }, `${MONTHS[viewMonth]} ${viewYear}`),
        React.createElement('button', { className: 'cal-nav-btn', onClick: nextMonth }, '›')
      ),
      React.createElement('div', { className: 'cal-weekdays' },
        WEEKDAYS.map(w => React.createElement('div', { key: w, className: 'cal-weekday' }, w))
      ),
      React.createElement('div', { className: 'cal-days' },
        days.map((day, i) => React.createElement('div', {
          key: i,
          className: getDayClass(day),
          onClick: day ? () => handleDayClick(day) : undefined,
          onMouseEnter: day && startDate && !endDate
            ? () => setHoverDate(new Date(viewYear, viewMonth, day))
            : undefined,
          onMouseLeave: () => setHoverDate(null),
        }, day || ''))
      ),
      // Action buttons directly below calendar
      React.createElement('div', { className: 'cal-actions' },
        React.createElement('button', {
          className: 'cal-btn-clear',
          onClick: () => { setStartDate(null); setEndDate(null); onApply(null, null); onClose(); }
        }, 'Clear'),
        React.createElement('button', {
          className: 'cal-btn-apply',
          disabled: !startDate,
          onClick: () => { onApply(toStr(startDate), toStr(endDate || startDate)); onClose(); }
        }, 'Apply')
      )
    )
  );
}

function FeedScreen({ currentUser, showToast, videosEnabled, onNavigateVideos, deepLinkEventId, onDeepLinkHandled, hasUnread, onClearUnread }) {
  const [events, setEvents]   = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch]   = useState('');
  const [filters, setFilters] = useState({});
  const [highlightId, setHighlightId] = useState(deepLinkEventId || null);
  const [drinkLogs, setDrinkLogs] = useState({});



  useEffect(() => {
    loadEvents();
    const chan = sb.channel('feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'hr_events' }, loadEvents)
      .subscribe();

    // Clear unread dot when user scrolls back to top of the feed
    const feedEl = document.querySelector('.feed');
    const handleScroll = () => {
      if (feedEl && feedEl.scrollTop < 20 && hasUnread) {
        onClearUnread && onClearUnread();
      }
    };
    if (feedEl) feedEl.addEventListener('scroll', handleScroll, { passive: true });

    return () => {
      sb.removeChannel(chan);
      if (feedEl) feedEl.removeEventListener('scroll', handleScroll);
    };
  }, []);

  const loadEvents = async () => {
    const [evRes, dlRes] = await Promise.all([
      sb.from('hr_events').select('*').order('created_at', { ascending: false }).limit(50),
      sb.from('drink_log').select('*'),
    ]);
    if (evRes.data) setEvents(evRes.data);
    if (dlRes.data) {
      const map = {};
      dlRes.data.forEach(dl => { map[dl.hr_event_id] = dl; });
      setDrinkLogs(map);
    }
    setLoading(false);

    // Scroll to and highlight deep-linked card after data loads
    if (deepLinkEventId) {
      setTimeout(() => {
        const el = document.getElementById(`hr-card-${deepLinkEventId}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          setHighlightId(deepLinkEventId);
          setTimeout(() => { setHighlightId(null); onDeepLinkHandled && onDeepLinkHandled(); }, 2000);
        }
      }, 400);
    }
  };



  // Unique dates for the date dropdown
  // Build set of YYYY-MM-DD strings for calendar dot indicators
  const allEventDates = new Set(events.map(e => e.created_at?.slice(0, 10)).filter(Boolean));

  const anyStatusFilter = ['pending','awaiting_approval','completed','completed_late','late'].some(k => filters[k]);
  const anyTypeFilter   = ['i_drink','you_drink'].some(k => filters[k]);

  const filtered = events.filter(e => {
    // Search: player name or drinker username
    if (search) {
      const q = search.toLowerCase();
      if (!e.full_name.toLowerCase().includes(q) && !e.drinker.toLowerCase().includes(q)) return false;
    }
    // Date range filter
    if (filters.dateStart) {
      const d = e.created_at?.slice(0, 10);
      if (!d) return false;
      if (d < filters.dateStart) return false;
      if (filters.dateEnd && d > filters.dateEnd) return false;
    }
    // Status filter
    if (anyStatusFilter) {
      const dl     = drinkLogs[e.id];
      const status = computeStatus(dl);
      // For filter purposes, i_drink pending = "awaiting" (To Be Drank),
      // only you_drink pending = "pending" (To Be Assigned)
      const filterKey = (status === 'pending' && e.drink_type === 'i_drink')
        ? 'awaiting_approval'
        : status;
      if (!filters[filterKey]) return false;
    }
    // Type filter
    if (anyTypeFilter && !filters[e.drink_type]) return false;
    return true;
  });

  if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));

  return React.createElement(React.Fragment, null,
    React.createElement(SearchFilterBar, { search, onSearch: setSearch, filters, onFilter: setFilters, dateOptions: [], allEventDates }),
    !events.length
      ? React.createElement('div', { className: 'empty' },
          React.createElement('div', { className: 'empty-icon' }, '⚾'),
          React.createElement('p', null, 'No homers yet. Stay tuned.')
        )
      : filtered.length === 0
        ? React.createElement('div', { className: 'no-results' }, 'No events match your search.')
        : React.createElement('div', { className: 'feed' },
            filtered.map((e, i) => React.createElement(HRCard, { key: e.id, event: e, currentUser, onAssigned: loadEvents, showToast, videosEnabled, onNavigateVideos, highlight: highlightId === e.id, enterDelay: Math.min(i * 0.06, 0.5) }))
          )
  );
}

function LeaderboardScreen() {

  const [drinkLB, setDrinkLB]         = useState([]);
  const [iDrinkHRs, setIDrinkHRs]     = useState({}); // player_key → current_hrs
  const [loading, setLoading]         = useState(true);

  useEffect(() => {
    const load = async () => {
      const [hr, dl, allDrinkLogs] = await Promise.all([
        sb.from('hr_totals').select('*'),
        sb.from('leaderboard').select('*'),
        sb.from('drink_log').select('*'),
      ]);

      if (hr.data) {
        setHrTotals(hr.data.sort((a, b) => b.current_hrs - a.current_hrs));
        // Build a map of player_key → current_hrs for the progress bars
        const hrMap = {};
        hr.data.forEach(p => { hrMap[p.player_key] = p.current_hrs || 0; });
        setIDrinkHRs(hrMap);
      }
      if (dl.data) setDrinkTotals(dl.data.sort((a, b) => b.total_drinks - a.total_drinks));

      // Build drink leaderboard from drink_log directly so we can count late drinks
      const counts = {};
      ALL_USERS.forEach(u => { counts[u] = { drinks: 0, late: 0 }; });

      if (allDrinkLogs.data) {
        allDrinkLogs.data.forEach(log => {
          const drinker = (log.drink_type === 'you_drink' ? log.given_to : log.username) || log.username;
          const key = drinker.toLowerCase();
          if (counts[key] === undefined) return;
          counts[key].drinks++;
          const status = computeStatus(log);
          if (status === 'late') counts[key].late++;
        });
      }

      const lb = Object.entries(counts)
        .map(([username, { drinks, late }]) => ({ username, drinks, late }))
        .sort((a, b) => b.drinks - a.drinks);
      setDrinkLB(lb);

      setLoading(false);
    };
    load();

              const rank       = idx === 0 ? 2 : idx === 1 ? 1 : 3;
              const slotClass  = rank === 1 ? 'first' : rank === 2 ? 'second' : 'third';

// ── Log Screen ────────────────────────────────────────────────────────────

function LogScreen({ currentUser, videosEnabled, onNavigateVideos }) {
  const [logs, setLogs]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch]   = useState('');
  const [filters, setFilters] = useState({});

  useEffect(() => {
    const load = async () => {
      const [logRes, vidRes] = await Promise.all([
        sb.from('drink_log').select('*, hr_events(created_at)').order('event_date', { ascending: false }),
        sb.from('chug_videos').select('hr_event_id, actual_drinker'),
      ]);
      if (logRes.error) console.error('[LOG] fetch error:', logRes.error);
      if (logRes.data) {
        // Annotate each log row with video info
        const videoSet = new Set((vidRes.data || []).map(v => v.hr_event_id));
        const videoOwner = {};
        (vidRes.data || []).forEach(v => { videoOwner[v.hr_event_id] = v.actual_drinker; });
        const annotated = logRes.data.map(l => {
          const actualDrinker = (l.drink_type === 'you_drink' && l.given_to) ? l.given_to : l.username;
          return {
            ...l,
            _hasVideo:  videoSet.has(l.hr_event_id),
            _isMyDrink: actualDrinker === currentUser && !videoSet.has(l.hr_event_id)
                          && !['completed', 'done', 'completed_late'].includes(computeStatus(l))
                          && (l.drink_type === 'i_drink' || (l.drink_type === 'you_drink' && l.given_to)),
          };
        });
        setLogs(annotated);
      }
      setLoading(false);
    };
    load();
  }, []);

  // Unique dates for dropdown
  const allEventDates = new Set(logs.map(l => {
    const raw = l.hr_events?.created_at || (l.event_date ? l.event_date : null);
    return raw ? raw.slice(0, 10) : null;
  }).filter(Boolean));

  const anyStatusFilter = ['pending','awaiting_approval','completed','completed_late','late'].some(k => filters[k]);
  const anyTypeFilter   = ['i_drink','you_drink'].some(k => filters[k]);

  const filtered = logs.filter(l => {
    const status      = computeStatus(l);
    const actualDrinker = (l.drink_type === 'you_drink' && l.given_to) ? l.given_to : l.username;
    const raw         = l.hr_events?.created_at || (l.event_date ? l.event_date + 'T12:00:00' : null);
    const displayDate = raw ? new Date(raw).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

    if (search) {
      const q = search.toLowerCase();
      const matchesPlayer = l.mlb_player?.toLowerCase().includes(q);
      const matchesDrinker = l.username?.toLowerCase().includes(q) || actualDrinker?.toLowerCase().includes(q);
      if (!matchesPlayer && !matchesDrinker) return false;
    }
    if (filters.dateStart) {
      const rawStr = l.hr_events?.created_at?.slice(0, 10) || l.event_date || '';
      if (!rawStr || rawStr < filters.dateStart) return false;
      if (filters.dateEnd && rawStr > filters.dateEnd) return false;
    }
    // Same logic: i_drink pending maps to awaiting_approval for filtering
    const filterKey = (status === 'pending' && l.drink_type === 'i_drink')
      ? 'awaiting_approval'
      : status;
    if (anyStatusFilter && !filters[filterKey]) return false;
    if (anyTypeFilter && !filters[l.drink_type]) return false;
    return true;
  });

  const renderRow = (l) => {
    const status      = computeStatus(l);
    const raw         = l.hr_events?.created_at || (l.event_date ? l.event_date + 'T12:00:00' : null);
    const displayDate = raw ? new Date(raw).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';

    return React.createElement('div', { key: l.id, className: `log-row status-${status}` },
      React.createElement('div', { style: { color: 'var(--muted)', fontSize: '0.75rem' } }, displayDate),
      React.createElement('div', { style: { fontWeight: 500 } },
        l.drink_type === 'you_drink' && l.given_to
          ? React.createElement('span', null,
              React.createElement('span', { style: { color: USER_COLORS[l.username] || '#888', fontSize: '0.75rem' } }, cap(l.username)),
              React.createElement('span', { style: { color: 'var(--muted)' } }, ' → '),
              React.createElement('span', { style: { color: USER_COLORS[l.given_to] || '#888' } }, cap(l.given_to))
            )
          : React.createElement('span', { style: { color: USER_COLORS[l.username] || '#888' } }, cap(l.username))
      ),
      React.createElement('div', { style: { fontSize: '0.78rem', color: 'var(--muted)' } }, l.mlb_player),
      React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } },
        React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '4px' } },
          React.createElement('span', { className: `log-status-dot ${status}` }),
          React.createElement('span', { style: {
            fontSize: '0.7rem',
            color: status === 'late' ? '#e84a4a'
                 : status === 'completed' ? '#7cb85c'
                 : status === 'completed_late' ? '#e88c4a'
                 : status === 'awaiting_approval' ? 'var(--accent)'
                 : '#888'
          } },
            status === 'late' ? 'Late'
            : status === 'completed' ? 'Done'
            : status === 'completed_late' ? 'Done (Late)'
            : status === 'awaiting_approval' ? 'To Be Drank'
            : l.drink_type === 'i_drink' ? 'To Be Drank'
            : 'To Be Assigned'
          )
        ),
        videosEnabled && l._hasVideo && React.createElement('button', { className: 'log-video-link', onClick: onNavigateVideos },
          '🎥 View'
        ),
        videosEnabled && !l._hasVideo && l._isMyDrink && React.createElement('button', { className: 'log-video-link', onClick: onNavigateVideos },
          '🎥 Record'
        )
      )
    );
  };

  if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));

  return React.createElement(React.Fragment, null,
    React.createElement(SearchFilterBar, { search, onSearch: setSearch, filters, onFilter: setFilters, dateOptions: [], allEventDates }),
    React.createElement('div', { className: 'log-screen' },
      React.createElement('div', { className: 'log-table' },
        React.createElement('div', { className: 'log-header' },
          React.createElement('div', null, 'Date'),
          React.createElement('div', null, 'Drinker'),
          React.createElement('div', null, 'Player'),
          React.createElement('div', null, 'Status')
        ),
        logs.length === 0
          ? React.createElement('div', { style: { padding: '2rem', textAlign: 'center', color: 'var(--muted)' } }, 'No drinks logged yet')
          : filtered.length === 0
            ? React.createElement('div', { className: 'no-results' }, 'No entries match your search.')
            : filtered.map(renderRow)
      )
    )
  );
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Going Yard">
<meta name="theme-color" content="#0a0a0f">
<title>Going Yard & Drinking Hard</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #13131a;
  --surface2: #1c1c26;
  --border: rgba(255,255,255,0.08);
  --text: #f0f0f0;
  --muted: #888;
  --accent: #e8c14a;

  --frank-color: #e85d4a;
  --scott-color: #4a9eff;
  --tyler-color: #7cb85c;
  --ned-color: #c97de8;
  --ryan-color: #e87c3e;
  --steve-color: #4acfe8;
  --dan-color: #e84a8a;
  --stephen-color: #e8c14a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

.app { display: flex; flex-direction: column; min-height: 100vh; max-width: 480px; margin: 0 auto; }

/* ── Auth Screen ── */
.auth-screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: var(--bg);
  position: relative;
  overflow: hidden;
}

.auth-screen::before {
  content: '';
  position: absolute;
  top: -200px; left: -200px;
  width: 600px; height: 600px;
  background: radial-gradient(circle, rgba(232,193,74,0.08) 0%, transparent 70%);
  pointer-events: none;
}

.auth-logo {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 3rem;
  color: var(--accent);
  text-align: center;
  line-height: 1;
  margin-bottom: 0.5rem;
  letter-spacing: 2px;
}

.auth-sub {
  font-size: 0.8rem;
  color: var(--muted);
  text-align: center;
  margin-bottom: 3rem;
  letter-spacing: 3px;
  text-transform: uppercase;
}

.auth-card {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem;
}

.auth-card h2 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 1px;
  margin-bottom: 1.5rem;
  color: var(--text);
}

.form-group { margin-bottom: 1rem; }

.form-group label {
  display: block;
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 0.5rem;
}

.form-group input, .form-group select {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 1rem;
  outline: none;
  transition: border-color 0.2s;
}

.form-group input:focus, .form-group select:focus { border-color: var(--accent); }
.form-group select option { background: var(--surface2); }

.btn-primary {
  width: 100%;
  background: var(--accent);
  color: #0a0a0f;
  border: none;
  border-radius: 8px;
  padding: 0.875rem;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  cursor: pointer;
  margin-top: 1rem;
  transition: opacity 0.2s, transform 0.1s;
}

.btn-primary:hover { opacity: 0.9; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.4; cursor: not-allowed; }

.auth-toggle {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.auth-toggle span { color: var(--accent); cursor: pointer; text-decoration: underline; }

.error-msg {
  background: rgba(232,74,74,0.1);
  border: 1px solid rgba(232,74,74,0.3);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  font-size: 0.875rem;
  color: #e84a4a;
  margin-bottom: 1rem;
}

/* ── Nav ── */
.nav {
  position: fixed;
  bottom: 0; left: 50%;
  transform: translateX(-50%);
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  padding: 0.5rem 0 calc(0.5rem + env(safe-area-inset-bottom));
  z-index: 100;
}

.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 0.5rem;
  cursor: pointer;
  transition: opacity 0.2s;
  border: none;
  background: none;
  color: var(--muted);
}

.nav-item.active { color: var(--accent); }
.nav-item svg { width: 22px; height: 22px; }
.nav-item span { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1px; }

/* ── Header ── */
.header {
  position: sticky;
  top: 0;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 1rem 1.25rem;
  z-index: 50;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.header-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  color: var(--accent);
  letter-spacing: 2px;
}

.header-user {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  color: var(--muted);
}

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.75rem;
  font-weight: 600;
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 1px;
}

/* ── Feed ── */
.feed {
  flex: 1;
  padding: 1rem 1rem 6rem;
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

/* ── HR Card status variants ── */
.hr-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  transition: border-color 0.3s;
}

/* Awaiting approval — gold pulse */
.hr-card.awaiting-approval {
  border-color: rgba(232,193,74,0.6);
  animation: pulse-yellow 2.2s ease-in-out infinite;
}

/* Late — red pulse */
.hr-card.late {
  border-color: rgba(232,74,74,0.7);
  animation: pulse-red 1.6s ease-in-out infinite;
}

@keyframes pulse-yellow {
  0%, 100% { box-shadow: 0 0 0 0   rgba(232,193,74,0.35); }
  50%       { box-shadow: 0 0 0 8px rgba(232,193,74,0); }
}

@keyframes pulse-red {
  0%, 100% { box-shadow: 0 0 0 0   rgba(232,74,74,0.45); }
  50%       { box-shadow: 0 0 0 10px rgba(232,74,74,0); }
}

.hr-card-accent { height: 3px; width: 100%; }
.hr-card-body { padding: 1rem 1.25rem; }

.hr-card-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 0.75rem;
}

.hr-player { display: flex; flex-direction: column; gap: 2px; }

.hr-player-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  letter-spacing: 1px;
  line-height: 1;
}

.hr-player-team {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.hr-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0.4rem 0.75rem;
  border-radius: 20px;
  font-size: 0.75rem;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.hr-badge.i-drink {
  background: rgba(232,193,74,0.15);
  color: var(--accent);
  border: 1px solid rgba(232,193,74,0.3);
}

.hr-badge.you-drink {
  background: rgba(74,159,255,0.15);
  color: #4a9eff;
  border: 1px solid rgba(74,159,255,0.3);
}

.hr-drink-info {
  background: var(--surface2);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  margin-bottom: 0.75rem;
  font-size: 0.875rem;
}

.hr-drink-info strong { color: var(--text); }

.hr-timestamp {
  font-size: 0.75rem;
  color: var(--muted);
  margin-bottom: 0.75rem;
}

/* ── Drink status badge ── */
.drink-status-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 0.5rem;
  flex-wrap: wrap;
}

.drink-status-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 0.7rem;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 20px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

.drink-status-badge.pending {
  background: rgba(136,136,136,0.12);
  color: #999;
  border: 1px solid rgba(136,136,136,0.25);
}

.drink-status-badge.awaiting {
  background: rgba(232,193,74,0.12);
  color: var(--accent);
  border: 1px solid rgba(232,193,74,0.4);
}

.drink-status-badge.completed {
  background: rgba(124,184,92,0.12);
  color: #7cb85c;
  border: 1px solid rgba(124,184,92,0.35);
}

.drink-status-badge.late {
  background: rgba(232,74,74,0.12);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.45);
}

/* ── Actions row ── */
.hr-actions {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  padding-top: 0.75rem;
  border-top: 1px solid var(--border);
  flex-wrap: wrap;
}

.action-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: none;
  border: none;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  cursor: pointer;
  padding: 0.4rem 0.75rem;
  border-radius: 20px;
  transition: all 0.2s;
}

.action-btn:hover { background: var(--surface2); color: var(--text); }
.action-btn.liked { color: #e84a4a; }
.action-btn svg { width: 16px; height: 16px; }

.assign-btn {
  margin-left: auto;
  background: rgba(74,159,255,0.1);
  border: 1px solid rgba(74,159,255,0.3);
  color: #4a9eff;
  border-radius: 8px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
}

.assign-btn:hover { background: rgba(74,159,255,0.2); }

.approve-btn {
  background: rgba(124,184,92,0.1);
  border: 1px solid rgba(124,184,92,0.35);
  color: #7cb85c;
  border-radius: 8px;
  padding: 0.4rem 0.875rem;
  font-family: 'DM Sans', sans-serif;
  font-size: 0.8rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-left: auto;
}

.approve-btn:hover { background: rgba(124,184,92,0.2); }

/* ── Comments ── */
.comments-section {
  padding: 0 1.25rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
}

.comment { display: flex; gap: 0.5rem; align-items: flex-start; }

.comment-body {
  background: var(--surface2);
  border-radius: 10px;
  padding: 0.5rem 0.75rem;
  flex: 1;
}

.comment-username { font-size: 0.75rem; font-weight: 600; margin-bottom: 2px; }
.comment-text { font-size: 0.875rem; color: var(--text); }

.comment-input-row {
  display: flex;
  gap: 0.5rem;
  padding: 0.75rem 1.25rem 1rem;
  border-top: 1px solid var(--border);
}

.comment-input {
  flex: 1;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.5rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.875rem;
  outline: none;
}

.comment-input:focus { border-color: var(--accent); }

.send-btn {
  background: var(--accent);
  border: none;
  border-radius: 50%;
  width: 36px; height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  flex-shrink: 0;
}

.send-btn svg { width: 16px; height: 16px; }

/* ── Leaderboard ── */
.leaderboard-screen { flex: 1; padding: 1rem 1rem 6rem; }

.section-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 0.75rem;
  padding: 0 0.25rem;
}

.lb-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}

.lb-row {
  display: flex;
  align-items: center;
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  gap: 0.75rem;
}

.lb-row:last-child { border-bottom: none; }

.lb-rank {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  color: var(--muted);
  width: 24px;
  text-align: center;
}

.lb-rank.gold { color: var(--accent); }
.lb-rank.silver { color: #aaa; }
.lb-rank.bronze { color: #cd7f32; }

.lb-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
.lb-sub { font-size: 0.75rem; color: var(--muted); margin-top: 1px; }

.lb-stat {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.4rem;
  min-width: 36px;
  text-align: right;
}

.lb-stat-group {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 2px;
}

.lb-label {
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  text-align: right;
}

.late-badge {
  font-size: 0.65rem;
  padding: 2px 7px;
  border-radius: 10px;
  background: rgba(232,74,74,0.15);
  color: #e84a4a;
  border: 1px solid rgba(232,74,74,0.35);
  font-weight: 600;
  letter-spacing: 0.5px;
  white-space: nowrap;
}

/* ── Log Screen ── */
.log-screen { flex: 1; padding: 1rem 1rem 6rem; }

.log-table {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}

.log-header {
  display: grid;
  grid-template-columns: 72px 1fr 1fr 68px;
  padding: 0.75rem 1rem;
  background: var(--surface2);
  font-size: 0.65rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  border-bottom: 1px solid var(--border);
}

/* Log rows get a left-border color based on status */
.log-row {
  display: grid;
  grid-template-columns: 72px 1fr 1fr 68px;
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
  font-size: 0.8rem;
  align-items: center;
  border-left: 3px solid transparent;
  transition: border-color 0.2s;
}

.log-row:last-child { border-bottom: none; }
.log-row.status-late { border-left-color: #e84a4a; }
.log-row.status-awaiting { border-left-color: var(--accent); }
.log-row.status-completed { border-left-color: #7cb85c; }
.log-row.status-pending { border-left-color: rgba(136,136,136,0.3); }

.log-status-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  display: inline-block;
  margin-right: 4px;
  flex-shrink: 0;
}

.log-status-dot.pending   { background: #666; }
.log-status-dot.awaiting  { background: var(--accent); }
.log-status-dot.completed { background: #7cb85c; }
.log-status-dot.late      { background: #e84a4a; }

/* ── Assign Modal ── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}

.modal {
  width: 100%; max-width: 480px;
  background: var(--surface);
  border-radius: 24px 24px 0 0;
  padding: 1.5rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom));
  border-top: 1px solid var(--border);
}

.modal-handle {
  width: 40px; height: 4px;
  background: var(--border);
  border-radius: 2px;
  margin: 0 auto 1.5rem;
}

.modal h3 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 1px;
  margin-bottom: 1.5rem;
}

.user-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0.75rem;
  margin-bottom: 1.5rem;
}

.user-option {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  padding: 0.75rem 0.5rem;
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--surface2);
}

.user-option:hover { border-color: var(--accent); }
.user-option.selected { border-color: var(--accent); background: rgba(232,193,74,0.1); }
.user-option span { font-size: 0.7rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }

.msg-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem 1rem;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  outline: none;
  margin-bottom: 1rem;
  resize: none;
  height: 80px;
}

.msg-input:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 0.75rem; }

.btn-cancel {
  flex: 1;
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 0.75rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
  font-size: 0.9rem;
  cursor: pointer;
}

.btn-confirm {
  flex: 2;
  background: var(--accent);
  border: none;
  border-radius: 8px;
  padding: 0.75rem;
  color: #0a0a0f;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.1rem;
  letter-spacing: 1px;
  cursor: pointer;
}

.btn-confirm:disabled { opacity: 0.4; cursor: not-allowed; }

/* ── Empty / loading ── */
.empty { text-align: center; padding: 4rem 2rem; color: var(--muted); }
.empty-icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }

.loading { display: flex; align-items: center; justify-content: center; padding: 3rem; }

.spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ── I Drink Progress Board ── */
.progress-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 1.5rem;
}

.progress-row {
  padding: 0.875rem 1rem;
  border-bottom: 1px solid var(--border);
}

.progress-row:last-child { border-bottom: none; }

.progress-header {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  margin-bottom: 0.5rem;
}

.progress-names {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.progress-user {
  font-size: 0.875rem;
  font-weight: 500;
}

.progress-player {
  font-size: 0.75rem;
  color: var(--muted);
}

.progress-count {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  min-width: 48px;
  text-align: right;
  line-height: 1;
}

.progress-count span {
  font-size: 0.7rem;
  color: var(--muted);
  font-family: 'DM Sans', sans-serif;
}

.progress-bar-track {
  height: 8px;
  background: var(--surface2);
  border-radius: 4px;
  overflow: hidden;
}

.progress-bar-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
}

.progress-bar-fill::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.15) 50%, transparent 100%);
  border-radius: 4px;
}

/* ── Toast ── */
.toast {
  position: fixed;
  bottom: 90px; left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 0.75rem 1.5rem;
  font-size: 0.875rem;
  z-index: 300;
  animation: fadeInUp 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
  white-space: nowrap;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateX(-50%) translateY(10px); }

// ── Helpers ──────────────────────────────────────────────────────────────

/**
 * Compute the effective drink status for a drink_log row.
 *
 * Rules (applied client-side so the feed is always fresh even if the
 * backend late-sweep hasn't run yet):
 *
 *  completed          → always show completed, never override
 *  pending/awaiting   → if event_date > 24h ago → late
 *  pending            → still waiting (i_drink not yet approved,
 *                        or you_drink not yet assigned)
 *  awaiting_approval  → assigned but approval pending
 */
function computeStatus(drinkLog) {
  if (!drinkLog) return 'pending';
  const s = drinkLog.status || 'pending';
  if (s === 'completed') return 'completed';
  if (s === 'late') return 'late';

  // Check age using event_date (drink_log has no created_at column).
  // Treat noon on the event date as the start of the 24-hour window.
  if (drinkLog.event_date) {
    const eventNoon = new Date(drinkLog.event_date + 'T12:00:00');
    const ageHours  = (Date.now() - eventNoon.getTime()) / 36e5;
    if (ageHours > LATE_HOURS) return 'late';
  }

  return s; // 'pending' or 'awaiting_approval'
}

/**
 * For a you_drink event:
 *   - assigner = event.drinker (the person who must assign)
 *   - actual drinker = drink_log.given_to (the person who must drink)
 *
 * For an i_drink event:
 *   - actual drinker = event.drinker
 *
 * canApprove = currentUser is NOT the actual drinker AND drink is not yet completed.
 */
function canUserApprove(event, drinkLog, currentUser) {
  if (!drinkLog) return false;
  const status = computeStatus(drinkLog);
  if (status === 'completed') return false;

  const actualDrinker = (
    event.drink_type === 'you_drink'
      ? (drinkLog.given_to || null)
      : event.drinker
  );

  // For you_drink, we can only approve once it's been assigned (given_to set)
  if (event.drink_type === 'you_drink' && !drinkLog.given_to) return false;

  return actualDrinker && currentUser.toLowerCase() !== actualDrinker.toLowerCase();
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : ''; }

    }

}

function Toast({ msg }) {
  return React.createElement('div', { className: 'toast' }, msg);
}

function useToast() {
  const [toast, setToast] = useState(null);
  const show = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };
  return [toast, show];
}

    awaiting_approval:  { cls: 'awaiting',  icon: '👀', label: 'Awaiting Approval' },

  return React.createElement('span', { className: `drink-status-badge ${cfg.cls}` },

}

function AuthScreen({ onAuth }) {
  const [mode, setMode]           = useState('login');

  const [displayName, setDisplayName] = useState('');
  const [password, setPassword]   = useState('');
  const [groupPass, setGroupPass] = useState('');
  const [error, setError]         = useState('');
  const [loading, setLoading]     = useState(false);

  const handle = async () => {
    setError(''); setLoading(true);
    try {
      if (mode === 'register') {
        if (groupPass !== GROUP_PASSWORD) {
          setError('Incorrect group password. Ask Stephen for the group password.');
          setLoading(false); return;
        }
        if (!email.trim() || !email.includes('@')) {
          setError('Please enter a valid email address.');
          setLoading(false); return;
        }
        const { data, error: signUpErr } = await sb.auth.signUp({ email: email.trim(), password });
        if (signUpErr) throw signUpErr;
        if (data.user) {
          await sb.from('profiles').insert({
            id: data.user.id,
            username: username.toLowerCase(),
            display_name: displayName || username,
            color: USER_COLORS[username.toLowerCase()] || '#888',
            group_joined: true,
          });
          if (data.session) window.registerPush(data.session.access_token);
          onAuth(data.user, username.toLowerCase());
        }
      } else {
        if (!email.trim() || !email.includes('@')) {
          setError('Please enter your email address.');
          setLoading(false); return;
        }
        const { data, error: signInErr } = await sb.auth.signInWithPassword({ email: email.trim(), password });
        if (signInErr) throw signInErr;
        if (data.session) window.registerPush(data.session.access_token);
        onAuth(data.user, username.toLowerCase());
      }
    } catch (e) {
      setError(e.message || 'Something went wrong');
    }
    setLoading(false);
  };

  return React.createElement('div', { className: 'auth-screen' },
    React.createElement('div', { className: 'auth-logo' }, 'Going Yard'),
    React.createElement('div', { className: 'auth-sub' }, '& Drinking Hard'),

        )
      ),
      mode === 'register' && React.createElement('div', { className: 'form-group' },
        React.createElement('label', null, 'Display Name'),
        React.createElement('input', {
          type: 'text', placeholder: 'How your name appears',
          value: displayName, onChange: e => setDisplayName(e.target.value)

      ),

          value: email, onChange: e => setEmail(e.target.value)

      React.createElement('div', { className: 'form-group' },

// ── Assign Modal ──────────────────────────────────────────────────────────

function AssignModal({ event, currentUser, onClose, onAssigned, showToast }) {
  const [assignee, setAssignee] = useState('');
  const [msg, setMsg]           = useState('');
  const [loading, setLoading]   = useState(false);

  const assignableUsers = ALL_USERS.filter(u => u !== currentUser);

  const submit = async () => {
    if (!assignee) return;
    setLoading(true);
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${BACKEND}/assign`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ hr_event_id: event.id, assignee, message: msg })
      });
      if (!res.ok) {
        const err = await res.json();
        showToast(err.error || 'Failed to assign');
      } else {
        showToast(`Drink assigned to ${cap(assignee)}!`);
        onAssigned();
        onClose();
      }
    } catch (e) {
      showToast('Network error');
    }
    setLoading(false);
  };

  return React.createElement('div', { className: 'modal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
    React.createElement('div', { className: 'modal' },
      React.createElement('div', { className: 'modal-handle' }),
      React.createElement('h3', null, 'Assign the Drink'),
      React.createElement('div', { className: 'user-grid' },
        assignableUsers.map(u => React.createElement('div', {
          key: u,
          className: `user-option ${assignee === u ? 'selected' : ''}`,
          onClick: () => setAssignee(u)
        },
          React.createElement(Avatar, { name: u, size: 36 }),
          React.createElement('span', null, cap(u))
        ))
      ),
      React.createElement('textarea', {
        className: 'msg-input',
        placeholder: 'Add a message (optional)...',
        value: msg, onChange: e => setMsg(e.target.value)
      }),
      React.createElement('div', { className: 'modal-actions' },
        React.createElement('button', { className: 'btn-cancel', onClick: onClose }, 'Cancel'),
        React.createElement('button', {
          className: 'btn-confirm', onClick: submit, disabled: !assignee || loading
        }, loading ? 'Assigning...' : 'Assign Drink')
      )
    )
  );
}

// ── HR Card ───────────────────────────────────────────────────────────────

function HRCard({ event, currentUser, onAssigned, showToast }) {
  const [likes, setLikes]           = useState([]);
  const [comments, setComments]     = useState([]);
  const [showComments, setShowComments] = useState(true);
  const [commentText, setCommentText]   = useState('');
  const [showAssign, setShowAssign] = useState(false);
  const [assignment, setAssignment] = useState(null);
  const [drinkLog, setDrinkLog]     = useState(null);

  const playerColor  = PLAYER_COLORS[event.player_key] || '#888';
  const drinkerColor = USER_COLORS[event.drinker] || '#888';
  const userLiked    = likes.some(l => l.username === currentUser);

  // Compute derived status client-side
  const status       = computeStatus(drinkLog);
  const canApprove   = canUserApprove(event, drinkLog, currentUser);
  const canAssign    = event.drink_type === 'you_drink'
                        && event.drinker === currentUser
                        && !assignment;

  // Card outline class
  const cardClass = status === 'late'
    ? 'hr-card late'
    : status === 'awaiting_approval'
      ? 'hr-card awaiting-approval'
      : 'hr-card';

  useEffect(() => {
    loadData();
    const chan = sb.channel(`hr-${event.id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, loadData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, loadData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_assignments' }, loadData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_log' }, loadData)
      .subscribe();
    return () => sb.removeChannel(chan);
  }, [event.id]);

  const loadData = async () => {
    const [l, c, a, dl] = await Promise.all([
      sb.from('likes').select('*').eq('target_type', 'hr_event').eq('target_id', event.id),
      sb.from('comments').select('*').eq('hr_event_id', event.id).order('created_at'),
      sb.from('drink_assignments').select('*').eq('hr_event_id', event.id).maybeSingle(),
      sb.from('drink_log').select('*').eq('hr_event_id', event.id).maybeSingle(),
    ]);
    if (l.data) setLikes(l.data);
    if (c.data) setComments(c.data);
    if (a.data !== undefined) setAssignment(a.data);
    if (dl.data !== undefined) setDrinkLog(dl.data);
  };

  const toggleLike = async () => {
    const { data: { session } } = await sb.auth.getSession();
    await fetch(`${BACKEND}/likes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ target_type: 'hr_event', target_id: event.id })
    });
    loadData();
  };

  const addComment = async () => {
    if (!commentText.trim()) return;
    const { data: { session } } = await sb.auth.getSession();
    await fetch(`${BACKEND}/comments`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ hr_event_id: event.id, body: commentText.trim() })
    });
    setCommentText('');
    loadData();
  };

  const approveDrink = async () => {
    if (!drinkLog) return;
    const { data: { session } } = await sb.auth.getSession();
    const res = await fetch(`${BACKEND}/drinks/approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ drink_log_id: drinkLog.id })
    });
    if (res.ok) {
      showToast('Drink approved! 🍺');
      loadData();
    } else {
      const err = await res.json();
      showToast(err.error || 'Failed to approve');
    }
  };

  const timestamp = new Date(event.created_at).toLocaleString('en-US', {
    month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true
  });

  // Build the drink info line
  const drinkInfoLine = () => {
    if (event.drink_type === 'i_drink') {
      return React.createElement('span', null,
        React.createElement('strong', { style: { color: drinkerColor } }, cap(event.drinker)),
        ' drinks for ',
        React.createElement('strong', { style: { color: playerColor } }, event.full_name),
        "'s homer"
      );
    }
    if (assignment) {
      const assigneeColor = USER_COLORS[assignment.assignee] || '#888';
      return React.createElement('span', null,
        React.createElement('strong', { style: { color: drinkerColor } }, cap(event.drinker)),
        ' assigned to ',
        React.createElement('strong', { style: { color: assigneeColor } }, cap(assignment.assignee)),
        assignment.message ? ` — "${assignment.message}"` : ''
      );
    }
    return React.createElement('span', null,
      React.createElement('strong', { style: { color: drinkerColor } }, cap(event.drinker)),
      ' must assign a drink for ',
      React.createElement('strong', { style: { color: playerColor } }, event.full_name),
      "'s homer"
    );
  };

  return React.createElement('div', { className: cardClass },
    React.createElement('div', { className: 'hr-card-accent', style: { background: playerColor } }),
    React.createElement('div', { className: 'hr-card-body' },

      // Top row: player name + drink type badge
      React.createElement('div', { className: 'hr-card-top' },
        React.createElement('div', { className: 'hr-player' },
          React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '8px' } },
            TEAM_LOGOS[event.team] && React.createElement('img', {
              src: TEAM_LOGOS[event.team], alt: event.team,
              style: { width: 28, height: 28, objectFit: 'contain', flexShrink: 0 }
            }),
            React.createElement('div', { className: 'hr-player-name', style: { color: playerColor } }, event.full_name)
          ),
          React.createElement('div', { className: 'hr-player-team' }, `${event.team} • ${event.old_hrs} → ${event.new_hrs} HR`)
        ),
        React.createElement('div', { className: `hr-badge ${event.drink_type === 'i_drink' ? 'i-drink' : 'you-drink'}` },
          event.drink_type === 'i_drink' ? '🍺 Drink Up' : '🎯 Assign'
        )
      ),

      // Drink info box
      React.createElement('div', { className: 'hr-drink-info' },
        React.createElement('div', { style: { fontSize: '0.75rem', color: 'var(--accent)', fontStyle: 'italic', marginBottom: '6px' } },
          event.slogan || ''
        ),
        drinkInfoLine()
      ),

      // Drink status badge row
      React.createElement('div', { className: 'drink-status-row' },
        React.createElement(DrinkStatusBadge, {
          status,
          approvedBy: drinkLog?.approved_by
        }),
        // Hint text for pending you_drink awaiting assignment
        event.drink_type === 'you_drink' && !assignment && status !== 'late' &&
          React.createElement('span', { style: { fontSize: '0.7rem', color: 'var(--muted)' } },
            '— not yet assigned'
          )
      ),

      React.createElement('div', { className: 'hr-timestamp' }, timestamp),

      // Actions row
      React.createElement('div', { className: 'hr-actions' },
        // Like
        React.createElement('button', { className: `action-btn ${userLiked ? 'liked' : ''}`, onClick: toggleLike },
          React.createElement('svg', { viewBox: '0 0 24 24', fill: userLiked ? 'currentColor' : 'none', stroke: 'currentColor', strokeWidth: 2 },
            React.createElement('path', { d: 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z' })
          ),
          likes.length > 0 && likes.length
        ),
        // Comments toggle
        React.createElement('button', { className: 'action-btn', onClick: () => setShowComments(!showComments) },
          React.createElement('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2 },
            React.createElement('path', { d: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z' })
          ),
          comments.length > 0 && comments.length
        ),
        // Assign button (only for you_drink assigner if not yet assigned)
        canAssign && React.createElement('button', { className: 'assign-btn', onClick: () => setShowAssign(true) }, 'Assign Drink'),
        // Approve button (anyone except the actual drinker, once drink is ready to approve)
        canApprove && React.createElement('button', { className: 'approve-btn', onClick: approveDrink }, '✅ I Saw Them Drink')
      )
    ),

    // Comments section
    showComments && React.createElement('div', null,
      comments.length > 0 && React.createElement('div', { className: 'comments-section' },
        comments.map(c => React.createElement('div', { key: c.id, className: 'comment' },
          React.createElement(Avatar, { name: c.username, size: 28 }),
          React.createElement('div', { className: 'comment-body' },
            React.createElement('div', { className: 'comment-username', style: { color: USER_COLORS[c.username] || '#888' } }, cap(c.username)),
            React.createElement('div', { className: 'comment-text' }, c.body)
          )
        ))
      ),
      React.createElement('div', { className: 'comment-input-row' },
        React.createElement('input', {
          className: 'comment-input',
          placeholder: 'Add a comment...',
          value: commentText,
          onChange: e => setCommentText(e.target.value),
          onKeyDown: e => e.key === 'Enter' && addComment()
        }),
        React.createElement('button', { className: 'send-btn', onClick: addComment },
          React.createElement('svg', { viewBox: '0 0 24 24', fill: 'none', stroke: '#0a0a0f', strokeWidth: 2.5 },
            React.createElement('line', { x1: '22', y1: '2', x2: '11', y2: '13' }),
            React.createElement('polygon', { points: '22 2 15 22 11 13 2 9 22 2' })
          )
        )
      )
    ),

    showAssign && React.createElement(AssignModal, {
      event, currentUser,
      onClose: () => setShowAssign(false),
      onAssigned: () => { loadData(); onAssigned && onAssigned(); },
      showToast
    })
  );
}

// ── Feed Screen ───────────────────────────────────────────────────────────

function FeedScreen({ currentUser, showToast }) {
  const [events, setEvents] = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    loadEvents();
    const chan = sb.channel('feed')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'hr_events' }, loadEvents)
      .subscribe();
    return () => sb.removeChannel(chan);
  }, []);

  const loadEvents = async () => {
    const { data } = await sb.from('hr_events').select('*').order('created_at', { ascending: false }).limit(50);
    if (data) setEvents(data);
    setLoading(false);
  };

  if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));

  if (!events.length) return React.createElement('div', { className: 'empty' },
    React.createElement('div', { className: 'empty-icon' }, '⚾'),
    React.createElement('p', null, 'No homers yet. Stay tuned.')
  );

  return React.createElement('div', { className: 'feed' },
    events.map(e => React.createElement(HRCard, { key: e.id, event: e, currentUser, onAssigned: loadEvents, showToast }))
  );
}

// ── Leaderboard Screen ────────────────────────────────────────────────────

function LeaderboardScreen() {
  const [hrTotals, setHrTotals]       = useState([]);
  const [drinkTotals, setDrinkTotals] = useState([]);
  const [drinkLB, setDrinkLB]         = useState([]);
  const [iDrinkHRs, setIDrinkHRs]     = useState({}); // player_key → current_hrs
  const [loading, setLoading]         = useState(true);

  useEffect(() => {
    const load = async () => {
      const [hr, dl, allDrinkLogs] = await Promise.all([
        sb.from('hr_totals').select('*'),
        sb.from('leaderboard').select('*'),
        sb.from('drink_log').select('*'),
      ]);

      if (hr.data) {
        setHrTotals(hr.data.sort((a, b) => b.current_hrs - a.current_hrs));
        // Build a map of player_key → current_hrs for the progress bars
        const hrMap = {};
        hr.data.forEach(p => { hrMap[p.player_key] = p.current_hrs || 0; });
        setIDrinkHRs(hrMap);
      }
      if (dl.data) setDrinkTotals(dl.data.sort((a, b) => b.total_drinks - a.total_drinks));

      // Build drink leaderboard from drink_log directly so we can count late drinks
      const counts = {};
      ALL_USERS.forEach(u => { counts[u] = { drinks: 0, late: 0 }; });

      if (allDrinkLogs.data) {
        allDrinkLogs.data.forEach(log => {
          const drinker = (log.drink_type === 'you_drink' ? log.given_to : log.username) || log.username;
          const key = drinker.toLowerCase();
          if (counts[key] === undefined) return;
          counts[key].drinks++;
          const status = computeStatus(log);
          if (status === 'late') counts[key].late++;
        });
      }

      const lb = Object.entries(counts)
        .map(([username, { drinks, late }]) => ({ username, drinks, late }))
        .sort((a, b) => b.drinks - a.drinks);
      setDrinkLB(lb);

      setLoading(false);
    };
    load();
  }, []);

  const rankClass = (i) => i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';

  if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));

  return React.createElement('div', { className: 'leaderboard-screen' },

    // Drink Leaderboard
    React.createElement('div', { className: 'section-title' }, 'Drink Leaderboard'),
    React.createElement('div', { className: 'lb-card' },
      drinkLB.every(u => u.drinks === 0)
        ? React.createElement('div', { style: { padding: '2rem', textAlign: 'center', color: 'var(--muted)' } }, 'No drinks logged yet')
        : drinkLB.map((u, i) => React.createElement('div', { key: u.username, className: 'lb-row' },
            React.createElement('div', { className: `lb-rank ${rankClass(i)}` }, i + 1),
            React.createElement(Avatar, { name: u.username, size: 36 }),
            React.createElement('div', { style: { flex: 1 } },
              React.createElement('div', { className: 'lb-name', style: { color: USER_COLORS[u.username] } }, cap(u.username)),
              React.createElement('div', { className: 'lb-sub' }, 'drinks consumed')
            ),
            React.createElement('div', { className: 'lb-stat-group' },
              React.createElement('div', { className: 'lb-stat', style: { color: USER_COLORS[u.username] } }, u.drinks),
              React.createElement('div', { className: 'lb-label' }, 'Drinks'),
              u.late > 0 && React.createElement('div', { className: 'late-badge' }, `${u.late} late`)
            )
          ))
    ),

    // I Drink Progress Board
    React.createElement('div', { className: 'section-title' }, 'My Player Progress'),
    React.createElement('div', { className: 'progress-card' },
      ALL_USERS.map(user => {
        const matchup = I_DRINK_MATCHUP[user];
        const hrs     = iDrinkHRs[matchup.player] || 0;
        const pct     = Math.min((hrs / 20) * 100, 100);
        const color   = USER_COLORS[user] || '#888';
        const playerColor = PLAYER_COLORS[matchup.player] || '#888';
        return React.createElement('div', { key: user, className: 'progress-row' },
          React.createElement('div', { className: 'progress-header' },
            React.createElement(Avatar, { name: user, size: 34 }),
            React.createElement('div', { className: 'progress-names' },
              React.createElement('div', { className: 'progress-user', style: { color } }, cap(user)),
              React.createElement('div', { className: 'progress-player', style: { color: playerColor } }, matchup.fullName)
            ),
            React.createElement('div', { className: 'progress-count', style: { color: playerColor } },
              hrs,
              React.createElement('span', null, ' / 20')
            )
          ),
          React.createElement('div', { className: 'progress-bar-track' },
            React.createElement('div', {
              className: 'progress-bar-fill',
              style: {
                width: `${pct}%`,
                background: `linear-gradient(90deg, ${color}99, ${playerColor})`,
              }
            })
          )
        );
      })
    ),

    // MLB HR Leaderboard
    React.createElement('div', { className: 'section-title' }, 'MLB Home Runs'),
    React.createElement('div', { className: 'lb-card' },
      hrTotals.map((p, i) => React.createElement('div', { key: p.player_key, className: 'lb-row' },
        React.createElement('div', { className: `lb-rank ${rankClass(i)}` }, i + 1),
        React.createElement(Avatar, { name: p.player_key, size: 36, color: PLAYER_COLORS[p.player_key] }),
        React.createElement('div', { style: { flex: 1 } },
          React.createElement('div', { className: 'lb-name', style: { color: PLAYER_COLORS[p.player_key] } }, p.full_name),
          React.createElement('div', { className: 'lb-sub' }, p.team)
        ),
        React.createElement('div', { className: 'lb-stat-group' },
          React.createElement('div', { className: 'lb-stat', style: { color: PLAYER_COLORS[p.player_key] } }, p.current_hrs),
          React.createElement('div', { className: 'lb-label' }, 'HRs')
        )
      ))
    ),

    // Combined leaderboard
    React.createElement('div', { className: 'section-title' }, 'Combined Leaderboard'),
    React.createElement('div', { className: 'lb-card' },
      drinkTotals.length === 0
        ? React.createElement('div', { style: { padding: '2rem', textAlign: 'center', color: 'var(--muted)' } }, 'No drinks logged yet')
        : drinkTotals.map((u, i) => React.createElement('div', { key: u.username, className: 'lb-row' },
            React.createElement('div', { className: `lb-rank ${rankClass(i)}` }, i + 1),
            React.createElement(Avatar, { name: u.username, size: 36 }),
            React.createElement('div', { style: { flex: 1 } },
              React.createElement('div', { className: 'lb-name', style: { color: USER_COLORS[u.username] } }, cap(u.username)),
              React.createElement('div', { className: 'lb-sub' }, `${u.drinks_received || 0} received · ${u.drinks_assigned || 0} assigned`)
            ),
            React.createElement('div', { className: 'lb-stat-group' },
              React.createElement('div', { className: 'lb-stat', style: { color: USER_COLORS[u.username] } }, u.total_drinks),
              React.createElement('div', { className: 'lb-label' }, 'Total')
            )
          ))
    )
  );
}

// ── Log Screen ────────────────────────────────────────────────────────────

function LogScreen() {
  const [logs, setLogs]     = useState([]);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    const load = async () => {
      // Join hr_events to get created_at for display date matching the Feed tab.
      // Order by event_date desc (drink_log has no created_at column).
      const { data, error } = await sb
        .from('drink_log')
        .select('*, hr_events(created_at)')
        .order('event_date', { ascending: false });
      if (error) console.error('[LOG] fetch error:', error);
      if (data) setLogs(data);
      setLoading(false);
    };
    load();
  }, []);

  if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));

  return React.createElement('div', { className: 'log-screen' },
    React.createElement('div', { className: 'section-title' }, 'Drink Log'),
    React.createElement('div', { className: 'log-table' },
      React.createElement('div', { className: 'log-header' },
        React.createElement('div', null, 'Date'),
        React.createElement('div', null, 'Drinker'),
        React.createElement('div', null, 'Player'),
        React.createElement('div', null, 'Status')
      ),
      logs.length === 0
        ? React.createElement('div', { style: { padding: '2rem', textAlign: 'center', color: 'var(--muted)' } }, 'No drinks logged yet')
        : logs.map(l => {
            const status = computeStatus(l);
            // Use the HR event's date for display (not the log insert date)
            const displayDate = l.hr_events?.created_at
              ? new Date(l.hr_events.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
              : (l.event_date
                  ? new Date(l.event_date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
                  : '—');

            // Actual drinker (for you_drink it's the assignee)
            const actualDrinker = l.drink_type === 'you_drink' && l.given_to ? l.given_to : l.username;

            return React.createElement('div', { key: l.id, className: `log-row status-${status}` },
              React.createElement('div', { style: { color: 'var(--muted)', fontSize: '0.75rem' } }, displayDate),
              React.createElement('div', { style: { fontWeight: 500 } },
                l.drink_type === 'you_drink' && l.given_to
                  ? React.createElement('span', null,
                      React.createElement('span', { style: { color: USER_COLORS[l.username] || '#888', fontSize: '0.75rem' } }, cap(l.username)),
                      React.createElement('span', { style: { color: 'var(--muted)' } }, ' → '),
                      React.createElement('span', { style: { color: USER_COLORS[l.given_to] || '#888' } }, cap(l.given_to))
                    )
                  : React.createElement('span', { style: { color: USER_COLORS[l.username] || '#888' } }, cap(l.username))
              ),
              React.createElement('div', { style: { fontSize: '0.78rem', color: 'var(--muted)' } }, l.mlb_player),
              React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '4px' } },
                React.createElement('span', { className: `log-status-dot ${status}` }),
                React.createElement('span', { style: {
                  fontSize: '0.7rem',
                  color: status === 'late' ? '#e84a4a'
                       : status === 'completed' ? '#7cb85c'
                       : status === 'awaiting_approval' ? 'var(--accent)'
                       : '#888'
                } },
                  status === 'late' ? 'Late'
                  : status === 'completed' ? 'Done'
                  : status === 'awaiting_approval' ? 'Pending'
                  : 'Pending'
                )
              )
            );
          })
    )
  );
}

// ── Main App ──────────────────────────────────────────────────────────────

function App() {
  const [user, setUser]           = useState(null);
  const [username, setUsername]   = useState('');
  const [tab, setTab]             = useState('feed');
  const [toast, showToast]        = useToast();
  const [authChecked, setAuthChecked] = useState(false);

  useEffect(() => {
    sb.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        setUser(session.user);
        sb.from('profiles').select('username').eq('id', session.user.id).single()
          .then(({ data }) => { if (data) setUsername(data.username); });
      }
      setAuthChecked(true);
    });

    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
      if (!session) { setUser(null); setUsername(''); }
    });

    return () => subscription.unsubscribe();
  }, []);

  const onAuth = (u, uname) => { setUser(u); setUsername(uname); };
  const onSignOut = async () => { await sb.auth.signOut(); setUser(null); setUsername(''); };

  if (!authChecked) return React.createElement('div', { className: 'loading', style: { minHeight: '100vh' } },
    React.createElement('div', { className: 'spinner' })
  );

  if (!user) return React.createElement(AuthScreen, { onAuth });

  const NavIcon = ({ id, label, path }) => React.createElement('button', {
    className: `nav-item ${tab === id ? 'active' : ''}`,
    onClick: () => setTab(id)
  },
    React.createElement('svg', { viewBox: '0 0 24 24', fill: tab === id ? 'currentColor' : 'none', stroke: 'currentColor', strokeWidth: 1.5 },
      React.createElement('path', { d: path })
    ),
    React.createElement('span', null, label)
  );

  return React.createElement('div', { className: 'app' },
    React.createElement('div', { className: 'header' },
      React.createElement('div', { className: 'header-title' }, 'Going Yard'),
      React.createElement('div', { className: 'header-user' },
        React.createElement('span', { style: { color: USER_COLORS[username] } }, cap(username)),
        React.createElement(Avatar, { name: username, size: 32 }),
        React.createElement('button', {
          onClick: onSignOut,
          style: { background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer', fontSize: '0.75rem' }
        }, 'Out')
      )
    ),
    tab === 'feed'  && React.createElement(FeedScreen, { currentUser: username, showToast }),
    tab === 'board' && React.createElement(LeaderboardScreen),
    tab === 'log'   && React.createElement(LogScreen),
    React.createElement('nav', { className: 'nav' },
      React.createElement(NavIcon, { id: 'feed',  label: 'Feed',    path: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10' }),
      React.createElement(NavIcon, { id: 'board', label: 'Leaders', path: 'M18 20V10 M12 20V4 M6 20v-6' }),
      React.createElement(NavIcon, { id: 'log',   label: 'Log',     path: 'M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2 M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2 M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2 M12 12h.01 M12 16h.01' })
    ),
    toast && React.createElement(Toast, { msg: toast })
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

// ── Service Worker + Push ─────────────────────────────────────────────────

async function registerPush(accessToken) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
  try {
    const reg = await navigator.serviceWorker.register('/sw.js');
    const permission = await Notification.requestPermission();
    if (permission !== 'granted') return;

    const keyRes = await fetch(`${BACKEND}/push/vapid-public-key`);
    const { key } = await keyRes.json();
    const vapidKey = Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));

    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKey });

    await fetch(`${BACKEND}/push/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
      body: JSON.stringify(sub.toJSON())
    });
  } catch (e) {
    console.error('Push registration failed:', e);
  }
}

window.registerPush = registerPush;

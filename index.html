function VideosScreen({ currentUser, deepLinkVideoId, onDeepLinkHandled, onNavigateToEvent, showToast }) {
  const [videos, setVideos]         = useState([]);
  const [loading, setLoading]       = useState(true);
  const [userFilter, setUserFilter] = useState(null);
  const [highlightVideoId, setHighlightVideoId] = useState(null);
  // Capture deepLinkVideoId at mount and whenever it changes so load() can use it
  const pendingVideoId = React.useRef(deepLinkVideoId || null);

  useEffect(() => { load(); }, []);

  // If deepLinkVideoId changes after mount (e.g. notification tap while already on Videos tab)
  // and loading is already done, scroll immediately. Otherwise update the ref for load() to handle.
  useEffect(() => {
    if (!deepLinkVideoId) return;
    pendingVideoId.current = deepLinkVideoId;
    if (!loading) scrollToVideo(deepLinkVideoId);
  }, [deepLinkVideoId]);

  const scrollToVideo = (id) => {
    setHighlightVideoId(id);
    onDeepLinkHandled && onDeepLinkHandled();
    // Small delay to let React render the cards before measuring DOM positions
    setTimeout(() => {
      const el = document.getElementById(`video-card-${id}`);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      setTimeout(() => setHighlightVideoId(null), 2000);
    }, 100);
  };

  const load = async () => {
    const { data, error } = await sb.from('chug_videos').select('*').order('created_at', { ascending: false });
    if (error) console.error('[VIDEOS]', error);
    if (data) setVideos(data);
    setLoading(false);
    // After data is in state and cards will render, scroll to any pending deep link
    if (pendingVideoId.current) {
      const id = pendingVideoId.current;
      pendingVideoId.current = null;
      scrollToVideo(id);
    }
  };

  const filtered = userFilter ? videos.filter(v => v.actual_drinker === userFilter) : videos;

  if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));

  return React.createElement(React.Fragment, null,
    React.createElement('div', { className: 'video-filter-row' },
      React.createElement('button', {
        className: `filter-chip ${!userFilter ? 'active' : ''}`,
        onClick: () => setUserFilter(null)
      }, 'Everyone'),
      ALL_USERS.map(u => React.createElement('button', {
        key: u,
        className: `filter-chip ${userFilter === u ? 'active' : ''}`,
        style: userFilter === u ? { borderColor: USER_COLORS[u], color: USER_COLORS[u], background: USER_COLORS[u] + '18' } : {},
        onClick: () => setUserFilter(userFilter === u ? null : u)
      }, cap(u)))
    ),
    React.createElement('div', { className: 'videos-screen' },
      filtered.length === 0
        ? React.createElement('div', { className: 'empty' },
            React.createElement('div', { className: 'empty-icon' }, '🎥'),
            React.createElement('p', null, userFilter ? `No chugs from ${cap(userFilter)} yet.` : 'No chug videos yet. Be the first!')
          )
        : filtered.map(v => React.createElement(VideoCard, {
            key: v.id,
            v,
            currentUser,
            onNavigateToEvent,
            highlight: highlightVideoId === v.id,
            showToast,
          }))
    )
  );
}

function HRCard({ event, currentUser, onAssigned, showToast, videosEnabled, onNavigateVideos, highlight, enterDelay = 0 }) {
  const [likes, setLikes]           = useState([]);
  const [comments, setComments]     = useState([]);
  const [showComments, setShowComments] = useState(true);
  const [commentText, setCommentText]   = useState('');
  const [replyingTo, setReplyingTo]     = useState(null);
  const [replyText, setReplyText]       = useState('');
  const [showAssign, setShowAssign]   = useState(false);
  const [showUpload, setShowUpload]   = useState(false);
  const [assignment, setAssignment]   = useState(null);
  const [drinkLog, setDrinkLog]       = useState(null);
  const [chugVideo, setChugVideo]     = useState(null);

  const playerColor  = PLAYER_COLORS[event.player_key] || '#888';
  const drinkerColor = USER_COLORS[event.drinker] || '#888';
  const userLiked    = likes.some(l => l.username === currentUser);

  // Compute derived status client-side
  const status       = computeStatus(drinkLog);
  const countdown    = useCountdown(drinkLog, event.drink_type);
  const canApprove   = canUserApprove(event, drinkLog, currentUser);
  const canAssign    = event.drink_type === 'you_drink'
                        && event.drinker.toLowerCase() === currentUser.toLowerCase()
                        && !assignment;

  // Who is the actual drinker for this event?
  // Always normalise to lowercase so DB casing differences don't silently break the check.
  const actualDrinker = (
    event.drink_type === 'you_drink' && drinkLog?.given_to
      ? drinkLog.given_to : event.drinker
  ).toLowerCase();
  // Show upload button if: no video yet, it's my drink, drink not completed/vacated,
  // and for you_drink the drink must already be assigned (given_to is set).
  const canUploadVideo = !chugVideo
    && currentUser.toLowerCase() === actualDrinker
    && !['completed', 'done', 'completed_late', 'vacated'].includes(status)
    && (event.drink_type === 'i_drink' || (event.drink_type === 'you_drink' && drinkLog?.given_to));
  // Show view video link if video exists
  const hasVideo = !!chugVideo;

  // Card outline class
  const baseClass = (status === 'late' || status === 'vacated')
    ? 'hr-card late'
    : status === 'completed_late'
      ? 'hr-card completed-late'
      : (status === 'awaiting_approval' || status === 'pending')
        ? 'hr-card awaiting-approval'
        : 'hr-card';
  const cardClass = highlight ? baseClass + ' highlight' : baseClass;

  useEffect(() => {
    loadData();
    const chan = sb.channel(`hr-${event.id}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'likes' }, loadData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, loadData)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_assignments' }, () => {
        // When an assignment lands, drink_log.given_to may not be replicated yet.
        // Load immediately, then retry with backoff so the assignee's UI updates.
        loadData(0);
        setTimeout(() => loadData(0), 1000);
        setTimeout(() => loadData(0), 3000);
      })
      .on('postgres_changes', { event: '*', schema: 'public', table: 'drink_log' }, loadData)
      .subscribe();
    return () => sb.removeChannel(chan);
  }, [event.id]);

  const loadData = async (retryCount = 0) => {
    const [l, c, a, dl, cv] = await Promise.all([
      sb.from('likes').select('*').eq('target_type', 'hr_event').eq('target_id', event.id),
      sb.from('comments').select('*').eq('hr_event_id', event.id).order('created_at'),
      sb.from('drink_assignments').select('*').eq('hr_event_id', event.id).maybeSingle(),
      sb.from('drink_log').select('*').eq('hr_event_id', event.id).maybeSingle(),
      sb.from('chug_videos').select('*').eq('hr_event_id', event.id).maybeSingle(),
    ]);
    if (l.data) setLikes(l.data);
    if (c.data) setComments(c.data);
    if (a.data !== undefined) setAssignment(a.data);
    if (dl.data !== undefined) setDrinkLog(dl.data);
    if (cv.data !== undefined) setChugVideo(cv.data);

    // Guard against Supabase replication lag: if the drink_log was just updated
    // (assignment came in via realtime) but given_to is still null, retry with backoff.
    if (
      retryCount < 4 &&
      event.drink_type === 'you_drink' &&
      dl.data && !dl.data.given_to &&
      a.data  // assignment row exists, so given_to should be set
    ) {
      const delay = [1500, 2500, 4000, 6000][retryCount] || 6000;
      setTimeout(() => loadData(retryCount + 1), delay);
    }
  };

  const toggleLike = async () => {
    const { data: { session } } = await sb.auth.getSession();
    await fetch(`${BACKEND}/likes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
      body: JSON.stringify({ target_type: 'hr_event', target_id: event.id })
    });
    loadData();
  };

  const commentSubmitting = useRef(false);
  const addComment = async (parentId = null) => {
    const text = parentId ? replyText.trim() : commentText.trim();
    if (!text || commentSubmitting.current) return;
    commentSubmitting.current = true;
    if (parentId) setReplyText(''); else setCommentText('');
    try {
      const { data: { session } } = await sb.auth.getSession();
      await fetch(`${BACKEND}/comments`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ hr_event_id: event.id, body: text, parent_comment_id: parentId || null })
      });
      setReplyingTo(null);
      loadData();
    } finally {
      commentSubmitting.current = false;
    }
  };

  const deleteComment = async (commentId) => {
    const { data: { session } } = await sb.auth.getSession();
    await fetch(`${BACKEND}/comments/${commentId}`, {
      method: 'DELETE',
      headers: { 'Authorization': `Bearer ${session.access_token}` },
    });
    loadData();
  };

  const [editingCommentId, setEditingCommentId] = useState(null);
  const [editText, setEditText] = useState('');

  const startEdit = (c) => { setEditingCommentId(c.id); setEditText(c.body); };
  const cancelEdit = () => { setEditingCommentId(null); setEditText(''); };

  const saveEdit = async (commentId) => {
    if (!editText.trim()) return;
    const { data: { session } } = await sb.auth.getSession();
    await fetch(`${BACKEND}/comments/${commentId}/edit`, {

function DateRangePicker({ onApply, onClose, activeDates }) {
  const now = new Date();
  const [viewYear, setViewYear]   = useState(now.getFullYear());
  const [viewMonth, setViewMonth] = useState(now.getMonth());
  const [startDate, setStartDate] = useState(null);
  const [endDate, setEndDate]     = useState(null);
  const [hoverDate, setHoverDate] = useState(null);

  const WEEKDAYS = ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'];
  const MONTHS   = ['January','February','March','April','May','June',
                    'July','August','September','October','November','December'];

  const firstDay   = new Date(viewYear, viewMonth, 1).getDay();
  const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
  const todayStr   = now.toISOString().slice(0, 10);

  const toStr = (d) => d ? d.toISOString().slice(0, 10) : null;

  const prevMonth = () => {
    if (viewMonth === 0) { setViewMonth(11); setViewYear(y => y - 1); }
    else setViewMonth(m => m - 1);
  };

  const nextMonth = () => {
    if (viewMonth === 11) { setViewMonth(0); setViewYear(y => y + 1); }
    else setViewMonth(m => m + 1);
  };

  const handleDayClick = (day) => {
    const clicked = new Date(viewYear, viewMonth, day);
    if (!startDate || (startDate && endDate)) {
      // Starting a new selection
      setStartDate(clicked);
      setEndDate(null);
    } else {
      // Picking end date — must be same day or after start
      if (clicked < startDate) {
        // Ignore clicks before start date — start over from clicked date
        setStartDate(clicked);
        setEndDate(null);
      } else {
        setEndDate(clicked);
      }
    }
  };

  const formatDisplay = (d) => d ? d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : null;

  const rangeLabel = () => {
    if (!startDate) return 'Select a start date';
    if (!endDate)   return React.createElement('span', null, formatDisplay(startDate), ' → select end date');
    return React.createElement('span', null, formatDisplay(startDate), ' → ', formatDisplay(endDate));
  };

  const days = [];
  // Empty cells before first day
  for (let i = 0; i < firstDay; i++) days.push(null);
  for (let d = 1; d <= daysInMonth; d++) days.push(d);

  const getDayClass = (day) => {
    if (!day) return 'cal-day cal-day-empty';
    const dateStr  = `${viewYear}-${String(viewMonth+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const dateObj  = new Date(viewYear, viewMonth, day);
    const startStr = toStr(startDate);
    const endStr   = toStr(endDate);
    const hoverStr = toStr(hoverDate);
    const effectiveEnd = endStr || hoverStr;

    let cls = 'cal-day';
    if (dateStr === todayStr) cls += ' cal-day-today';
    if (activeDates && activeDates.has(dateStr)) cls += ' cal-day-has-data';
    // Grey out dates before startDate when picking end date
    if (startDate && !endDate && dateObj < startDate && dateStr !== toStr(startDate))
      cls += ' cal-day-disabled';
    if (startStr && dateStr === startStr) cls += ' cal-day-start';
    if (endStr   && dateStr === endStr)   cls += ' cal-day-end';
    if (startStr && effectiveEnd && dateStr > startStr && dateStr < effectiveEnd)
      cls += ' cal-day-in-range';
    return cls;
  };

  const swipeRef = useSwipeDismiss(onClose);
  return React.createElement('div', { className: 'cal-overlay', onClick: e => e.target === e.currentTarget && onClose() },
    React.createElement('div', { className: 'cal-sheet', ref: swipeRef },
      React.createElement('div', { className: 'cal-handle' }),
      // Date range label at top
      React.createElement('div', { className: 'cal-range-label' }, rangeLabel()),
      // Month navigation
      React.createElement('div', { className: 'cal-header' },
        React.createElement('button', { className: 'cal-nav-btn', onClick: prevMonth }, '‹'),
        React.createElement('div', { className: 'cal-month-label' }, `${MONTHS[viewMonth]} ${viewYear}`),
        React.createElement('button', { className: 'cal-nav-btn', onClick: nextMonth }, '›')
      ),
      React.createElement('div', { className: 'cal-weekdays' },
        WEEKDAYS.map(w => React.createElement('div', { key: w, className: 'cal-weekday' }, w))
      ),
      React.createElement('div', { className: 'cal-days' },
        days.map((day, i) => React.createElement('div', {
          key: i,
          className: getDayClass(day),
          onClick: day ? () => handleDayClick(day) : undefined,
          onMouseEnter: day && startDate && !endDate
            ? () => setHoverDate(new Date(viewYear, viewMonth, day))
            : undefined,
          onMouseLeave: () => setHoverDate(null),
        }, day || ''))
      ),
      // Action buttons directly below calendar
      React.createElement('div', { className: 'cal-actions' },
        React.createElement('button', {
          className: 'cal-btn-clear',
          onClick: () => { setStartDate(null); setEndDate(null); onApply(null, null); onClose(); }
        }, 'Clear'),
        React.createElement('button', {
          className: 'cal-btn-apply',
          disabled: !startDate,
          onClick: () => { onApply(toStr(startDate), toStr(endDate || startDate)); onClose(); }
        }, 'Apply')
      )
    )
  );
}

function WeeklyRecapBanner({ onNavigateRecap }) {
  const recap = useWeeklyRecap();
  const [dismissed, setDismissed] = useState(false);

  if (!recap || recap.loading || !recap.any) return null;

  const storageKey = `recap_banner_dismissed_${recap.weekLabel}`;
  let alreadyDismissed = dismissed;
  try { alreadyDismissed = alreadyDismissed || localStorage.getItem(storageKey) === '1'; } catch {}
  if (alreadyDismissed) return null;

  const topDrinker = recap.topDrunk[0];
  if (!topDrinker || topDrinker.count === 0) return null;

  const dismiss = (e) => {
    e.stopPropagation();
    setDismissed(true);
    try { localStorage.setItem(storageKey, '1'); } catch {}
  };

  return React.createElement('div', { className: 'recap-banner', onClick: onNavigateRecap },
    React.createElement('span', { className: 'recap-banner-icon' }, '\ud83c\udfc6'),
    React.createElement('div', { className: 'recap-banner-text' },
      React.createElement('div', { className: 'recap-banner-title' },
        React.createElement('strong', { style: { color: USER_COLORS[topDrinker.username] } }, cap(topDrinker.username)),
        ` leads the week with ${topDrinker.count} ${topDrinker.count === 1 ? 'beer' : 'beers'}!`
      ),
      React.createElement('div', { className: 'recap-banner-sub' }, `${recap.weekLabel} \u00b7 tap for full recap`)
    ),
    React.createElement('button', { className: 'recap-banner-close', onClick: dismiss }, '\u2715')
  );
}

      sb.from('drink_log').select('*'),

    if (dlRes.data) {
      const map = {};
      dlRes.data.forEach(dl => { map[dl.hr_event_id] = dl; });
      setDrinkLogs(map);
    }
    setLoading(false);
  };

  useEffect(() => {
    if (!deepLinkEventId) return;
    setHighlightId(deepLinkEventId);
    // Clear the deep link immediately so re-renders / refreshes don't re-scroll
    onDeepLinkHandled && onDeepLinkHandled();
    setTimeout(() => {
      const el = document.getElementById(`hr-card-${deepLinkEventId}`);
      if (el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });

  // Applies a drink_log realtime change directly to local state instead of
  // re-querying everything, so the My Drinks counts/lists and card statuses
  // stay live the moment someone assigns/approves a drink — not just after
  // the next full loadEvents() (new HR, pull-to-refresh, or mount).
  const handleDrinkLogChange = (payload) => {
    setDrinkLogs(prev => {
      const next = { ...prev };
      if (payload.eventType === 'DELETE') {
        const hrId = payload.old?.hr_event_id;

  };

        e.drinker.toLowerCase().includes(q) ||
        givenTo.includes(q);
      if (!matches) return false;

    // Date range filter
    if (filters.dateStart) {
      const d = e.created_at?.slice(0, 10);
      if (!d) return false;
      if (d < filters.dateStart) return false;
      if (filters.dateEnd && d > filters.dateEnd) return false;

    // Status filter

        : status === 'vacated' ? 'late'
        : status;
      const matchesFilter = filters[filterKey]
        || (status === 'late' && filters['awaiting_approval']);
      if (!matchesFilter) return false;

    if (anyTypeFilter && !filters[e.drink_type]) return false;
    return true;

  // pending/awaiting to be drunk), and drinks the current user still needs to
  // assign (you_drink they own, not yet assigned, excluding ones that already
  // expired unassigned — those are "vacated", not actionable).
  // Among the owed drinks, also track how many are already late and how overdue the
  // worst one is, so the summary can distinguish "just triggered" from "overdue for days".
  let myOwedCount     = 0;
  let myLateOwedCount = 0;
  let myMaxOverdueMs  = 0;
  const myOwedItems     = [];
  const myToAssignItems = [];

  events.forEach(e => {

    const status = computeStatus(dl);
    const isMine = e.drink_type === 'i_drink'
      ? e.drinker.toLowerCase() === currentUser.toLowerCase()
      : !!(dl?.given_to && dl.given_to.toLowerCase() === currentUser.toLowerCase());
    if (!isMine) return;

    const relevantStatuses = e.drink_type === 'i_drink'
      ? ['pending', 'awaiting_approval', 'late']
      : ['awaiting_approval', 'late'];

      if (clockStart) {
        const overdueMs = Date.now() - (clockStart + 24 * 3600 * 1000);
        if (overdueMs > myMaxOverdueMs) myMaxOverdueMs = overdueMs;
      }

  });

  myOwedItems.sort((a, b) => {
    if ((a.status === 'late') !== (b.status === 'late')) return a.status === 'late' ? -1 : 1;
    return new Date(a.event.created_at) - new Date(b.event.created_at);
  });

  events.forEach(e => {

    if (e.drinker.toLowerCase() !== currentUser.toLowerCase()) return;
    const dl = drinkLogs[e.id];
    if (dl?.given_to) return;
    const status = computeStatus(dl);
    if (status === 'pending') myToAssignItems.push({ event: e, drinkLog: dl, status });

    React.createElement('div', { className: 'my-drinks-bar' },

          React.createElement('span', { className: 'my-drinks-label' }, myToAssignCount === 1 ? 'Drink To Assign' : 'Drinks To Assign')

function LogScreen({ currentUser, videosEnabled, onNavigateVideos }) {
  const [logs, setLogs]       = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch]   = useState('');
  const [filters, setFilters] = useState({});

  useEffect(() => {
    const load = async () => {
      const [logRes, vidRes] = await Promise.all([
        sb.from('drink_log').select('*, hr_events(created_at)').order('hr_triggered_at', { ascending: false }),
        sb.from('chug_videos').select('hr_event_id, actual_drinker'),
      ]);
      if (logRes.error) console.error('[LOG] fetch error:', logRes.error);
      if (logRes.data) {
        // Annotate each log row with video info
        const videoSet = new Set((vidRes.data || []).map(v => v.hr_event_id));
        const videoOwner = {};
        (vidRes.data || []).forEach(v => { videoOwner[v.hr_event_id] = v.actual_drinker; });
        const annotated = logRes.data.map(l => {
          const actualDrinker = (l.drink_type === 'you_drink' && l.given_to) ? l.given_to : l.username;
          return {
            ...l,
            _hasVideo:  videoSet.has(l.hr_event_id),
            _isMyDrink: actualDrinker.toLowerCase() === currentUser.toLowerCase() && !videoSet.has(l.hr_event_id)
                          && !['completed', 'done', 'completed_late'].includes(computeStatus(l))
                          && (l.drink_type === 'i_drink' || (l.drink_type === 'you_drink' && l.given_to)),
          };
        });
        setLogs(annotated);
      }
      setLoading(false);
    };
    load();
  }, []);

  // Unique dates for dropdown
  const allEventDates = new Set(logs.map(l => {
    const raw = l.hr_events?.created_at || (l.event_date ? l.event_date : null);
    return raw ? raw.slice(0, 10) : null;
  }).filter(Boolean));

  const anyStatusFilter = ['pending','awaiting_approval','completed','completed_late','late'].some(k => filters[k]);
  const anyTypeFilter   = ['i_drink','you_drink'].some(k => filters[k]);

  const filtered = logs.filter(l => {
    const status      = computeStatus(l);
    const actualDrinker = (l.drink_type === 'you_drink' && l.given_to) ? l.given_to : l.username;
    const raw         = l.hr_events?.created_at || (l.event_date ? l.event_date + 'T12:00:00' : null);
    const displayDate = raw ? new Date(raw).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '';

    if (search) {
      const q = search.toLowerCase();
      const matchesPlayer = l.mlb_player?.toLowerCase().includes(q);
      const matchesDrinker = l.username?.toLowerCase().includes(q) || actualDrinker?.toLowerCase().includes(q);
      if (!matchesPlayer && !matchesDrinker) return false;
    }
    if (filters.dateStart) {
      const rawStr = l.hr_events?.created_at?.slice(0, 10) || l.event_date || '';
      if (!rawStr || rawStr < filters.dateStart) return false;
      if (filters.dateEnd && rawStr > filters.dateEnd) return false;
    }
    // Same logic: i_drink pending maps to awaiting_approval for filtering.
    // Late drinks still need to be drank, so they match both "Late" AND "To Be Drank".
    const filterKey = (status === 'pending' && l.drink_type === 'i_drink')
      ? 'awaiting_approval'
      : status === 'vacated' ? 'late'
      : status;
    const matchesFilter = filters[filterKey]
      || (status === 'late' && filters['awaiting_approval']);
    if (anyStatusFilter && !matchesFilter) return false;
    if (anyTypeFilter && !filters[l.drink_type]) return false;
    return true;
  });

  const renderRow = (l) => {
    const status      = computeStatus(l);
    const raw         = l.hr_events?.created_at || (l.event_date ? l.event_date + 'T12:00:00' : null);
    const displayDate = raw ? new Date(raw).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—';

    return React.createElement('div', {
      key: l.id,
      className: `log-row tappable status-${status === 'awaiting_approval' || (status === 'pending' && l.drink_type === 'i_drink') ? 'awaiting' : status}`,
      onClick: (e) => {
        if (e.target.closest('.log-video-link')) return;
        if (l.hr_event_id) {
          window.__navigateToEvent && window.__navigateToEvent(l.hr_event_id);
        }
      }
    },
      React.createElement('div', { style: { color: 'var(--muted)', fontSize: '0.75rem' } }, displayDate),
      React.createElement('div', { style: { fontWeight: 500 } },
        l.drink_type === 'you_drink' && l.given_to
          ? React.createElement('span', null,
              React.createElement('span', { style: { color: USER_COLORS[l.username] || '#888', fontSize: '0.75rem' } }, cap(l.username)),
              React.createElement('span', { style: { color: 'var(--muted)' } }, ' → '),
              React.createElement('span', { style: { color: USER_COLORS[l.given_to] || '#888' } }, cap(l.given_to))
            )
          : React.createElement('span', { style: { color: USER_COLORS[l.username] || '#888' } }, cap(l.username))
      ),
      React.createElement('div', { style: { fontSize: '0.78rem', color: 'var(--muted)' } }, l.mlb_player),
      React.createElement('div', { style: { display: 'flex', flexDirection: 'column', gap: '4px' } },
        React.createElement('div', { style: { display: 'flex', alignItems: 'center', gap: '4px' } },
          React.createElement('span', { className: `log-status-dot ${status === 'awaiting_approval' || (status === 'pending' && l.drink_type === 'i_drink') ? 'awaiting' : status}` }),
          React.createElement('span', { style: {
            fontSize: '0.7rem',
            color: status === 'vacated' ? '#e84a4a'
                 : status === 'late' ? '#e84a4a'
                 : status === 'completed' ? '#7cb85c'
                 : status === 'completed_late' ? '#e88c4a'
                 : (status === 'awaiting_approval' || (status === 'pending' && l.drink_type === 'i_drink')) ? '#999'
                 : '#888'
          } },
            status === 'vacated' ? 'Vacated'
            : status === 'late' ? 'Late'
            : status === 'completed' ? 'Done'
            : status === 'completed_late' ? 'Done (Late)'
            : (status === 'awaiting_approval' || (status === 'pending' && l.drink_type === 'i_drink')) ? 'To Be Drank'
            : 'To Be Assigned'
          )
        ),
        videosEnabled && l._hasVideo && React.createElement('button', { className: 'log-video-link', onClick: onNavigateVideos },
          '🎥 View'
        ),
        videosEnabled && !l._hasVideo && l._isMyDrink && React.createElement('button', { className: 'log-video-link', onClick: onNavigateVideos },
          '🎥 Record'
        )
      )
    );
  };

  if (loading) return React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }));

  return React.createElement(React.Fragment, null,
    React.createElement(SearchFilterBar, { search, onSearch: setSearch, filters, onFilter: setFilters, dateOptions: [], allEventDates }),
    React.createElement('div', { className: 'log-screen' },
      React.createElement('div', { className: 'log-table' },
        React.createElement('div', { className: 'log-header' },
          React.createElement('div', null, 'Date'),
          React.createElement('div', null, 'Drinker'),
          React.createElement('div', null, 'Player'),
          React.createElement('div', null, 'Status')
        ),
        logs.length === 0
          ? React.createElement('div', { style: { padding: '2rem', textAlign: 'center', color: 'var(--muted)' } }, 'No drinks logged yet')
          : filtered.length === 0
            ? React.createElement('div', { className: 'no-results' }, 'No entries match your search.')
            : filtered.map(renderRow)
      )
    )
  );
}

function NotificationCenter({ currentUser }) {
  const [open, setOpen]         = useState(false);
  const [notifs, setNotifs]     = useState([]);
  const [loading, setLoading]   = useState(false);
  const [showFilters, setShowFilters] = useState(false);
  const dropdownRef             = useRef(null);
  const panelRef                = useRef(null);

  const NOTIF_FILTER_KEY = `notif_prefs_${currentUser}`;
  const DEFAULT_PREFS = { hr: true, assignment: true, approval: true, late: true, comment: true, like: true, video: true };

  const loadPrefs = () => {
    try { return { ...DEFAULT_PREFS, ...JSON.parse(localStorage.getItem(NOTIF_FILTER_KEY) || '{}') }; }
    catch { return DEFAULT_PREFS; }
  };
  const [prefs, setPrefs] = useState(loadPrefs);

  const savePrefs = (next) => {
    setPrefs(next);
    try { localStorage.setItem(NOTIF_FILTER_KEY, JSON.stringify(next)); } catch {}
  };

  const togglePref = (key) => savePrefs({ ...prefs, [key]: !prefs[key] });

  const NOTIF_ICONS = {
    hr: '⚾', assignment: '🍺', approval: '✅',
    late: '🔴', comment: '💬', like: '👍', video: '🎥',
  };

  const NOTIF_LABELS = {
    hr: 'HRs', assignment: 'Assignments', approval: 'Approvals',
    late: 'Late Alerts', comment: 'Comments', like: 'Likes', video: 'Videos',
  };

  const load = async () => {
    setLoading(true);
    try {
      const { data: { session } } = await sb.auth.getSession();
      const res = await fetch(`${BACKEND}/notifications`, {
        headers: { 'Authorization': `Bearer ${session.access_token}` }
      });
      if (res.ok) {
        const all = await res.json();
        const filtered = all.filter(n => {
          // Suppress notifications where the current user was the sole actor.
          // HR alerts (actor: null) are always shown to everyone.
          const actor = n.data?.actor;
          if (!actor) return true;  // no actor means system-generated (HR alert etc.) — always show
          return actor.toLowerCase() !== currentUser.toLowerCase();
        });
        setNotifs(filtered);
      }
    } catch (e) { console.error('[NOTIF]', e); }
    setLoading(false);
  };

  const visibleNotifs = notifs.filter(n => prefs[n.type] !== false);
  const unreadCount   = visibleNotifs.filter(n => !n.read).length;

  const markAllRead = async () => {
    const unreadIds = visibleNotifs.filter(n => !n.read).map(n => n.id);
    if (!unreadIds.length) return;
    setNotifs(prev => prev.map(n => unreadIds.includes(n.id) ? { ...n, read: true } : n));
    try {
      const { data: { session } } = await sb.auth.getSession();
      await fetch(`${BACKEND}/notifications/read`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify({ notification_ids: unreadIds })
      });
    } catch (e) { console.error('[NOTIF] mark read failed', e); }
  };

  const handleOpen = () => {
    if (!open) { setOpen(true); load(); }
    else setOpen(false);
  };

  // Close only when tapping outside BOTH the bell and the panel
  useEffect(() => {
    if (!open) return;
    const handler = (e) => {
      const inBell  = dropdownRef.current && dropdownRef.current.contains(e.target);
      const inPanel = panelRef.current    && panelRef.current.contains(e.target);
      if (!inBell && !inPanel) setOpen(false);
    };
    // touchend + delay so scroll gestures inside panel don't trigger close
    const onTouchEnd = (e) => { setTimeout(() => handler(e), 50); };
    document.addEventListener('mousedown', handler);
    document.addEventListener('touchend', onTouchEnd);
    return () => {
      document.removeEventListener('mousedown', handler);
      document.removeEventListener('touchend', onTouchEnd);
    };
  }, [open]);

  // Mark all read when dropdown opens and has unread
  useEffect(() => {
    if (open && unreadCount > 0) {
      // Small delay so user sees the unread state briefly
      const t = setTimeout(markAllRead, 1200);
      return () => clearTimeout(t);
    }
  }, [open]);

  // Realtime: re-fetch when new notifications arrive
  useEffect(() => {
    const chan = sb.channel('notif-watch')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications' }, () => {
        load();
      })
      .subscribe();
    load();
    return () => sb.removeChannel(chan);
  }, []);

  const handleNotifClick = (n) => {
    const d = n.data || {};
    setOpen(false);
    setTimeout(() => {
      if (d.video_id) {
        window.__navigateToVideo && window.__navigateToVideo(d.video_id);
      } else if (d.hr_event_id) {
        window.__navigateToEvent && window.__navigateToEvent(d.hr_event_id);
      }
    }, 50);
  };

  // Compute portal position — right-align to bell, clamp to screen
  const getPanelStyle = () => {
    const el = dropdownRef.current;
    if (!el) return { top: '60px', right: '8px' };
    const rect    = el.getBoundingClientRect();
    const panelW  = 300;
    const rightEdge = window.innerWidth - rect.right;
    const wouldOverflow = (rect.right - panelW) < 8;
    return {
      top: rect.bottom + 8 + 'px',
      ...(wouldOverflow ? { left: '8px', right: 'auto' } : { right: Math.max(8, rightEdge) + 'px' }),
    };
  };

  return React.createElement(React.Fragment, null,
    React.createElement('div', { className: 'notif-bell-wrap', ref: dropdownRef },
      React.createElement('button', { className: 'notif-bell-btn', onClick: handleOpen },
        React.createElement('svg', { viewBox: '0 0 24 24', fill: open ? 'currentColor' : 'none', stroke: 'currentColor', strokeWidth: 1.8 },
          React.createElement('path', { d: 'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9' }),
          React.createElement('path', { d: 'M13.73 21a2 2 0 0 1-3.46 0' })
        ),
        unreadCount > 0 && React.createElement('span', { className: 'notif-count' }, unreadCount > 9 ? '9+' : unreadCount)
      )
    ),
    open && createPortal(
      React.createElement('div', {
        className: 'notif-dropdown',
        ref: panelRef,
        style: { position: 'fixed', zIndex: 9999, ...getPanelStyle() },
      },
        // Header
        React.createElement('div', { className: 'notif-dropdown-header' },
          React.createElement('div', { className: 'notif-dropdown-title' }, 'Notifications'),
          React.createElement('div', { style: { display: 'flex', gap: '6px', alignItems: 'center' } },
            React.createElement('button', {
              className: 'notif-mark-read-btn',
              style: showFilters ? { color: 'var(--accent)' } : {},
              onClick: (e) => { e.stopPropagation(); setShowFilters(s => !s); }
            }, '⚙️'),
            React.createElement('button', { className: 'notif-mark-read-btn', onClick: markAllRead }, 'Mark all read')
          )
        ),
        // Filter pills (collapsible)
        showFilters && React.createElement('div', { className: 'notif-filter-row' },
          Object.keys(NOTIF_LABELS).map(key =>
            React.createElement('button', {
              key,
              className: `notif-filter-pill ${prefs[key] !== false ? 'on' : 'off'}`,
              onClick: (e) => { e.stopPropagation(); togglePref(key); }
            }, NOTIF_ICONS[key], ' ', NOTIF_LABELS[key])
          )
        ),
        // List
        React.createElement('div', { className: 'notif-list' },
          loading
            ? React.createElement('div', { className: 'notif-empty' }, 'Loading...')
            : visibleNotifs.length === 0
              ? React.createElement('div', { className: 'notif-empty' }, 'No notifications yet')
              : visibleNotifs.map(n => React.createElement('div', {
                  key: n.id,
                  className: `notif-item ${!n.read ? 'unread' : ''}`,
                  onClick: () => handleNotifClick(n)
                },
                  !n.read && React.createElement('div', { className: 'notif-unread-dot' }),
                  React.createElement('div', { className: 'notif-icon' }, NOTIF_ICONS[n.type] || '🔔'),
                  React.createElement('div', { className: 'notif-content' },
                    React.createElement('div', { className: 'notif-title' }, n.title),
                    React.createElement('div', { className: 'notif-body' }, n.body)
                  ),
                  React.createElement('div', { className: 'notif-time' }, relativeTime(n.created_at))
                ))
        )
      ),
      document.body
    )
  );
}

function AdminDrinkLogEditor({ showToast }) {
  const [rows, setRows]           = useState([]);
  const [loading, setLoading]     = useState(true);
  const [search, setSearch]       = useState('');
  const [expandedId, setExpandedId] = useState(null);
  const [drafts, setDrafts]       = useState({});
  const [savingId, setSavingId]   = useState(null);

  const STATUS_OPTIONS = ['pending', 'awaiting_approval', 'completed', 'late', 'completed_late'];

  const load = async () => {
    setLoading(true);
    const { data, error } = await sb.from('drink_log')
      .select('*')
      .order('hr_triggered_at', { ascending: false })
      .limit(100);
    if (error) console.error('[ADMIN]', error);
    if (data) setRows(data);
    setLoading(false);
  };

  useEffect(() => { load(); }, []);

  // datetime-local inputs need "YYYY-MM-DDTHH:MM" in local time, not an ISO string.
  const toLocalInput = (iso) => {
    if (!iso) return '';
    const d = new Date(iso);
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
  };

  const startEdit = (row) => {
    const opening = expandedId !== row.id;
    setExpandedId(opening ? row.id : null);
    if (opening) {
      setDrafts(prev => ({
        ...prev,
        [row.id]: {
          status:          row.status || 'pending',
          given_to:        row.given_to || '',
          assigned_at:     toLocalInput(row.assigned_at),
          hr_triggered_at: toLocalInput(row.hr_triggered_at),
          approved_by:     row.approved_by || '',
        }
      }));
    }
  };

  const updateDraft = (id, field, value) => {
    setDrafts(prev => ({ ...prev, [id]: { ...prev[id], [field]: value } }));
  };

  const save = async (row) => {
    const draft = drafts[row.id];
    if (!draft) return;
    setSavingId(row.id);
    try {
      const { data: { session } } = await sb.auth.getSession();
      const payload = {
        status:          draft.status,
        given_to:        draft.given_to || null,
        assigned_at:     draft.assigned_at ? new Date(draft.assigned_at).toISOString() : null,
        hr_triggered_at: draft.hr_triggered_at ? new Date(draft.hr_triggered_at).toISOString() : null,
        approved_by:     draft.approved_by || null,
      };
      const res = await fetch(`${BACKEND}/admin/drink-log/${row.id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if (res.ok) {
        setRows(prev => prev.map(r => r.id === row.id ? result.drink_log : r));
        setExpandedId(null);
        showToast && showToast('Drink log entry updated');
      } else {
        showToast && showToast(result.error || 'Failed to save');
      }
    } catch (e) {
      showToast && showToast('Network error');
    }
    setSavingId(null);
  };

  const filtered = rows.filter(r => {
    if (!search) return true;
    const q = search.toLowerCase();
    return (r.mlb_player || '').toLowerCase().includes(q)
      || (r.username || '').toLowerCase().includes(q)
      || (r.given_to || '').toLowerCase().includes(q);
  });

  return React.createElement('div', null,
    React.createElement('div', { className: 'settings-section-title' }, 'Drink Log Correction'),
    React.createElement('div', { style: { fontSize: '0.75rem', color: 'var(--muted)', marginBottom: '0.5rem', padding: '0 0.25rem' } },
      "Manually fix a drink's status, timestamps, or assignee — for drinks that happened correctly but got logged or approved late."
    ),
    React.createElement('input', {
      className: 'search-input admin-search-input',
      placeholder: 'Search by player or user...',
      value: search,
      onChange: e => setSearch(e.target.value)
    }),
    loading
      ? React.createElement('div', { className: 'loading' }, React.createElement('div', { className: 'spinner' }))
      : React.createElement('div', { className: 'admin-log-list' },
          filtered.length === 0
            ? React.createElement('div', { style: { padding: '1.5rem', textAlign: 'center', color: 'var(--muted)', fontSize: '0.85rem' } }, 'No matching entries')
            : filtered.map(row => {
                const draft = drafts[row.id];
                const isExpanded = expandedId === row.id;
                return React.createElement('div', { key: row.id, className: 'admin-log-row' },
                  React.createElement('div', { className: 'admin-log-row-summary', onClick: () => startEdit(row) },
                    React.createElement('div', { className: 'admin-log-date' },
                      row.event_date ? new Date(row.event_date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '—'
                    ),
                    React.createElement('div', { className: 'admin-log-names' },
                      React.createElement('span', { style: { color: USER_COLORS[row.username] || '#888' } }, cap(row.username)),
                      row.given_to && React.createElement('span', null, ' → ', React.createElement('span', { style: { color: USER_COLORS[row.given_to] || '#888' } }, cap(row.given_to))),
                      React.createElement('div', { style: { fontSize: '0.72rem', color: 'var(--muted)' } }, row.mlb_player)
                    ),
                    React.createElement(DrinkStatusBadge, { status: computeStatus(row), drinkType: row.drink_type }),
                    React.createElement('span', { className: 'admin-log-chevron' }, isExpanded ? '▲' : '▼')
                  ),
                  isExpanded && draft && React.createElement('div', { className: 'admin-log-edit' },
                    React.createElement('div', { className: 'admin-field' },
                      React.createElement('label', null, 'Status'),
                      React.createElement('select', {
                        value: draft.status,
                        onChange: e => updateDraft(row.id, 'status', e.target.value)
                      }, STATUS_OPTIONS.map(s => React.createElement('option', { key: s, value: s }, s)))

function SettingsScreen({ currentUser, onSignOut, showToast }) {

    hr: '⚾', assignment: '🍺', approval: '✅', late: '🔴', comment: '💬', like: '👍', video: '🎥',

  const [pushPrefs, setPushPrefs] = useState(null);
  const [saving, setSaving]       = useState(false);
  const [saved, setSaved]         = useState(false);

  useEffect(() => {
    const load = async () => {
      try {
        const { data: { session } } = await sb.auth.getSession();
        const res = await fetch(`${BACKEND}/notifications/preferences`, {
          headers: { 'Authorization': `Bearer ${session.access_token}` }
        });
        if (res.ok) setPushPrefs(await res.json());
        else setPushPrefs(Object.fromEntries(ALL_TYPES.map(t => [t, true])));
      } catch {
        setPushPrefs(Object.fromEntries(ALL_TYPES.map(t => [t, true])));

    load();
  }, []);

  const togglePush = (type) => {
    setPushPrefs(prev => ({ ...prev, [type]: !prev[type] }));
    setSaved(false);

  const savePushPrefs = async () => {
    setSaving(true);

        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.access_token}` },

      setSaved(true);

function App() {

  const [showSettings, setShowSettings] = useState(false);
  const prevTab = useRef('feed');
  const [toast, showToast]            = useToast();
  const [authChecked, setAuthChecked] = useState(false);
  const [videosEnabled, setVideosEnabled] = useState(false);
  const [deepLink, setDeepLink]           = useState(() => getDeepLink());
  const [hasUnread, setHasUnread]         = useState(false);
  const [leaderboardTab, setLeaderboardTab] = useState('drinks');
  const latestEventId                     = useRef(null);

  const navigateToRecap = () => {
    setLeaderboardTab('recap');
    navigateTab('board');
  };

  useEffect(() => {
    window.__navigateToEvent = (eventId) => {
      setDeepLink({ eventId });
      setTab('feed');
      setTabAnimating(true);
      setTimeout(() => setTabAnimating(false), 260);
    };
    window.__navigateToVideo = (videoId) => {
      setDeepLink({ videoId });
      setTab('videos');
      setTabAnimating(true);
      setTimeout(() => setTabAnimating(false), 260);
    };

    // Handle deep-link messages from the service worker. When a notification
    // is tapped while the app is already open, sw.js posts the target here
    // instead of forcing a full page reload (which would re-fetch index.html
    // over the network every time). We just re-use the same navigate helpers
    // a fresh page load would have used.
    const handleSWMessage = (event) => {
      const msg = event.data;
      if (!msg || msg.type !== 'DEEP_LINK') return;
      const { eventId, videoId } = msg.deepLink || {};
      if (videoId) window.__navigateToVideo(videoId);
      else if (eventId) window.__navigateToEvent(eventId);
    };
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('message', handleSWMessage);
    }

    // Handle deep link on first load
    const dl = getDeepLink();
    if (dl.tab === 'videos' || dl.videoId) {
      setTab('videos');
    } else if (dl.eventId || dl.tab === 'feed') {
      setTab('feed');
    }

    // Load feature flags from app_settings
    sb.from('app_settings').select('key, value').then(({ data }) => {
      if (data) {
        const vSetting = data.find(r => r.key === 'videos_enabled');
        setVideosEnabled(vSetting?.value === 'true');
      }
    });

    sb.auth.getSession().then(({ data: { session } }) => {
      if (session?.user) {
        setUser(session.user);
        sb.from('profiles').select('username').eq('id', session.user.id).single()
          .then(({ data }) => {
            if (data) {
              setUsername(data.username);
              setTeamIcon(data.username);
            }
          });
        // Re-register push on every app load (handles PWA re-launches)
        if (session.access_token) {
          setTimeout(() => window.registerPush(session.access_token), 1000);
        }
      }
      setAuthChecked(true);
      window._dismissSplash && window._dismissSplash();
    });

    const { data: { subscription } } = sb.auth.onAuthStateChange((_event, session) => {
      if (!session) { setUser(null); setUsername(''); }
    });

    // Watch for new HR events to show unread dot on Feed tab
    const hrChan = sb.channel('app-hr-watch')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'hr_events' }, () => {
        setHasUnread(true);
      })
      .subscribe();

    return () => {
      subscription.unsubscribe();
      sb.removeChannel(hrChan);
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.removeEventListener('message', handleSWMessage);
      }
    };
  }, []);

  const navigateTab = (newTab) => {
    if (newTab === tab) return;
    prevTab.current = tab;
    setTab(newTab);
    setTabAnimating(true);
    setTimeout(() => setTabAnimating(false), 260);
    // Don't clear unread here — clear only after scrolling to top in FeedScreen
  };

  const onAuth = (u, uname) => { setUser(u); setUsername(uname); };
  const onSignOut = async () => {
    await sb.auth.signOut();

    setUsername('');

    document.documentElement.style.setProperty('--accent',         '#e8c14a');
    document.documentElement.style.setProperty('--team-primary',   '#e8c14a');
    document.documentElement.style.setProperty('--team-secondary', '#e8c14a');
  };

  const toggleVideos = async () => {
    const next = !videosEnabled;
    setVideosEnabled(next);
    // If turning off and currently on videos tab, redirect to feed
    if (!next && tab === 'videos') navigateTab('feed');
    try {
      await sb.from('app_settings')
        .update({ value: next ? 'true' : 'false' })
        .eq('key', 'videos_enabled');
    } catch (e) {
      console.error('Failed to update videos toggle:', e);
      setVideosEnabled(!next); // revert on failure
    }
  };

  if (!authChecked) return React.createElement('div', { className: 'loading', style: { minHeight: '100vh' } },
    React.createElement('div', { className: 'spinner' })
  );

  const NavIcon = ({ id, label, path }) => React.createElement('button', {

    React.createElement('div', { className: 'nav-item-wrap' },
      React.createElement('svg', { viewBox: '0 0 24 24', fill: tab === id ? 'currentColor' : 'none', stroke: 'currentColor', strokeWidth: 1.5 },
        React.createElement('path', { d: path })

  return React.createElement('div', { className: 'app' },
    React.createElement('div', { className: 'header seam-bg' },
      React.createElement('div', { className: 'header-team-strip' }),
      React.createElement('div', { className: 'header-title' },
        React.createElement('div', { className: 'header-title-main' }, 'Going Yard'),
        React.createElement('div', { className: 'header-title-sub' }, '& Drinking Hard'),

      ),
      React.createElement('div', { className: 'header-user' },
        username === 'steve' && React.createElement('button', {
          className: `video-toggle ${videosEnabled ? 'on' : 'off'}`,
          onClick: toggleVideos,

          React.createElement('span', { className: 'toggle-pip' }),
          '🎥 ' + (videosEnabled ? 'ON' : 'OFF')
        ),
        React.createElement(NotificationCenter, { currentUser: username }),
        React.createElement('span', { style: { color: USER_COLORS[username] } }, cap(username)),
        React.createElement('div', {
          onClick: () => setShowSettings(true),
          style: { cursor: 'pointer' }
        },
          React.createElement(Avatar, { name: username, size: 32 })
        )
      )
    ),
    React.createElement('div', { key: tab, className: `tab-screen${tabAnimating ? ' animating' : ''}` },
      tab === 'feed'   && React.createElement(FeedScreen, { currentUser: username, showToast, videosEnabled, onNavigateVideos: videosEnabled ? (videoId) => { if (videoId) setDeepLink({ videoId }); navigateTab('videos'); } : null, onNavigateRecap: navigateToRecap, deepLinkEventId: deepLink.eventId, onDeepLinkHandled: () => { setDeepLink({}); clearDeepLink(); }, hasUnread, onClearUnread: () => setHasUnread(false) }),
      tab === 'board'  && React.createElement(LeaderboardScreen, { initialTab: leaderboardTab }),
      tab === 'log'    && React.createElement(LogScreen, { currentUser: username, videosEnabled, onNavigateVideos: videosEnabled ? (videoId) => { if (videoId) setDeepLink({ videoId }); navigateTab('videos'); } : null }),
      tab === 'videos' && videosEnabled && React.createElement(VideosScreen, { currentUser: username, deepLinkVideoId: deepLink.videoId, onDeepLinkHandled: () => { setDeepLink({}); clearDeepLink(); }, onNavigateToEvent: (eventId) => { setDeepLink({ eventId }); navigateTab('feed'); }, showToast })
    ),
    React.createElement('nav', { className: 'nav' },
      React.createElement(NavIcon, { id: 'feed',   label: 'Feed',    path: 'M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z M9 22V12h6v10' }),
      React.createElement(NavIcon, { id: 'board',  label: 'Leaders', path: 'M18 20V10 M12 20V4 M6 20v-6' }),
      React.createElement(NavIcon, { id: 'log',    label: 'Log',     path: 'M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2 M9 5a2 2 0 0 0 2 2h2a2 2 0 0 0 2-2 M9 5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2 M12 12h.01 M12 16h.01' }),
      videosEnabled && React.createElement(NavIcon, { id: 'videos', label: 'Chugs', path: 'M15 10l4.553-2.276A1 1 0 0 1 21 8.723v6.554a1 1 0 0 1-1.447.894L15 14M3 8a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8z' })
    ),
    toast && React.createElement(Toast, { msg: toast }),

    // Settings modal
    showSettings && React.createElement('div', {
      style: { position: 'fixed', inset: 0, zIndex: 500, display: 'flex', flexDirection: 'column', background: 'var(--bg)' }
    },
      // Settings header
      React.createElement('div', { className: 'header', style: { display: 'flex', alignItems: 'center', gap: '0.75rem' } },
        React.createElement('button', {
          onClick: () => setShowSettings(false),
          style: { background: 'none', border: 'none', color: 'var(--muted)', cursor: 'pointer', fontSize: '1.2rem', padding: '4px 8px', lineHeight: 1 }
        }, '←'),
        React.createElement('div', { className: 'header-title-main' }, 'Settings')
      ),
      React.createElement('div', { style: { flex: 1, overflowY: 'auto' } },
        React.createElement(SettingsScreen, { currentUser: username, onSignOut: () => { setShowSettings(false); onSignOut(); }, showToast })
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));

// ── Service Worker + Push ─────────────────────────────────────────────────

// ── Splash ────────────────────────────────────────────────────────────────
(function () {
  const splashEl  = document.getElementById('splash');
  const progressBar = document.getElementById('splash-progress-bar');
  const mugEl     = splashEl ? splashEl.querySelector('.splash-mug') : null;
  if (!splashEl) return;

  const MIN_MS = 1200;
  const start  = Date.now();
  let dismissed = false;

  // Safety valve — dismiss after 12s no matter what
  const safetyTimer = setTimeout(() => {
    window._dismissSplash && window._dismissSplash();
  }, 12000);

  function dismiss() {
    if (dismissed) return;
    dismissed = true;
    clearTimeout(safetyTimer);

    // Snap progress bar to 100%
    if (progressBar) {
      progressBar.style.animation = 'none';
      progressBar.style.width = '100%';
    }

    const elapsed = Date.now() - start;
    const delay   = Math.max(0, MIN_MS - elapsed);
    setTimeout(() => {
      // Stop mug just before fade so it doesn't freeze mid-spin visibly
      if (mugEl) mugEl.style.animation = 'none';
      splashEl.classList.add('fade-out');
      splashEl.addEventListener('transitionend', () => {
        splashEl.classList.add('hidden');
      }, { once: true });
    }, delay);
  }

  window._dismissSplash = dismiss;
})();

async function registerPush(accessToken) {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
    console.log('[PUSH] Push not supported in this browser');
    return;
  }
  try {
    // Register SW and wait until it is active before subscribing
    const reg = await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;

    const permission = await Notification.requestPermission();
    if (permission !== 'granted') {
      console.log('[PUSH] Notification permission denied');
      return;
    }

    const keyRes = await fetch(`${BACKEND}/push/vapid-public-key`);
    const { key } = await keyRes.json();
    const vapidKey = Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/')), c => c.charCodeAt(0));

    // Check for an existing subscription first
    let sub = await reg.pushManager.getSubscription();

    if (sub) {
      // iOS can silently rotate the endpoint — detect by comparing applicationServerKey
      const existingKeyBuffer = sub.options && sub.options.applicationServerKey;
      if (existingKeyBuffer) {
        const existingKey = btoa(String.fromCharCode(...new Uint8Array(existingKeyBuffer)))
          .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
        const incomingKey = key.replace(/=+$/, '');
        if (existingKey !== incomingKey) {
          // VAPID key mismatch — unsubscribe and re-subscribe with fresh keys
          console.log('[PUSH] VAPID key mismatch, resubscribing');
          await sub.unsubscribe();
          sub = null;
        }
      }
    }

    if (!sub) {
      sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: vapidKey });
    }

    // Always save to backend — ensures any rotated endpoint is updated in DB
    await fetch(`${BACKEND}/push/subscribe`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${accessToken}` },
      body: JSON.stringify(sub.toJSON())
    });
    console.log('[PUSH] Subscription registered');
  } catch (e) {
    console.error('Push registration failed:', e);
  }
}

window.registerPush = registerPush;
